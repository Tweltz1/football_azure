name: HoodProtocol
options:
  bundleIdPrefix: com.tweltz1
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SUPABASE_URL: "https:/$()/nkwedlskhnojseeroezm.supabase.co"
    SUPABASE_ANON_KEY: ""
packages:
  RogueEngine:
    path: Engine
targets:
  HoodProtocol:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: RogueEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tweltz1.hoodprotocol
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
