      next();
    }
    else if (b.hasAttribute('data-home')) { step = -1; intro(); }
    else if (b.hasAttribute('data-back')) { save(); step--; while (step >= 0 && !shown(Q[step])) step--; step < 0 ? intro() : ask(); }
  });
  card.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); var g = card.querySelector('.step > [data-go]'); if (g) g.click(); else next(); } });
  intro();
})();
</script>
</body>
</html>
