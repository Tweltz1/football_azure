<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your sample website · Weltzcraft Studios</title>
<meta name="description" content="A sample small-business website built live by Weltzcraft Studios from a few answers.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Baloo+2:wght@700;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--c:#e0662a;--cd:color-mix(in srgb,var(--c) 70%,#000);--cl:color-mix(in srgb,var(--c) 10%,#fff);--ink:#1a1916;--mut:#62605a;--line:#ebe7df;--bg:#fbfaf7;--card:#fff;--fd:"Bricolage Grotesque",system-ui,sans-serif;--fb:"Inter",system-ui,-apple-system,sans-serif}
.serif{--fd:"Fraunces",Georgia,serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--fb);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--fd);line-height:1.08;margin:0;letter-spacing:-.01em}
.eyebrow{font:700 12px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin:0 0 12px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:999px;background:var(--c);color:#fff;font:700 15px/1 var(--fb);text-decoration:none;border:0;cursor:pointer;box-shadow:0 12px 28px -12px var(--c);transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px);background:var(--cd)}
.btn.ghost{background:rgba(255,255,255,.14);box-shadow:none;border:1px solid rgba(255,255,255,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* weltzcraft strip */
.wz{background:#12100c;color:#f6efe2;font-size:13.5px}
.wz .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-top:9px;padding-bottom:9px;flex-wrap:wrap}
.wz b{color:#ffb15c}
.wz a{color:#12100c;background:#ff9a4a;padding:6px 14px;border-radius:999px;text-decoration:none;font-weight:700;white-space:nowrap}
.wz a.back{background:none;color:#cfc6b6;padding:6px 4px;font-weight:600}
/* header */
.hd{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 19px/1 var(--fd);min-width:0}
.logo i{width:38px;height:38px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 15px var(--fb);font-style:normal;flex:none}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd nav{margin-left:auto;display:flex;gap:26px;font-weight:500;font-size:15px}
.hd nav a{text-decoration:none;color:var(--mut)}
.hd nav a:hover{color:var(--ink)}
.hd .btn{padding:11px 18px;font-size:14px;white-space:nowrap}
/* hero */
.hero{position:relative;min-height:min(82vh,720px);display:grid;align-items:end;color:#fff;overflow:hidden;background:var(--cd)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);animation:kb 18s ease-out both}
@keyframes kb{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,.25) 40%,rgba(0,0,0,.78) 100%)}
.hero .wrap{position:relative;z-index:1;padding-top:120px;padding-bottom:72px;width:100%}
.hero .eyebrow{color:#fff;opacity:.85}
.hero h1{font-size:clamp(44px,7.4vw,92px);max-width:13ch;text-wrap:balance}
.hero p.lead{font-size:clamp(17px,2vw,21px);max-width:36ch;margin:18px 0 28px;opacity:.92}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:28px;flex-wrap:wrap;margin-top:36px;font-size:14px;opacity:.92}
.trust b{font-size:17px;display:block;font-family:var(--fd)}
/* sections */
section{padding:96px 0}
.sec-h{max-width:620px;margin-bottom:44px}
.sec-h h2{font-size:clamp(32px,4.4vw,48px)}
.sec-h p{color:var(--mut);font-size:17px;margin:14px 0 0}
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.about .ph{border-radius:24px;overflow:hidden;aspect-ratio:4/5;background:var(--cl);box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}
.about .ph img{width:100%;height:100%;object-fit:cover}
.about p{color:var(--mut);font-size:17px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.facts b{display:block;font:800 26px/1 var(--fd);color:var(--c)}
.facts small{color:var(--mut)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.item{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s}
.item:hover{transform:translateY(-3px);box-shadow:0 24px 40px -26px rgba(0,0,0,.3)}
.item .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item h3{font-size:22px}
.item .price{font:800 20px var(--fd);color:var(--c);white-space:nowrap}
.item p{color:var(--mut);margin:0;font-size:15px}
.tint{background:var(--cl)}
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;height:520px}
.gal div{border-radius:20px;overflow:hidden;background:color-mix(in srgb,var(--c) 22%,#fff)}
.gal div:first-child{grid-row:span 2}
.gal div:nth-child(4){grid-column:span 2}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.gal div:hover img{transform:scale(1.05)}
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.rev{background:var(--card);border-radius:22px;padding:28px;border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.rev .st{color:#f2a10c;letter-spacing:2px}
.rev p{margin:0;font-size:16.5px}
.rev .who{display:flex;align-items:center;gap:10px;margin-top:auto;font-size:14px;color:var(--mut)}
.rev .who i{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 13px var(--fb);font-style:normal}
.visit{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px}
.hours{list-style:none;padding:0;margin:18px 0 0}
.hours li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.hours li:last-child{border:0}
.map{border-radius:22px;min-height:340px;position:relative;overflow:hidden;background:#e9ece4}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;left:50%;top:48%;transform:translate(-50%,-100%);text-align:center}
.pin i{display:block;width:34px;height:34px;margin:0 auto;border-radius:50% 50% 50% 0;background:var(--c);transform:rotate(-45deg);box-shadow:0 8px 18px -6px rgba(0,0,0,.5)}
.pin span{display:inline-block;margin-top:12px;background:#fff;padding:7px 12px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.band{background:var(--cd);color:#fff;text-align:center;padding:84px 0}
.band h2{font-size:clamp(30px,4vw,46px)}
.band p{opacity:.85;margin:12px 0 26px}
.band .btn{background:#fff;color:var(--cd)}
footer{padding:40px 0 60px;color:var(--mut);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.credit{font-size:12px;opacity:.75}
@media (max-width:860px){
  .hd nav{display:none}.hd .btn{margin-left:auto}
  .about,.visit{grid-template-columns:1fr;gap:32px}.about .ph{aspect-ratio:4/3}
  .items,.revs{grid-template-columns:1fr}
  .gal{grid-template-columns:1fr 1fr;grid-template-rows:auto;height:auto}
  .gal div{aspect-ratio:1}.gal div:first-child{grid-column:span 2;grid-row:auto;aspect-ratio:16/10}.gal div:nth-child(4){grid-column:span 2;aspect-ratio:16/10}.gal.g3{grid-template-columns:1fr 1fr}
  section{padding:68px 0}
  .facts b{font-size:21px}
}
/* saved previews: share, no-photo look, FAQ, expired */
.wz button.share{background:none;border:1px solid #5a5244;color:#f6efe2;padding:5px 12px;border-radius:999px;font:600 13px var(--fb);cursor:pointer}
.nophoto .hero{background:radial-gradient(circle at 80% 10%,color-mix(in srgb,var(--c) 60%,#fff) 0,transparent 45%),linear-gradient(140deg,var(--c),var(--cd) 70%,#111)}
.nophoto .hero::after{background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.35))}
.tile{width:100%;height:100%;min-height:260px;display:grid;place-items:center;font-size:clamp(90px,14vw,150px);background:radial-gradient(circle at 30% 20%,#fff 0,transparent 55%),linear-gradient(150deg,var(--cl),color-mix(in srgb,var(--c) 30%,#fff))}
.faq{display:grid;gap:12px;max-width:820px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px}
.faq summary{cursor:pointer;font:700 17px/1.35 var(--fb);list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--c);font-size:22px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{margin:10px 0 0;color:var(--mut)}
.gone-box{max-width:560px;margin:12vh auto;padding:0 20px;text-align:center}
.gone-box .tile{width:120px;height:120px;min-height:0;margin:0 auto 24px;border-radius:30px;font:800 64px/1 var(--fd);color:var(--c)}
.gone-box h1{font-size:clamp(30px,5vw,42px);margin-bottom:12px}
.gone-box p{color:var(--mut);margin:0 0 24px}
.btn.ghost-d{background:none;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.wz a.golive{background:linear-gradient(135deg,#ff8a3c,#ffc061)}
.map.real{padding:0;overflow:hidden}
.map.real iframe{width:100%;height:100%;min-height:340px;border:0;display:block}
/* ---- built-in sections: how it works, service area, booking, forms ---- */
[hidden]{display:none!important}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px}
.steps i{width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:800 18px var(--fb);font-style:normal;margin-bottom:16px}
.steps h3{font-size:21px;margin-bottom:8px}
.steps p{margin:0;color:var(--mut);font-size:15px}
.areas{list-style:none;display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0}
.areas li{padding:10px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600}
.areas li:first-child{background:var(--c);color:#fff;border-color:var(--c)}
.bk{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start}
.bk-l,.bk-r{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;min-width:0}
.bk-h{font:700 15px var(--fb);margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.bk-h:first-child{margin-top:0}
.bk-h b{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.time,.day{font:600 14.5px var(--fb);border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:10px 16px;cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover,.time:hover:not(:disabled),.day:hover{border-color:var(--c)}
.chip small{color:var(--mut);font-weight:500}
.chip.on,.time.on,.day.on{border-color:var(--c);background:var(--c);color:#fff}
.chip.on small,.day.on small{color:#fff;opacity:.85}
.daystrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.day{border-radius:16px;padding:10px 0;min-width:62px;display:grid;gap:2px;text-align:center;flex:none;scroll-snap-align:start}
.day b{font:800 20px/1.1 var(--fd)}
.day small{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.time{padding:10px 0;border-radius:12px;text-align:center}
.time:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.hint{color:var(--mut);margin:0;grid-column:1/-1;font-size:15px}
.bk label,.ask label{display:block;font:600 13.5px var(--fb);color:var(--mut);margin-bottom:14px}
.bk label small,.ask label small{font-weight:500}
.bk input,.bk textarea,.ask input,.ask textarea{display:block;width:100%;margin-top:6px;font:500 16px var(--fb);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.bk input:focus,.bk textarea:focus,.ask input:focus,.ask textarea:focus{outline:none;border-color:var(--c)}
.bk textarea,.ask textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.bk-sum{font-weight:700;margin:4px 0 10px;min-height:1.6em}
.err{color:#c2362b;font-weight:600;margin:0 0 10px;font-size:14.5px}
.err:empty{display:none}
.bk .btn,.ask form .btn{width:100%;justify-content:center}
.btn:disabled{opacity:.6;cursor:wait}
.sent{text-align:center;padding:44px 26px;background:var(--card);border:1px solid var(--line);border-radius:22px}
.tick{width:64px;height:64px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 16px}
.sent h3{font-size:26px;margin-bottom:8px}
.sent p{color:var(--mut);margin:0 auto;max-width:54ch}
.sent p.demo{margin-top:18px;background:var(--cl);border-radius:14px;padding:12px 16px;font-size:14.5px;color:var(--ink);text-align:left}
.ask{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:start}
.ask .sec-h{margin:0}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.why div{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.why span{font-size:30px;display:block;margin-bottom:12px}
.why h3{font-size:19px;margin-bottom:6px}
.why p{margin:0;color:var(--mut);font-size:14.5px}
.deliv{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:32px}
.deliv .btn{box-shadow:none}
.deliv .dl-doordash{background:#eb1700}
.deliv .dl-ubereats{background:#142328}
.deliv .dl-grubhub{background:#f63440}
.od{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start}
.od-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.od-row:last-child{border:0}
.od-row div{flex:1;min-width:0}
.od-row b{display:block}
.od-row small{color:var(--mut)}
.qty{display:flex;align-items:center;gap:10px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:700 18px/1 var(--fb);cursor:pointer}
.qty button:hover{border-color:var(--c)}
.qty output{min-width:18px;text-align:center;font-weight:700}
.bk select{display:block;width:100%;margin-top:6px;font:500 16px var(--fb);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.social{margin:14px 0 0;display:flex;gap:14px;flex-wrap:wrap;font-weight:600;font-size:14.5px}
.social a{color:var(--c)}
.gal.g3{grid-template-columns:2fr 1fr}
.mbar{display:none}
/* ---- page tops ---- */
.htile{display:grid;place-items:center;font-size:clamp(90px,14vw,170px);background:radial-gradient(circle at 30% 20%,#fff 0,transparent 55%),linear-gradient(150deg,var(--cl),color-mix(in srgb,var(--c) 35%,#fff))}
.hero>.htile{display:none}
.h-split .hero,.h-split.nophoto .hero{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;background:var(--bg);color:var(--ink);min-height:0;padding:56px max(20px,calc((100vw - 1140px)/2 + 20px)) 64px}
.h-split .hero::after{display:none}
.h-split .hero>img,.h-split .hero>.htile{display:grid;position:relative;inset:auto;order:2;width:100%;height:auto;aspect-ratio:1/1.08;max-height:560px;border-radius:28px;transform:none;animation:none;object-fit:cover;box-shadow:0 40px 70px -40px rgba(0,0,0,.5)}
.h-split .hero>img{display:block}
.h-split .hero .wrap{padding:16px 44px 16px 0;margin:0;max-width:none}
.h-split .hero .eyebrow{color:var(--c);opacity:1}
.h-split .hero h1{font-size:clamp(40px,5.6vw,76px)}
.h-split .hero .btn.ghost{background:none;color:var(--ink);border-color:var(--line);-webkit-backdrop-filter:none;backdrop-filter:none}
.h-center .hero{text-align:center;align-items:center;min-height:min(76vh,660px)}
.h-center .hero .wrap{padding-top:96px}
.h-center .hero h1{max-width:16ch;margin:0 auto}
.h-center .hero p.lead{max-width:46ch;margin-left:auto;margin-right:auto}
.h-center .hero .cta,.h-center .trust{justify-content:center}
.h-center .hero::after{background:rgba(0,0,0,.56)}
.h-center.nophoto .hero::after{background:none}
.h-split.nophoto .about{grid-template-columns:1fr;max-width:820px}
.h-split.nophoto .about .ph{display:none}
/* ---- price list look ---- */
.i-menu .items{grid-template-columns:1fr 1fr;gap:0 56px}
.i-menu .item,.i-menu .item:hover{background:none;border:0;border-bottom:1px dashed color-mix(in srgb,var(--ink) 24%,transparent);border-radius:0;padding:18px 0;gap:4px;transform:none;box-shadow:none}
.i-menu .item h3{font-size:19px}
/* ---- styles (the AI picks one for the business; the maker can switch) ---- */
.v-clean{--bg:#fff;--ink:#0f172a;--mut:#55607a;--line:#e5e9f0;--cl:color-mix(in srgb,var(--c) 6%,#f5f7fa);--fd:"Manrope",system-ui,sans-serif}
.v-clean h1,.v-clean h2{letter-spacing:-.03em}
.v-clean .btn{border-radius:10px}
.v-clean .item,.v-clean .rev,.v-clean .card,.v-clean .facts div,.v-clean .faq details,.v-clean .steps li,.v-clean .bk-l,.v-clean .bk-r,.v-clean .sent{border-radius:12px}
.v-clean .about .ph,.v-clean .gal div,.v-clean .map,.v-clean .hero>img,.v-clean .hero>.htile{border-radius:14px}
.v-clean .logo i{border-radius:8px}
.v-bold{--bg:#0e0f12;--card:#17191e;--ink:#f4f4f1;--mut:#a3a6ad;--line:#2a2d34;--cl:#14161a;color-scheme:dark}
.v-bold h1,.v-bold h2{text-transform:uppercase;letter-spacing:-.02em}
.v-bold .btn{border-radius:8px}
.v-bold .band{background:var(--c)}
.v-bold .band .btn{color:#111}
.v-bold .pin span{color:#111}
.v-bold .item,.v-bold .rev,.v-bold .card,.v-bold .facts div,.v-bold .faq details,.v-bold .steps li,.v-bold .bk-l,.v-bold .bk-r,.v-bold .sent{border-radius:10px}
.v-bold .facts b,.v-bold .item .price,.v-bold .eyebrow{color:color-mix(in srgb,var(--c) 70%,#fff)}
.v-bold .hero .eyebrow{color:#fff}
.v-bold .tile,.v-bold .htile{background:linear-gradient(150deg,#1d2026,color-mix(in srgb,var(--c) 45%,#111))}
.v-classic{--bg:#faf7f1;--line:#e6dfd2}
.v-classic h1,.v-classic h2{font-weight:600}
.v-classic .eyebrow{letter-spacing:.24em;font-weight:600}
.v-classic .btn{border-radius:3px;text-transform:uppercase;letter-spacing:.1em;font-size:13px;box-shadow:none}
.v-classic .item,.v-classic .rev,.v-classic .card,.v-classic .facts div,.v-classic .faq details,.v-classic .steps li,.v-classic .bk-l,.v-classic .bk-r,.v-classic .sent,.v-classic .about .ph,.v-classic .gal div,.v-classic .map,.v-classic .hero>img,.v-classic .hero>.htile{border-radius:4px}
