<!doctype html><html><head>
<!-- Junk App icon (1024x1024, no transparency). Rendered to ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
     and, smaller on the app's background color, to the launch screen (Splash.imageset). -->
<style>html,body{margin:0;background:#f5f3ee}svg{display:block}</style></head><body>
<svg id="icon" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1fa34f"/><stop offset="1" stop-color="#0e5c2b"/></linearGradient>
 <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d6a6"/><stop offset="1" stop-color="#d9b47a"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7b47b"/><stop offset="1" stop-color="#bf965c"/></linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<circle cx="512" cy="560" r="330" fill="#ffffff" opacity="0.07"/>
<!-- open cardboard box -->
<g stroke="#5b3d16" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
 <path d="M262 470 L512 400 L762 470 L512 545 Z" fill="#a7814c"/>
 <!-- items peeking out: lamp shade and chair back -->
 <path d="M420 470 L452 330 L560 330 L594 470 Z" fill="#f6efe0"/>
 <path d="M600 470 L612 300 L690 300 L700 470" fill="#e27a3f"/>
 <path d="M262 470 L262 720 L512 800 L512 545 Z" fill="url(#front)"/>
 <path d="M762 470 L762 720 L512 800 L512 545 Z" fill="url(#side)"/>
 <!-- flaps -->
 <path d="M262 470 L180 560 L430 640 L512 545 Z" fill="#e8c890"/>
 <path d="M762 470 L844 560 L594 640 L512 545 Z" fill="#cfa86c"/>
</g>
<!-- FREE tag on a string -->
<path d="M700 300 C760 240 800 230 820 250" fill="none" stroke="#f5f3ee" stroke-width="10" stroke-linecap="round"/>
<g transform="translate(712 150) rotate(14)">
 <rect x="0" y="0" width="250" height="118" rx="26" fill="#d9f45c" stroke="#1b2a05" stroke-width="12"/>
 <circle cx="34" cy="59" r="13" fill="#1b2a05"/>
 <text x="142" y="84" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="#1b2a05">FREE</text>
</g>
</svg>
</body></html>
