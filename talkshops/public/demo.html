<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}.sample-art{margin:10px 0;max-width:260px}.sample-art img{display:block;width:100%;height:auto;border-radius:8px}.sample-art figcaption{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.4}
</style>
<title>Talk Shops Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar with view tabs; shop board of stage columns; job detail as a side sheet; customer view in a phone frame */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --fg:#17202b; --muted:#5a6676; --line:#d6dce3;
  --accent:#1d5cbb; --accent-fg:#ffffff; --accent-soft:#e5eefb;
  --warn:#a85407; --warn-bg:#fcefdc; --ok:#1d7448; --ok-bg:#e1f2e8; --bad:#b3261e; --bad-bg:#fbe7e5;
  --bubble-out:#1d5cbb; --bubble-out-fg:#ffffff; --bubble-in:#e7ebf0;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#18202a; --surface-2:#1e2833; --fg:#e5eaf0; --muted:#93a1b2; --line:#2b3642;
  --accent:#6ea3ff; --accent-fg:#0b1322; --accent-soft:#1a2a45;
  --warn:#f2a650; --warn-bg:#3a2912; --ok:#5fca92; --ok-bg:#14301f; --bad:#ff8a80; --bad-bg:#3d1a18;
  --bubble-out:#2f6fd6; --bubble-out-fg:#ffffff; --bubble-in:#26313d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#18202a; --surface-2:#1e2833; --fg:#e5eaf0; --muted:#93a1b2; --line:#2b3642;
  --accent:#6ea3ff; --accent-fg:#0b1322; --accent-soft:#1a2a45;
  --warn:#f2a650; --warn-bg:#3a2912; --ok:#5fca92; --ok-bg:#14301f; --bad:#ff8a80; --bad-bg:#3d1a18;
  --bubble-out:#2f6fd6; --bubble-out-fg:#ffffff; --bubble-in:#26313d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.02em}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand h1{font-size:22px;line-height:1}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.demo-note{font-size:12.5px;color:var(--muted);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}

main{padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* board */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;min-width:min-content}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px}
.col-h h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.col-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.col.is-approval{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.col.is-ready{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%;box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent)}
.card .veh{font-weight:600}
.card .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.empty-col{font-size:13px;color:var(--muted);padding:6px 4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);width:max-content}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}

/* side sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:24px;line-height:1.1}
.sheet-body>*{min-width:0}
.sheet-body{overflow-y:auto;overflow-x:hidden;padding:16px 18px 30px;display:flex;flex-direction:column;gap:22px}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:34px;height:34px;flex:none;font-size:18px;line-height:1}
.sec h3{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 6px;font-size:13px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2}
.step.done{color:var(--fg)}
.step.done::before{content:"✓ ";color:var(--ok)}
.step.current{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.step:not(.current):hover{border-color:var(--accent);color:var(--fg)}
@media (max-width:420px){.stepper{grid-template-columns:repeat(2,minmax(0,1fr))}}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

table.est{width:100%;border-collapse:collapse;font-size:14px}
table.est td,table.est th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.est th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
table.est td.num,table.est th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.add-line{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,100px) auto;gap:6px;margin-top:8px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.field input,.field select,.field textarea,.add-line input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;font-weight:400;font-size:15px;min-width:0}
.field textarea{resize:vertical;min-height:70px}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.photo{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);font-size:12.5px}
.photo .img{aspect-ratio:4/3;width:100%;display:block;object-fit:cover;max-width:100%}
.photo figcaption{padding:5px 8px}
.photo-add{border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;aspect-ratio:4/3;color:var(--muted);font-weight:600;font-size:13px;text-align:center;padding:8px;cursor:pointer;max-width:100%}
.photo-add:hover{border-color:var(--accent);color:var(--accent)}

.thread{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:86%;padding:8px 12px;border-radius:14px;font-size:14px;overflow-wrap:anywhere}
.bubble.out{align-self:flex-end;background:var(--bubble-out);color:var(--bubble-out-fg);border-bottom-right-radius:4px}
.bubble.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:4px}
.bubble .meta{display:block;font-size:11.5px;opacity:.75;margin-top:3px}
.bubble a,.bubble .lnk{color:inherit;text-decoration:underline;font-weight:600;background:none;border:0;padding:0}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.log li{display:grid;grid-template-columns:72px 1fr;gap:10px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}

/* modal */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(10,15,22,.5)}
.modal-card{background:var(--surface);border-radius:12px;width:min(480px,100%);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.modal-card h2{font-size:22px}
.modal-card textarea{min-height:120px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:400}

/* check-in */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:760px}
.panel h2{font-size:26px;margin-bottom:4px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}

/* customer phone */
.cust-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.cust-page{width:min(480px,100%);margin:0 auto}
.cust-page .c-head{border-radius:0 0 14px 14px}
.cust-demo{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:4px 12px}
.login-wrap{min-height:100%;display:grid;place-items:center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.login .brand{margin:0}
.login h2{font-size:28px;margin-top:6px}
.auth-alt{display:flex;flex-direction:column;gap:8px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.form-err{color:var(--bad);font-size:13.5px;margin:0}
.form-ok{color:var(--ok);font-size:13.5px;margin:0}
#smartSettings{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;display:flex;flex-direction:column;gap:8px}
#smartSettings legend{font-weight:700;padding:0 6px}
#smartSettings .hint{font-size:13px;color:var(--muted)}
#smartSettings details{display:flex;flex-direction:column;gap:8px}
#smartSettings .btn-row label{display:inline-flex;gap:4px;align-items:center;font-size:14px}
.demo-creds{font-size:13px;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.signout{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600}
@media (max-width:560px){.tabs{order:3;width:100%}.tab{flex:1;padding:6px 8px}}
.cust-pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.cust-pick select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;max-width:100%}
.phone{width:min(390px,100%);background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:10px;box-shadow:var(--shadow)}
.phone-in{border-radius:20px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.url{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:center;padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.c-head{background:var(--accent);color:var(--accent-fg);padding:16px}
.c-head small{opacity:.85;font-size:13px}
.c-head h2{font-size:26px;line-height:1.1;margin-top:4px}
.c-body{padding:14px;display:flex;flex-direction:column;gap:14px}
.c-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.c-card h3{font-size:16px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;padding:5px 0;position:relative;font-size:14px}
.tl li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:4px;grid-column:1}
.tl li.done::before{background:var(--ok);border-color:var(--ok)}
.tl li.current::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl li:not(:last-child)::after{content:"";position:absolute;left:5px;top:20px;bottom:-6px;width:2px;background:var(--line)}
.tl li.done:not(:last-child)::after{background:var(--ok)}
.tl li.todo{color:var(--muted)}
.tl time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.decide{display:flex;gap:6px;margin-top:6px}
.decide button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px;font-weight:600;font-size:13px}
.decide button[aria-pressed="true"].yes{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.decide button[aria-pressed="true"].no{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.est-item{padding:8px 0;border-bottom:1px solid var(--line)}
.est-item:last-of-type{border-bottom:0}
.est-item .top{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.est-item .top span:last-child{font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding-top:8px;font-variant-numeric:tabular-nums}
.call{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.call b{font-family:var(--f-mono);user-select:all}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px)}}}
/* matches the real app (index.html) */
button.stat{text-align:left;color:var(--fg)}
@media (max-width:700px){.board{grid-auto-flow:row;grid-template-columns:minmax(0,1fr);min-width:0}.col{min-height:0}.col:has(.empty-col){display:none}}
.photo{margin:0}
.field .hint{font-weight:400;font-size:12.5px;color:var(--muted)}
.est-add{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.est-add-h{font-size:13px;font-weight:600}
.est-add .add-line{margin-top:0}
.est-add-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.est-add-or::before,.est-add-or::after{content:"";flex:1;border-top:1px solid var(--line)}
.est-add-more{width:100%;justify-content:center}
.est-send{margin-top:12px;width:100%;justify-content:center}
.total.sub{font-weight:400;font-size:14px;color:var(--muted);padding-top:2px}
a.btn{color:var(--fg);text-decoration:none;display:inline-flex;align-items:center}
a.btn.primary{color:var(--accent-fg)}
.notice{background:var(--warn-bg);color:var(--fg);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.empty-board{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.cust-top{font-size:12.5px;color:var(--muted);text-align:center;padding:8px}
#setupForm.panel{display:flex;flex-direction:column;gap:14px}
/* demo-only: saved items list in Settings */
.rates{width:100%;border-collapse:collapse;font-size:14px}
.rates td,.rates th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.rates th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.rates td.num,.rates th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rate-add{display:grid;grid-template-columns:minmax(0,1fr) 110px 100px auto;gap:6px;margin-top:10px}
.rate-add input,.rate-add select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;font-size:15px;min-width:0}
@media (max-width:560px){.rate-add{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.import-box{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.settings-wrap{display:flex;flex-direction:column;gap:16px;max-width:760px}
</style>

<style>
.queue-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.queue-top h2{width:auto;flex:1}
.queue-filters.stats{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}

    ui.modal={job:j.id,stage:t.dataset.stage,text:fillTemplate(t.dataset.stage,j)};renderLayer();return}
  if(t.dataset.del){const j=job(ui.openJob);j.estimate=j.estimate.filter(x=>String(x.id)!==t.dataset.del);save();renderLayer();return}
  if(t.dataset.delRate){state.rates.splice(Number(t.dataset.delRate),1);save();render();return}
  if(t.dataset.removeNote){const j=job(ui.openJob);j.notes=j.notes.filter(n=>String(n.id)!==t.dataset.removeNote);save();renderLayer();return}
  if(t.dataset.dictate)return;
  if(t.id==="viewAsCust"||t.dataset.golink){const j=job(t.dataset.golink||ui.openJob);ui.backTo=j.id;ui.backView=ui.view;location.hash="s-"+j.token;window.scrollTo(0,0);return}
  if(t.id==="backToShop"){ui.view=ui.backView||"board";ui.openJob=ui.backTo||null;history.pushState(null,"",location.pathname+location.search);render();return}
  if(t.id==="closeJobBtn"){ui.modal={closeJob:ui.openJob};renderLayer();return}
  if(t.id==="reopenBtn"){const j=job(ui.openJob);delete j.archivedAt;delete j.closed;if(j.stage==="picked_up"){j.stage="checked_in";j.events.push({stage:"checked_in",t:Date.now()})}save();ui.view="board";render();toast(j.ro+" is back on the board");return}
  if(t.id==="makeBill"){const j=job(ui.openJob);const items=j.estimate.filter(e=>e.status==="approved");if(!items.length){toast("Approve at least one estimate line first, or add lines in the bill editor in your shop.");return}
    j.bill={mode:"generated",total:Math.round(estTotal(j,true)*1.0725*100)/100};save();renderLayer();toast("Itemized bill created from the approved work, with tax");return}
  if(t.id==="uploadBill"){toast("In your shop, choose the invoice PDF from your shop system. The customer opens it from their link.");return}
  if(t.id==="laborBtn"){toast("In your shop, this opens the line editor: labor hours times your rate, part quantities, fees and percentages.");return}
  if(t.id==="rateTemplate"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["name,type,rate\nTechnician labor,labor,125.00\nShop supplies,fee,12.50\nOil filter,part,16.00\n"],{type:"text/csv"}));a.download="shop-rates.csv";document.body.appendChild(a);a.click();a.remove();return}
  if(t.id==="ci-fill"){const v={name:"Sam Ortiz",phone:"(555) 019-4410",year:"2014",make:"Mazda",model:"CX-5",plate:"3CXF882",concern:"Squealing belt noise on cold start"};for(const k in v)$("#ci-"+k).value=v[k];$("#ci-consent").checked=true;return}
  if(t.dataset.decide){const j=job(ui.custJob);ui.draft[j.id+"-"+t.dataset.decide]=t.dataset.v;const sig=$("#sig")?.value;if(sig!=null)ui.draft[j.id+"-sig"]=sig;render();return}
  if(t.id==="submitApproval"){const j=job(ui.custJob);const sig=($("#sig").value||"").trim();
    if(sig.length<3){toast("Type your full name to sign");$("#sig").focus();return}
    let yes=0;j.estimate.forEach(x=>{if(x.status==="pending"){x.status=ui.draft[j.id+"-"+x.id];if(x.status==="approved")yes++}});
    j.approval={by:sig,t:Date.now()};
    j.messages.push({dir:"in",t:Date.now(),text:`Approved ${yes} of ${j.estimate.length} items on the estimate (signed: ${sig}).`});
    save();toast("Sent to "+SHOP.name);render();return}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(howTo.submit(f,render))return;
  if(f.id==="walkForm"){const m=ui.modal,body=window.Walkthrough.body(m.walk),j=job(m.job);
    if(!body.items.length){toast("Mark at least one item first");return}
    const w={t:Date.now(),by:"Marcus Hill",mileage:body.mileage,summary:body.summary,items:body.items};
    if(body.send){w.sentAt=Date.now();notify(j,`Hi ${first(j.customer.name)}, your ${body.kind==="before"?"check-in":"after-repair"} walk-through for your ${vehicleStr(j)} is ready: ${linkOf(j)}`)}
    (j.walkthroughs||={})[body.kind]=w;
    ui.modal=null;save();renderLayer();toast("Walk-through saved"+(body.send?". Customer notified.":" to the customer's page"));return}
  if(f.id==="teamInviteForm"){team.submit(f,render);return}
  if(f.id==="recoveryPhoneForm"){const ph=$("#rc-phone").value.trim();if(ph.replace(/\D/g,"").length<10){toast("Enter a 10-digit mobile number");return}Object.assign(recov(),{phone:ph,pending:ph});save();render();toast("Demo shop: no text is sent. Use code 123456.");$("#rc-code")?.focus();return}
  if(f.id==="recoveryCodeForm"){if($("#rc-code").value.replace(/\D/g,"")!=="123456"){toast("That code doesn't match. In the demo, use 123456.");return}Object.assign(recov(),{verified:true,pending:""});save();render();toast("Phone verified");return}
  if(f.id==="demoSignin"){ui.reset=null;go("board");toast("Demo shop: signed in");return}
  if(f.id==="forgotForm"){const email=$("#fp-email").value.trim(),channel=e.submitter?.value==="sms"?"sms":"email";
    ui.reset={step:"code",email,msg:channel==="sms"?`If ${email} has a Talk Shops account with a verified phone, we texted a 6-digit code to it.`:`If ${email} has a Talk Shops account, we emailed a 6-digit code to it. Check your spam folder too.`};
    render();toast("Demo shop: nothing is sent. Any 6 digits work here.");$("#fp-code")?.focus();return}
  if(f.id==="resetForm"){if($("#fp-code").value.replace(/\D/g,"").length!==6){toast("Enter the 6-digit code");return}if($("#fp-pass").value.length<8){toast("Use at least 8 characters");return}
    ui.reset=null;go("board");toast("Password changed. You're signed in.");return}
  if(f.id==="checkinForm"){
    const g=k=>$("#ci-"+k).value.trim();const ch=g("channel");
    if(!$("#ci-consent").checked){toast("Confirm the customer agreed to updates first");return}
    const j={id:"RO-"+state.nextRO,ro:"RO-"+state.nextRO,customer:{name:g("name"),phone:ch!=="email"?g("phone"):"",email:ch!=="sms"?g("email"):"",channel:ch,consent:true},vehicle:{year:g("year"),make:g("make"),model:g("model")},plate:g("plate"),concern:g("concern"),urgency:document.querySelector('input[name="ciUrgency"]:checked')?.value||"",stage:"checked_in",token:token(),estimate:[],photos:[],notes:[],events:[],messages:[]};
    state.nextRO++;plan.carsCreated++;const t=Date.now();j.events.push({stage:"checked_in",t});
    notify(j,fillTemplate("checked_in",j),t);
    state.jobs.push(j);save();ui.view="board";ui.openJob=j.id;render();window.scrollTo(0,0);toast("Checked in. "+first(j.customer.name)+" was notified.");return}
  if(f.id==="sendForm"){
    const j=job(ui.modal.job);const eta=$("#m-eta");if(eta)j.eta=eta.value.trim();
    const lbl=STAGES[SI[ui.modal.stage]].label,sent=$("#m-send").checked;
    setStage(j,ui.modal.stage,$("#m-text").value.trim(),sent);
    ui.modal=null;if(j.archivedAt)ui.openJob=null;
    render();toast(`Moved to ${lbl}${sent?". Customer notified.":". No notification sent."}`);return}
  if(f.id==="closeForm"){
    const j=job(ui.modal.closeJob);const t=Date.now();j.closed={reason:$("#c-reason").value,t};j.archivedAt=t;
    if($("#c-send").checked)notify(j,$("#c-text").value.trim(),t);
    ui.modal=null;ui.openJob=null;save();render();toast(j.ro+" closed and moved to the Archive");return}
  if(f.id==="addLine"){const j=job(ui.openJob);const item=$("#li-item").value.trim();const price=parseFloat($("#li-price").value.replace(/[$,]/g,""));
    if(!item||!(price>=0)){toast("Enter an item and a price");return}
    const priority=ui.lastPri=$("#li-pri")?.value||"recommended";
    j.estimate.push({id:Date.now(),item,price,status:"pending",priority});
    if($("#li-save").checked&&!state.rates.some(r=>r.name.toLowerCase()===item.toLowerCase())){state.rates.push({name:item,kind:"part",rate:price});toast(`Saved "${item}" for next time`)}
    save();renderLayer();$("#li-item").focus({preventScroll:true});return}
  if(f.id==="replyForm"){const j=job(ui.openJob);const v=$("#replyIn").value.trim();if(!v)return;notify(j,v);save();renderLayer();toast("Message sent");return}
  if(f.id==="noteForm"){const j=job(ui.openJob);const v=$("#noteIn").value.trim();if(!v)return;j.notes=j.notes||[];j.notes.push({id:Date.now(),t:Date.now(),text:v});
    if($("#noteSend").checked)notify(j,`Hi ${first(j.customer.name)}, your technician added a note about your ${vehicleStr(j)}: ${linkOf(j)}`);
    save();renderLayer();toast("Note posted to the customer's page");return}
  if(f.id==="setupForm"){const ageSettings=window.BayAge.read(f);if(!ageSettings)return;SHOP={...SHOP,ageSettings,name:$("#sh-name").value.trim()||SHOP.name,phone:$("#sh-phone").value.trim(),hours:$("#sh-hours").value.trim(),email:$("#sh-email").value.trim(),smartTopics:Array.from(f.querySelectorAll('[name="smartTopic"]:checked'),el=>el.value),
    smartSchedule:{afterHours:$("#sr-after").checked,days:Array.from(f.querySelectorAll('[name="sr-day"]:checked'),el=>Number(el.value)),open:$("#sr-open").value,close:$("#sr-close").value,signature:$("#sr-sign").value.trim()}};save();render();toast("Shop settings saved");return}
  if(f.id==="rateForm"){const name=$("#r-name").value.trim(),rate=Number($("#r-rate").value.replace(/[$,%\s]/g,""));if(!name||!(rate>=0)){toast("Enter a name and a rate");return}
    state.rates.push({name,kind:$("#r-kind").value,rate});state.rates.sort((a,b)=>a.name.localeCompare(b.name));save();render();toast(`Saved "${name}"`);return}
});
document.addEventListener("change",async e=>{
  if(e.target.id==="ci-channel")syncChannel();
  if(e.target.dataset?.teamRole){team.change(e.target,render);return}
  if(e.target.dataset?.pri&&ui.openJob){const j=job(ui.openJob),x=j&&j.estimate.find(l=>String(l.id)===e.target.dataset.pri);if(x){x.priority=e.target.value;save();renderLayer();toast("Priority updated")}return}
  if(e.target.id==="c-send")$("#c-text-wrap").hidden=!e.target.checked;
  if(e.target.name==="jobUrgency"){const j=job(ui.openJob);j.urgency=e.target.value;save();render();toast(j.urgency?"Urgency set to "+window.BayBoard.URGENCY[j.urgency][0]:"Urgency cleared");return}
  if(e.target.id==="eta"){const j=job(ui.openJob);j.eta=e.target.value.trim();save();render()}
  if(e.target.id==="rateFile"){const file=e.target.files[0];if(!file)return;
    try{const list=await billing.readRateFile(file);const by=new Map(state.rates.map(r=>[r.name.toLowerCase(),r]));list.forEach(r=>by.set(r.name.toLowerCase(),r));state.rates=[...by.values()].sort((a,b)=>a.name.localeCompare(b.name));save();render();toast(`Imported ${list.length} item${list.length===1?"":"s"}`)}
    catch(x){toast(x.message)}}
  if(e.target.id==="photoIn"){const file=e.target.files[0];if(!file)return;const j=job(ui.openJob);if(!j)return;const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");const s=Math.min(1,640/img.width);c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      j.photos.push({src:c.toDataURL("image/jpeg",.8),cap:file.name.replace(/\.[^.]+$/,"")});save();renderLayer();toast("Photo added to customer's page")};img.src=r.result};r.readAsDataURL(file);e.target.value=""}
});

document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(ui.modal){ui.modal=null;renderLayer()}else closeJobSheet()}});
window.addEventListener("hashchange",render);
/* --- walk-around photos (demo: the "AI" suggestions are fixed samples for the sample photos) --- */
const WA_SUGG={
  rear:[{x:.56,y:.6,w:.16,h:.11,kind:"scratch",note:"Rear bumper, passenger side"}],
  left:[{x:.26,y:.51,w:.13,h:.11,kind:"dent",note:"Driver rear door"}],
  front_left:[{x:.82,y:.6,w:.1,h:.08,kind:"scuff",note:"Front bumper, driver corner"}],
  right:[{x:.29,y:.51,w:.17,h:.09,kind:"scuff",note:"Passenger front door"}]};
function waCustomer(j){return{shop:{name:SHOP.name},walkaround:{requested:!!j.walkaroundRequest,canUpload:!!j.walkaroundRequest&&!j.closed&&j.stage!=="picked_up",
  photos:(j.walkaround||[]).map(p=>({...p,marks:p.marks.filter(m=>m.confirmed)}))}}}
const waEncode=file=>new Promise((ok,bad)=>{const r=new FileReader();r.onerror=()=>bad(new Error("Couldn't read that photo"));r.onload=()=>{const img=new Image();img.onerror=()=>bad(new Error("Couldn't read that photo"));
  img.onload=()=>{const sc=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8))};img.src=r.result};r.readAsDataURL(file)});
window.Walkaround.init({esc,toast,first,encode:waEncode,sendResult:()=>"Customer notified.",
  api:async(m,path,body)=>{
    const seg=path.split("/");
    if(seg[1]==="c"){const j=state.jobs.find(x=>x.token===decodeURIComponent(seg[2]));if(!j||!j.walkaroundRequest)throw new Error("This page isn't asking for photos.");
      await new Promise(r=>setTimeout(r,500));j.walkaround=(j.walkaround||[]).filter(p=>p.angle!==body.angle);
      j.walkaround.push({id:"wa-"+body.angle+"-"+Date.now(),angle:body.angle,src:body.src,t:Date.now(),marks:[],aiAt:null});save();return waCustomer(j)}
    const j=job(decodeURIComponent(seg[2])),action=seg[3];if(!j)throw new Error("Car not found");
    if(action==="walkaround-request"){
      if(body.on===false)j.walkaroundRequest=null;
      else{j.walkaroundRequest={t:Date.now()};if(body.send&&j.customer.consent!==false)notify(j,`Hi ${first(j.customer.name)}, could you take a few photos of your ${vehicleStr(j)} for our records? Your page shows where to stand for each one: ${linkOf(j)}`)}}
    if(action==="walkaround-ai"){await new Promise(r=>setTimeout(r,1600));
      for(const p of j.walkaround||[])if(body.photoId?p.id===body.photoId:!p.aiAt){p.aiAt=Date.now();
        const keep=p.marks.filter(x=>x.confirmed||x.source==="shop");
        p.marks=[...keep,...(p.src.startsWith("/demo-art/")?(WA_SUGG[p.angle]||[]):[]).map(x=>({...x,source:"ai",confirmed:false}))]}}
    if(action==="walkaround-marks"){const p=(j.walkaround||[]).find(x=>x.id===body.photoId);if(p)p.marks=body.marks}
    if(action==="walkaround-remove")j.walkaround=(j.walkaround||[]).filter(x=>x.id!==body.photoId);
    save();return j},
  token:()=>job(ui.custJob)?.token,customer:()=>{const j=job(ui.custJob);return j?waCustomer(j):null},setCustomer:()=>{},renderCustomer:()=>render(),
  job,openJob:()=>ui.openJob,onJob:()=>save(),render:()=>{if(location.hash.startsWith("#s-"))render();else renderLayer()}});
setInterval(()=>{if(ui.view==="board"&&!ui.openJob&&!ui.modal&&document.activeElement?.id!=="boardSearch"&&!window.TOUR_ACTIVE)render()},60000);
render();

  const j=job("RO-1041")||state.jobs.find(onBoard);
  if(j){ui.openJob=j.id;renderLayer();const panel=$("#smartDemo");if(panel){panel.open=true;panel.scrollIntoView();}}
}
