nimation-delay:0.55s" d="M-14 -158 q-5 8 0 11 q5 -3 0 -11z" fill="#d22"/><g class="poke"><g stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-34 -128 Q-74 -150 -36 -186" stroke="#16122b" stroke-width="24"/><path d="M-34 -128 Q-74 -150 -36 -186" stroke="#6d6a70" stroke-width="15"/><circle cx="-34" cy="-188" r="10" fill="#f4cfb0" stroke="#16122b" stroke-width="5"/></g></g></svg>