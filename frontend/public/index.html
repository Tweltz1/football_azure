<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0e" />
    <meta
      name="description"
      content="Hood League: fantasy football auction draft room for live league bidding, rosters, and draft results."
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Hood League" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet" />
    <title>Hood League Fantasy Football</title>
    <script>
      // Old smart-TV browsers (Chrome 63 on Samsung Tizen 5) have no globalThis,
      // and Supabase reads it as soon as it loads. Set it before any bundle runs.
      if (typeof globalThis === 'undefined') { window.globalThis = window; }

      // TV browsers: mark the page so TvScreen.css can scale things up.
      (function () {
        var root = document.documentElement;
        if (/SMART-TV|SmartTV|Tizen|Web0S|webOS|NetCast|BRAVIA|HbbTV|CrKey|AFT[A-Z]/i.test(navigator.userAgent)) {
          root.className += ' tv-ua';
        }
        // Old browsers can't do CSS min(), which the party TV screen uses to
        // fit a 16:9 stage inside the window. Work out the same size here;
        // the built CSS falls back to var(--tv-u) (see scripts/css-tv-fallbacks.mjs).
        var hasMin = window.CSS && CSS.supports && CSS.supports('width', 'min(1px, 2px)');
        if (hasMin) return;
        function fit() {
          var unit = Math.min(window.innerWidth / 100, (window.innerHeight * 16) / 9 / 100);
          root.style.setProperty('--tv-u', unit + 'px');
        }
        fit();
        window.addEventListener('resize', fit);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // Old TV browsers: if the app fails to start, show why instead of a blank
      // screen. Plain ES5 on purpose so it runs everywhere.
      (function () {
        var errors = [];
        window.addEventListener('error', function (e) {
          errors.push((e && e.message) || 'Script error');
        });
        function show() {
          var root = document.getElementById('root');
          if (!root || root.childNodes.length) return;
          var box = document.createElement('div');
          box.setAttribute('style', 'max-width:900px;margin:60px auto;padding:24px;font:20px/1.5 sans-serif;color:#fff;background:#1b1d24;border-radius:12px');
          var title = document.createElement('div');
          title.setAttribute('style', 'font-size:28px;font-weight:bold;margin-bottom:12px');
          title.appendChild(document.createTextNode("Hood League couldn't start in this browser"));
          var info = document.createElement('div');
          info.setAttribute('style', 'white-space:pre-wrap;word-break:break-word;opacity:0.85');
          var build = '';
          var scripts = document.getElementsByTagName('script');
          for (var i = 0; i < scripts.length; i += 1) {
            var match = /main\.([0-9a-f]+)\.chunk\.js/.exec(scripts[i].src || '');
            if (match) build = match[1];
          }
          info.appendChild(document.createTextNode('Browser: ' + navigator.userAgent + '\nBuild: ' + (build || 'unknown') + '\n\n' + (errors.length ? 'Error: ' + errors.join('\n') : 'No error reported.')));
          box.appendChild(title);
          box.appendChild(info);
          root.appendChild(box);
        }
        setTimeout(show, 8000);
      })();
    </script>
  </body>
</html>
