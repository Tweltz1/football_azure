<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bay Status Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar with view tabs; shop board of stage columns; job detail as a side sheet; customer view in a phone frame */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --fg:#17202b; --muted:#5a6676; --line:#d6dce3;
  --accent:#1d5cbb; --accent-fg:#ffffff; --accent-soft:#e5eefb;
  --warn:#a85407; --warn-bg:#fcefdc; --ok:#1d7448; --ok-bg:#e1f2e8; --bad:#b3261e; --bad-bg:#fbe7e5;
  --bubble-out:#1d5cbb; --bubble-out-fg:#ffffff; --bubble-in:#e7ebf0;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#18202a; --surface-2:#1e2833; --fg:#e5eaf0; --muted:#93a1b2; --line:#2b3642;
  --accent:#6ea3ff; --accent-fg:#0b1322; --accent-soft:#1a2a45;
  --warn:#f2a650; --warn-bg:#3a2912; --ok:#5fca92; --ok-bg:#14301f; --bad:#ff8a80; --bad-bg:#3d1a18;
  --bubble-out:#2f6fd6; --bubble-out-fg:#ffffff; --bubble-in:#26313d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#18202a; --surface-2:#1e2833; --fg:#e5eaf0; --muted:#93a1b2; --line:#2b3642;
  --accent:#6ea3ff; --accent-fg:#0b1322; --accent-soft:#1a2a45;
  --warn:#f2a650; --warn-bg:#3a2912; --ok:#5fca92; --ok-bg:#14301f; --bad:#ff8a80; --bad-bg:#3d1a18;
  --bubble-out:#2f6fd6; --bubble-out-fg:#ffffff; --bubble-in:#26313d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.02em}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.brand h1{font-size:22px;line-height:1}
.brand small{display:block;font-size:12px;color:var(--muted);font-family:var(--f-body)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.demo-note{font-size:12.5px;color:var(--muted);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}

main{padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.warn b{color:var(--warn)} .stat.ok b{color:var(--ok)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* board */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;min-width:min-content}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px}
.col-h h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.col-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.col.is-approval{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.col.is-ready{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%;box-shadow:var(--shadow)}
.card:hover{border-color:var(--accent)}
.card .veh{font-weight:600}
.card .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.empty-col{font-size:13px;color:var(--muted);padding:6px 4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);width:max-content}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}

/* side sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:24px;line-height:1.1}
.sheet-body>*{min-width:0}
.sheet-body{overflow-y:auto;overflow-x:hidden;padding:16px 18px 30px;display:flex;flex-direction:column;gap:22px}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:34px;height:34px;flex:none;font-size:18px;line-height:1}
.sec h3{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 6px;font-size:13px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2}
.step.done{color:var(--fg)}
.step.done::before{content:"✓ ";color:var(--ok)}
.step.current{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.step:not(.current):hover{border-color:var(--accent);color:var(--fg)}
@media (max-width:420px){.stepper{grid-template-columns:repeat(2,minmax(0,1fr))}}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

table.est{width:100%;border-collapse:collapse;font-size:14px}
table.est td,table.est th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.est th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
table.est td.num,table.est th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.add-line{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,100px) auto;gap:6px;margin-top:8px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.field input,.field select,.field textarea,.add-line input{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;font-weight:400;font-size:15px;min-width:0}
.field textarea{resize:vertical;min-height:70px}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.photo{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);font-size:12.5px}
.photo .img{aspect-ratio:4/3;width:100%;display:block;object-fit:cover;max-width:100%}
.photo figcaption{padding:5px 8px}
.photo-add{border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;aspect-ratio:4/3;color:var(--muted);font-weight:600;font-size:13px;text-align:center;padding:8px;cursor:pointer;max-width:100%}
.photo-add:hover{border-color:var(--accent);color:var(--accent)}

.thread{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:86%;padding:8px 12px;border-radius:14px;font-size:14px;overflow-wrap:anywhere}
.bubble.out{align-self:flex-end;background:var(--bubble-out);color:var(--bubble-out-fg);border-bottom-right-radius:4px}
.bubble.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:4px}
.bubble .meta{display:block;font-size:11.5px;opacity:.75;margin-top:3px}
.bubble a,.bubble .lnk{color:inherit;text-decoration:underline;font-weight:600;background:none;border:0;padding:0}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.log li{display:grid;grid-template-columns:72px 1fr;gap:10px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}

/* modal */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(10,15,22,.5)}
.modal-card{background:var(--surface);border-radius:12px;width:min(480px,100%);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.modal-card h2{font-size:22px}
.modal-card textarea{min-height:120px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:400}

/* check-in */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:760px}
.panel h2{font-size:26px;margin-bottom:4px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}

/* customer phone */
.cust-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.cust-page{width:min(480px,100%);margin:0 auto}
.cust-page .c-head{border-radius:0 0 14px 14px}
.cust-demo{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:4px 12px}
.login-wrap{min-height:100%;display:grid;place-items:center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.login .brand{margin:0}
.login h2{font-size:28px;margin-top:6px}
.demo-creds{font-size:13px;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.signout{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600}
@media (max-width:560px){.tabs{order:3;width:100%}.tab{flex:1;padding:6px 8px}}
.cust-pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.cust-pick select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;max-width:100%}
.phone{width:min(390px,100%);background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:10px;box-shadow:var(--shadow)}
.phone-in{border-radius:20px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.url{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:center;padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.c-head{background:var(--accent);color:var(--accent-fg);padding:16px}
.c-head small{opacity:.85;font-size:13px}
.c-head h2{font-size:26px;line-height:1.1;margin-top:4px}
.c-body{padding:14px;display:flex;flex-direction:column;gap:14px}
.c-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.c-card h3{font-size:16px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;padding:5px 0;position:relative;font-size:14px}
.tl li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:4px;grid-column:1}
.tl li.done::before{background:var(--ok);border-color:var(--ok)}
.tl li.current::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl li:not(:last-child)::after{content:"";position:absolute;left:5px;top:20px;bottom:-6px;width:2px;background:var(--line)}
.tl li.done:not(:last-child)::after{background:var(--ok)}
.tl li.todo{color:var(--muted)}
.tl time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.decide{display:flex;gap:6px;margin-top:6px}
.decide button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px;font-weight:600;font-size:13px}
.decide button[aria-pressed="true"].yes{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.decide button[aria-pressed="true"].no{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.est-item{padding:8px 0;border-bottom:1px solid var(--line)}
.est-item:last-of-type{border-bottom:0}
.est-item .top{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.est-item .top span:last-child{font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding-top:8px;font-variant-numeric:tabular-nums}
.call{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.call b{font-family:var(--f-mono);user-select:all}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px)}}}
</style>
</head>
<body>

<div id="shopChrome" hidden>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-fg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 8l2 5v4a1 1 0 0 1-1 1h-1.5M3 13v4a1 1 0 0 0 1 1h1.5M3 13h18"/><circle cx="7.5" cy="17.5" r="1.8"/><circle cx="16.5" cy="17.5" r="1.8"/></svg></div>
      <div><h1>Bay Status</h1><small id="shopName">Ridgeline Auto Repair</small></div>
    </div>
    <nav class="tabs" aria-label="Views">
      <button class="tab" data-view="board">Shop board</button>
      <button class="tab" data-view="checkin">Check in</button>
    </nav>
    <a class="signout" id="signOutLink" href="/shop/" style="text-decoration:none;color:inherit">Exit demo</a>
  </div>
</header>
<div class="demo-note"><span><b>Demo shop.</b> Sample cars and customers, saved only in this browser. No real texts are sent; each text shows in the car's message thread.</span><button class="linkbtn" id="resetBtn">Reset sample data</button></div>
</div>
<main id="app"></main>
<div id="layer"></div>

<script>
const SHOP={name:"Ridgeline Auto Repair",phone:"(555) 014-2290",hours:"Mon–Fri 7:30am–6pm",domain:"ridgeline.baystatus.app"};
const STAGES=[
 {key:"checked_in",label:"Checked in",cust:"We have your car"},
 {key:"diagnosing",label:"Diagnosing",cust:"Inspecting your car"},
 {key:"approval",label:"Approval needed",cust:"Waiting on your approval"},
 {key:"parts",label:"Waiting on parts",cust:"Waiting on parts"},
 {key:"in_progress",label:"In progress",cust:"Repairs underway"},
 {key:"qc",label:"Quality check",cust:"Final check and road test"},
 {key:"ready",label:"Ready for pickup",cust:"Ready for pickup"},
 {key:"picked_up",label:"Picked up",cust:"Picked up"}];
const SI=Object.fromEntries(STAGES.map((s,i)=>[s.key,i]));
const TEMPLATES={
 checked_in:"Hi {first}, {shop} has your {vehicle}. We'll text you as work moves along. Track it here: {link}",
 diagnosing:"Hi {first}, a technician is inspecting your {vehicle} now. We'll send what we find soon.",
 approval:"Hi {first}, we found what's going on with your {vehicle}. Please review and approve the estimate ({total}): {link}",
 parts:"Hi {first}, parts for your {vehicle} are on order and expected {eta}. We'll let you know when they arrive.",
 in_progress:"Good news, {first}: repairs on your {vehicle} are underway.",
 qc:"Hi {first}, repairs are done. We're doing a final check and road test on your {vehicle}.",
 ready:"Your {vehicle} is ready for pickup! Total {total}. We're open {hours}. Details: {link}",
 picked_up:"Thanks for choosing {shop}, {first}! How did we do? Reply with any feedback. Reply STOP to opt out."};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const clock=t=>new Date(t).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
const dayClock=t=>{const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?clock(t):d.toLocaleDateString("en-US",{month:"short",day:"numeric"})+", "+clock(t)};
const since=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));if(m<60)return m+"m";const h=Math.floor(m/60);return h+"h "+(m%60)+"m"};
const token=()=>Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,8);
const vehicleStr=j=>`${j.vehicle.year} ${j.vehicle.make} ${j.vehicle.model}`;
const linkOf=j=>`${SHOP.domain}/s/${j.token}`;
const estTotal=(j,onlyApproved)=>j.estimate.filter(e=>!onlyApproved||e.status==="approved").reduce((a,e)=>a+Number(e.price),0);
function fillTemplate(stage,j){
  const total=stage==="ready"?estTotal(j,true):estTotal(j,false);
  return TEMPLATES[stage].replace(/\{(\w+)\}/g,(_,k)=>({first:j.customer.name.split(" ")[0],shop:SHOP.name,vehicle:vehicleStr(j),link:linkOf(j),total:money(total),eta:j.eta||"soon",hours:SHOP.hours}[k]??""));
}

/* --- sample data --- */
function photoSVG(label,hue){
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 120'><rect width='160' height='120' fill='hsl(${hue},18%,30%)'/><circle cx='80' cy='60' r='34' fill='none' stroke='hsl(${hue},14%,62%)' stroke-width='10'/><circle cx='80' cy='60' r='12' fill='hsl(${hue},14%,55%)'/><rect x='104' y='40' width='16' height='40' rx='3' fill='hsl(${hue+20},60%,55%)'/><text x='8' y='112' font-family='monospace' font-size='9' fill='white' opacity='.8'>${label}</text></svg>`;
  return "data:image/svg+xml,"+encodeURIComponent(svg);
}
function seed(){
  const now=Date.now(),M=60000;
  const mk=(ro,name,phone,veh,plate,concern,stage,stageTimes,estimate,extra={})=>{
    const j={id:ro,ro,customer:{name,phone,consent:true},vehicle:veh,plate,concern,stage,token:token(),estimate,photos:[],events:[],messages:[],...extra};
    stageTimes.forEach(([k,ago])=>{const t=now-ago*M;j.events.push({stage:k,t});j.messages.push({dir:"out",t,text:fillTemplate(k,j)});});
    return j;};
  const jobs=[
   mk("RO-1046","Ashley Kim","(555) 017-3381",{year:2019,make:"Jeep",model:"Cherokee"},"8MRT551","Battery warning light on dash","checked_in",[["checked_in",12]],[]),
   mk("RO-1044","Lena Brooks","(555) 012-9047",{year:2012,make:"Chevrolet",model:"Malibu"},"6BXC118","AC blowing warm air","diagnosing",[["checked_in",95],["diagnosing",34]],[]),
   mk("RO-1041","Maria Delgado","(555) 013-6620",{year:2018,make:"Honda",model:"Civic"},"7KDL294","Grinding noise when braking","approval",[["checked_in",210],["diagnosing",170],["approval",48]],
     [{id:1,item:"Front brake pads and rotors",price:389,status:"pending"},{id:2,item:"Brake fluid flush",price:119,status:"pending"}]),
   mk("RO-1042","James Whitaker","(555) 016-4402",{year:2015,make:"Ford",model:"F-150"},"4TWE903","Check engine light, rough idle","parts",[["checked_in",1500],["diagnosing",1440],["approval",1380],["parts",1300]],
     [{id:1,item:"Ignition coils (6) and spark plugs",price:642,status:"approved"},{id:2,item:"Throttle body cleaning",price:95,status:"declined"}],{eta:"Tue, Nov 10"}),
   mk("RO-1043","Priya Nair","(555) 011-7735",{year:2020,make:"Toyota",model:"RAV4"},"9PLN227","60,000-mile service","in_progress",[["checked_in",180],["in_progress",150]],
     [{id:1,item:"60k service package",price:449,status:"approved"}]),
   mk("RO-1040","Marcus Hill","(555) 015-2268",{year:2016,make:"Nissan",model:"Altima"},"7HJA640","Clunk over bumps, replace front struts","qc",[["checked_in",320],["diagnosing",300],["approval",280],["in_progress",250],["qc",22]],
     [{id:1,item:"Front strut assemblies (pair)",price:712,status:"approved"},{id:2,item:"Alignment",price:129,status:"approved"}]),
   mk("RO-1045","Tom Reyes","(555) 018-5519",{year:2017,make:"Subaru",model:"Outback"},"5SUB774","Oil change and tire rotation","ready",[["checked_in",140],["in_progress",110],["ready",19]],
     [{id:1,item:"Synthetic oil change",price:69.95,status:"approved"},{id:2,item:"Tire rotation",price:20,status:"approved"}])];
  const maria=jobs.find(j=>j.ro==="RO-1041");
  maria.photos=[{src:photoSVG("FRONT PADS 2MM",210),cap:"Front pads worn to 2 mm (replace at 3 mm)"},{src:photoSVG("ROTOR SCORING",20),cap:"Scoring on left front rotor"}];
  maria.messages.push({dir:"in",t:now-30*M,text:"Thanks! Is it safe to drive home if I wait on this?"});
  maria.messages.push({dir:"out",t:now-26*M,text:"It's drivable short distance, but the pads are close to metal. We'd recommend doing it today. – Dan, service advisor"});
  const james=jobs.find(j=>j.ro==="RO-1042");
  james.approval={by:"James Whitaker",t:now-1350*M};
  james.messages.splice(3,0,{dir:"in",t:now-1350*M,text:"Approved the coils and plugs. Skip the throttle body for now."});
  const marcus=jobs.find(j=>j.ro==="RO-1040");marcus.approval={by:"Marcus Hill",t:now-270*M};
  jobs.forEach(j=>j.messages.sort((a,b)=>a.t-b.t));
  return {jobs,nextRO:1047,pickedToday:3};
}
const KEY="baystatus-proto-v1";
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!state.jobs)state=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
let ui={view:"board",openJob:null,custJob:null,modal:null,draft:{}};
const AUTH="baystatus-proto-auth";
let signedIn=true;
const setAuth=v=>{signedIn=v;try{v?localStorage.setItem(AUTH,"1"):localStorage.removeItem(AUTH)}catch(e){}};
const job=id=>state.jobs.find(j=>j.id===id);

/* --- views --- */
function render(){
  const app=$("#app"),chrome=$("#shopChrome");
  const h=location.hash.slice(1);
  const cj=h.startsWith("s-")?state.jobs.find(j=>j.token===h.slice(2)):null;
  if(cj){ // customer link: no login, no shop screens
    ui.custJob=cj.id;ui.openJob=null;ui.modal=null;chrome.hidden=true;
    document.title=SHOP.name+" · Your "+vehicleStr(cj);
    app.innerHTML=customerView(cj);$("#layer").innerHTML="";return;
  }
  document.title="Bay Status · "+SHOP.name;
  if(!signedIn){chrome.hidden=true;app.innerHTML=loginView();$("#layer").innerHTML="";return}
  chrome.hidden=false;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.view===ui.view?"page":"false"));
  app.innerHTML=ui.view==="checkin"?checkinView():boardView();
  renderLayer();
}
function loginView(){
  return `<div class="login-wrap"><form class="login" id="loginForm">
    <div class="brand"><div class="brand-mark" aria-hidden="true">${$(".brand-mark").innerHTML}</div><div><h1>Bay Status</h1><small>For repair shops</small></div></div>
    <h2>Shop sign in</h2>
    <label class="field">Work email<input id="li-email" type="email" required autocomplete="username" value="dan@ridgelineauto.com"></label>
    <label class="field">Password<input id="li-pass" type="password" required autocomplete="current-password" value="demo1234"></label>
    <button class="btn primary" type="submit">Sign in</button>
    <div class="demo-creds">Demo account is filled in. Any email and password works.</div>
    <p class="muted" style="font-size:13px;margin:0">Customers never sign in. They get a text with a link to their car's page.</p>
    <a class="linkbtn" href="/" style="font-size:13px">Exit demo</a>
  </form></div>`;
}
function boardView(){
  const active=state.jobs.filter(j=>j.stage!=="picked_up");
  const waiting=active.filter(j=>j.stage==="approval").length;
  const ready=active.filter(j=>j.stage==="ready").length;
  const sent=state.jobs.reduce((a,j)=>a+j.messages.filter(m=>m.dir==="out").length,0);
  let h=`<div class="stats">
    <div class="stat"><b>${active.length}</b><span>Cars in the shop</span></div>
    <div class="stat warn"><b>${waiting}</b><span>Waiting on customer</span></div>
    <div class="stat ok"><b>${ready}</b><span>Ready for pickup</span></div>
    <div class="stat"><b>${sent}</b><span>Updates sent today</span></div></div>
    <div class="board-wrap"><div class="board">`;
  STAGES.filter(s=>s.key!=="picked_up").forEach(s=>{
    const list=active.filter(j=>j.stage===s.key);
    h+=`<section class="col ${s.key==="approval"?"is-approval":""} ${s.key==="ready"?"is-ready":""}"><div class="col-h"><h3>${s.label}</h3><span>${list.length}</span></div>`;
    if(!list.length)h+=`<div class="empty-col">No cars</div>`;
    list.forEach(j=>{
      const ev=j.events[j.events.length-1];
      let pill="";
      if(j.stage==="approval")pill=`<span class="pill warn">Sent ${since(ev.t)} ago</span>`;
      else if(j.stage==="parts")pill=`<span class="pill">ETA ${esc(j.eta||"not set")}</span>`;
      else if(j.stage==="ready")pill=`<span class="pill ok">Customer notified</span>`;
      const unread=j.messages.length&&j.messages[j.messages.length-1].dir==="in";
      h+=`<button class="card" data-open="${j.id}">
        <span class="veh">${esc(vehicleStr(j))}</span>
        <span class="row"><span>${esc(j.customer.name)}</span><span class="mono">${j.ro}</span></span>
        <span class="row"><span>${esc(j.concern)}</span></span>
        <span class="row"><span>${since(ev.t)} in stage</span>${unread?`<span class="pill bad">New reply</span>`:""}</span>${pill}</button>`;
    });
    h+=`</section>`;
  });
  h+=`</div></div><p class="muted" style="font-size:13px;margin-top:10px">${state.pickedToday} cars picked up earlier today. Tap a car to update its stage, build an estimate or read customer replies.</p>`;
  return h;
}

   <div class="form-grid">

function customerView(j){
  const idx=SI[j.stage];
  const evAt=k=>{const e=[...j.events].reverse().find(e=>e.stage===k);return e?e.t:null};
  const path=STAGES.filter(s=>s.key!=="picked_up"&&(evAt(s.key)||SI[s.key]>idx||s.key===j.stage)).filter(s=>!(s.key==="approval"&&!j.estimate.length&&SI[j.stage]>SI.approval)&&!(s.key==="parts"&&SI[j.stage]<SI.parts&&!j.eta)||true);
  const tl=path.map(s=>{const t=evAt(s.key);const cls=s.key===j.stage?"current":(t&&SI[s.key]<idx?"done":"todo");
    return `<li class="${cls}"><span>${s.label}</span><time>${t?dayClock(t):""}</time></li>`}).join("");
  const pending=j.stage==="approval"&&j.estimate.some(e=>e.status==="pending");
  let est="";
  if(j.estimate.length){
    const items=j.estimate.map(e=>{
      const d=ui.draft[j.id+"-"+e.id];
      const choice=pending&&e.status==="pending"?`<div class="decide"><button class="yes" data-decide="${e.id}" data-v="approved" aria-pressed="${d==="approved"}">Approve</button><button class="no" data-decide="${e.id}" data-v="declined" aria-pressed="${d==="declined"}">Decline</button></div>`
        :(e.status!=="pending"?`<span class="pill ${e.status==="approved"?"ok":"bad"}">${e.status==="approved"?"Approved":"Declined"}</span>`:"");
      return `<div class="est-item"><div class="top"><span>${esc(e.item)}</span><span>${money(e.price)}</span></div>${choice}</div>`}).join("");
    const allChosen=j.estimate.filter(e=>e.status==="pending").every(e=>ui.draft[j.id+"-"+e.id]);
    const tot=pending?j.estimate.reduce((a,e)=>a+((ui.draft[j.id+"-"+e.id]??e.status)==="approved"?Number(e.price):0),0):estTotal(j,true);
    est=`<div class="c-card"><h3>Estimate</h3>${items}<div class="total"><span>${pending?"Approved so far":"Approved total"}</span><span>${money(tot)}</span></div>
      ${pending?`<label class="field" style="margin-top:10px">Type your full name to sign<input id="sig" placeholder="${esc(j.customer.name)}" value="${esc(ui.draft[j.id+"-sig"]||"")}"></label>
      <button class="btn primary" style="width:100%;margin-top:10px" id="submitApproval" ${allChosen?"":"disabled"}>Send my decision</button>
      <p class="muted" style="font-size:12.5px;margin:6px 0 0">${allChosen?"Your signed decision goes straight to the shop.":"Choose approve or decline for each item."}</p>`
      :(j.approval?`<p class="muted" style="font-size:12.5px;margin:8px 0 0">Signed by ${esc(j.approval.by)} on ${dayClock(j.approval.t)}</p>`:"")}</div>`;
  }
  const photos=j.photos.length?`<div class="c-card"><h3>Photos from your technician</h3><div class="photos">${j.photos.map(p=>`<figure class="photo" style="margin:0"><img class="img" src="${p.src}" alt="${esc(p.cap)}"><figcaption>${esc(p.cap)}</figcaption></figure>`).join("")}</div></div>`:"";
  const stage=STAGES[idx];
  const extra=j.stage==="parts"?`<p style="margin:6px 0 0">Parts expected <b>${esc(j.eta||"soon")}</b>.</p>`:j.stage==="ready"?`<p style="margin:6px 0 0">Total due ${money(estTotal(j,true))}. Open ${SHOP.hours}.</p>`:"";
  return `<div class="cust-demo"><span><b>Demo:</b> this is the page ${esc(j.customer.name.split(" ")[0])} opens from the text link. No login needed.</span><button class="linkbtn" id="backToShop" style="margin-left:auto">Back to shop</button></div>
   <div class="cust-page">
    <div class="c-head"><small>${SHOP.name} · <span class="mono">${j.ro}</span></small><h2>${stage.cust}</h2><div style="font-size:14px;margin-top:4px">${esc(vehicleStr(j))}</div>${extra}</div>
    <div class="c-body">
      ${est}${photos}
      <div class="c-card"><h3>Progress</h3><ul class="tl">${tl}</ul></div>
      <div class="c-card"><h3>Your concern</h3><div style="font-size:14px">${esc(j.concern)}</div></div>
      <div class="c-card call"><span>Questions? Call the shop</span><b>${SHOP.phone}</b></div>
    </div></div>`;
}
function sheetView(j){
  const idx=SI[j.stage];
  const steps=STAGES.map((s,i)=>`<button class="step ${i<idx?"done":""} ${i===idx?"current":""}" data-stage="${s.key}" ${i===idx?'aria-current="step"':""}>${s.label}</button>`).join("");
  const next=STAGES[idx+1];
  const rows=j.estimate.map(e=>`<tr><td>${esc(e.item)}</td><td>${e.status==="pending"?'<span class="pill warn">Pending</span>':e.status==="approved"?'<span class="pill ok">Approved</span>':'<span class="pill bad">Declined</span>'}</td><td class="num">${money(e.price)}</td><td class="num">${e.status==="pending"&&j.stage!=="approval"?`<button class="linkbtn" data-del="${e.id}" aria-label="Remove ${esc(e.item)}">Remove</button>`:""}</td></tr>`).join("");
  const msgs=j.messages.map(m=>`<div class="bubble ${m.dir}">${linkify(esc(m.text),j)}<span class="meta">${m.dir==="out"?"Text to customer":esc(j.customer.name.split(" ")[0])} · ${dayClock(m.t)}</span></div>`).join("");
  const log=[...j.events].reverse().map(e=>`<li><time>${clock(e.t)}</time><span>${STAGES[SI[e.stage]].label}</span></li>`).join("");
  return `<div class="scrim" data-close></div><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
   <div class="sheet-h"><div><div class="mono muted">${j.ro} · ${esc(j.plate||"")}</div><h2 id="sheetTitle">${esc(vehicleStr(j))}</h2><div class="muted">${esc(j.customer.name)} · ${esc(j.customer.phone)}</div></div><button class="x" data-close aria-label="Close">×</button></div>
   <div class="sheet-body">
    <section class="sec"><h3>Stage</h3><div class="stepper">${steps}</div>
      ${next?`<div class="btn-row" style="margin-top:10px"><button class="btn primary" data-stage="${next.key}">Move to ${next.label}</button><button class="btn" id="viewAsCust">See customer's page</button></div>`:""}
      ${j.stage==="parts"?`<label class="field" style="margin-top:10px">Parts ETA<input id="eta" value="${esc(j.eta||"")}" placeholder="e.g. Tue, Nov 10"></label>`:""}
    </section>
    <section class="sec"><h3>Concern</h3><div>${esc(j.concern)}</div></section>
    <section class="sec"><h3>Estimate</h3>
      ${j.estimate.length?`<div style="overflow-x:auto"><table class="est"><thead><tr><th>Item</th><th>Status</th><th class="num">Price</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="total"><span>Total quoted</span><span>${money(estTotal(j))}</span></div>`:`<p class="muted" style="margin:0">No line items yet.</p>`}
      ${j.approval?`<p class="muted" style="font-size:13px">Signed by ${esc(j.approval.by)} on ${dayClock(j.approval.t)}</p>`:""}
      <form class="add-line" id="addLine"><input id="li-item" placeholder="Line item, e.g. Cabin air filter" aria-label="Line item"><input id="li-price" inputmode="decimal" placeholder="Price" aria-label="Price"><button class="btn" type="submit">Add</button></form>
      ${j.estimate.some(e=>e.status==="pending")&&j.stage!=="approval"?`<button class="btn primary" style="margin-top:10px" data-stage="approval">Send estimate for approval</button>`:""}
    </section>
    <section class="sec"><h3>Photos</h3><div class="photos">${j.photos.map(p=>`<figure class="photo" style="margin:0"><img class="img" src="${p.src}" alt="${esc(p.cap)}"><figcaption>${esc(p.cap)}</figcaption></figure>`).join("")}
      <label class="photo-add" for="photoIn">+ Add photo<br><span style="font-weight:400">Customer sees it on their page</span></label><input type="file" id="photoIn" accept="image/*" hidden></div></section>
    <section class="sec"><h3>Messages</h3><div class="thread">${msgs||'<p class="muted">No messages yet.</p>'}</div>
      <form class="add-line" id="replyForm" style="grid-template-columns:minmax(0,1fr) auto"><input id="replyIn" placeholder="Text ${esc(j.customer.name.split(" ")[0])}…" aria-label="Message"><button class="btn primary" type="submit">Send</button></form></section>
    <section class="sec"><h3>History</h3><ul class="log">${log}</ul></section>
   </div></aside>`;
}
function linkify(s,j){return s.replace(esc(linkOf(j)),`<button class="lnk" data-golink="${j.id}">${esc(linkOf(j))}</button>`)}
function modalView(){
  const m=ui.modal,j=job(m.job),s=STAGES[SI[m.stage]];
  return `<div class="modal"><form class="modal-card" id="sendForm" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">Move to ${s.label}</h2>
    <p class="muted" style="margin:0">Text to ${esc(j.customer.name)} at ${esc(j.customer.phone)}</p>
    ${m.stage==="parts"?`<label class="field">Parts ETA<input id="m-eta" value="${esc(j.eta||"")}" placeholder="e.g. Tue, Nov 10"></label>`:""}
    <label class="field">Message<textarea id="m-text">${esc(m.text)}</textarea></label>
    <label class="chk"><input type="checkbox" id="m-send" ${j.customer.consent?"checked":""} ${j.customer.consent?"":"disabled"}> Send this text ${j.customer.consent?"":"(customer has not agreed to texts)"}</label>
    <div class="btn-row"><button class="btn primary" type="submit">Update stage</button><button class="btn" type="button" data-cancel>Cancel</button></div>
  </form></div>`;
}
function renderLayer(){
  let h="";
  if(ui.openJob&&ui.view==="board"){const j=job(ui.openJob);if(j)h+=sheetView(j)}
  if(ui.modal)h+=modalView();
  $("#layer").innerHTML=h;
}
let toastT;
function toast(msg){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}

/* --- actions --- */
function setStage(j,stage,text,send){
  j.stage=stage;const t=Date.now();j.events.push({stage,t});
  if(send)j.messages.push({dir:"out",t,text});
  if(stage==="picked_up")state.pickedToday++;
  save();
}
function go(view){ui.view=view;if(view!=="board")ui.openJob=null;render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-close],[data-open]");if(!t)return;
  if(t.dataset.view){go(t.dataset.view);return}
  if(t.id==="resetBtn"){state=seed();save();ui={...ui,openJob:null,modal:null,draft:{},custJob:"RO-1041"};render();toast("Sample data reset");return}
  if(t.dataset.open){ui.openJob=t.dataset.open;renderLayer();setTimeout(()=>$(".x")?.focus(),0);return}
  if(t.hasAttribute("data-close")){ui.openJob=null;renderLayer();return}
  if(t.hasAttribute("data-cancel")){ui.modal=null;renderLayer();return}
  if(t.dataset.stage){const j=job(ui.openJob);if(!j||t.dataset.stage===j.stage)return;
    if(t.dataset.stage==="approval"&&!j.estimate.some(e=>e.status==="pending")){toast("Add at least one estimate line first");$("#li-item")?.focus();return}
    ui.modal={job:j.id,stage:t.dataset.stage,text:fillTemplate(t.dataset.stage,j)};renderLayer();$("#m-text")?.focus();return}
  if(t.dataset.del){const j=job(ui.openJob);j.estimate=j.estimate.filter(x=>String(x.id)!==t.dataset.del);save();renderLayer();return}
  if(t.id==="viewAsCust"||t.dataset.golink){const j=job(t.dataset.golink||ui.openJob);ui.backTo=j.id;location.hash="s-"+j.token;window.scrollTo(0,0);return}
  if(t.id==="backToShop"){ui.view="board";ui.openJob=ui.backTo||null;history.pushState(null,"",location.pathname);render();return}
  if(t.id==="signOut"){location.href="/shop/";return}
  if(t.id==="ci-fill"){const v={name:"Sam Ortiz",phone:"(555) 019-4410",year:"2014",make:"Mazda",model:"CX-5",plate:"3CXF882",concern:"Squealing belt noise on cold start"};for(const k in v)$("#ci-"+k).value=v[k];return}
  if(t.dataset.decide){const j=job(ui.custJob);ui.draft[j.id+"-"+t.dataset.decide]=t.dataset.v;const sig=$("#sig")?.value;if(sig!=null)ui.draft[j.id+"-sig"]=sig;render();return}
  if(t.id==="submitApproval"){const j=job(ui.custJob);const sig=($("#sig").value||"").trim();
    if(sig.length<3){toast("Type your full name to sign");$("#sig").focus();return}
    let yes=0;j.estimate.forEach(x=>{if(x.status==="pending"){x.status=ui.draft[j.id+"-"+x.id];if(x.status==="approved")yes++}});
    j.approval={by:sig,t:Date.now()};
    j.messages.push({dir:"in",t:Date.now(),text:`Approved ${yes} of ${j.estimate.length} items on the estimate (signed: ${sig}).`});
    save();toast("Sent to "+SHOP.name);render();return}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="loginForm"){setAuth(true);ui.view="board";render();toast("Signed in to "+SHOP.name);return}
  if(f.id==="checkinForm"){
    const g=k=>$("#ci-"+k).value.trim();
    const j={id:"RO-"+state.nextRO,ro:"RO-"+state.nextRO,customer:{name:g("name"),phone:g("phone"),consent:$("#ci-consent").checked},vehicle:{year:g("year"),make:g("make"),model:g("model")},plate:g("plate"),concern:g("concern"),stage:"checked_in",token:token(),estimate:[],photos:[],events:[],messages:[]};
    state.nextRO++;const t=Date.now();j.events.push({stage:"checked_in",t});
    if(j.customer.consent)j.messages.push({dir:"out",t,text:fillTemplate("checked_in",j)});
    state.jobs.push(j);save();ui.openJob=j.id;go("board");toast(j.customer.consent?"Checked in. Welcome text sent.":"Checked in. No text sent.");return}
  if(f.id==="sendForm"){
    const j=job(ui.modal.job);const eta=$("#m-eta");if(eta)j.eta=eta.value.trim();
    setStage(j,ui.modal.stage,$("#m-text").value.trim(),$("#m-send").checked);
    const lbl=STAGES[SI[ui.modal.stage]].label;ui.modal=null;
    if(j.stage==="picked_up")ui.openJob=null;
    render();toast(`Moved to ${lbl}${$("#m-send")?"":""}`);return}
  if(f.id==="addLine"){const j=job(ui.openJob);const item=$("#li-item").value.trim();const price=parseFloat($("#li-price").value.replace(/[$,]/g,""));
    if(!item||!(price>=0)){toast("Enter an item and a price");return}
    j.estimate.push({id:Date.now(),item,price,status:"pending"});save();renderLayer();$("#li-item").focus();return}
  if(f.id==="replyForm"){const j=job(ui.openJob);const v=$("#replyIn").value.trim();if(!v)return;j.messages.push({dir:"out",t:Date.now(),text:v});save();renderLayer();$("#replyIn").focus();toast("Text sent");return}
});
document.addEventListener("change",e=>{
  
  if(e.target.id==="eta"){const j=job(ui.openJob);j.eta=e.target.value.trim();save();render()}
  if(e.target.id==="photoIn"){const file=e.target.files[0];if(!file)return;const j=job(ui.openJob);const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");const s=Math.min(1,640/img.width);c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      j.photos.push({src:c.toDataURL("image/jpeg",.8),cap:file.name.replace(/\.[^.]+$/,"")});save();renderLayer();toast("Photo added to customer's page")};img.src=r.result};r.readAsDataURL(file)}
});
document.addEventListener("input",e=>{if(e.target.id==="sig")ui.draft[ui.custJob+"-sig"]=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(ui.modal)ui.modal=null;else ui.openJob=null;renderLayer()}});
window.addEventListener("hashchange",render);
setInterval(()=>{if(ui.view==="board"&&!ui.openJob&&!ui.modal)render()},60000);
render();
</script>
</body>
</html>
