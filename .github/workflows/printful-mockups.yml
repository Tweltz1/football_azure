name: Merch mockups (Printful)

# Makes real product photos for weltzcraft.com/merch with Printful's Mockup Generator and commits them
# as weltzcraft-site/img/merch/<slug>.webp (the merch page already points at those files).
# Needs the PRINTFUL_API_TOKEN repo secret (a Printful private token for the "Weltzcraft" store).
# Optional PRINTFUL_STORE_ID secret if the token is account-level instead of store-level.
on:
  push:
    branches: [main, claude/project-thread-8n3mi5]
    paths: ['merch/products.json', 'merch/print/**', 'scripts/printful-mockups.mjs', '.github/workflows/printful-mockups.yml']
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these slugs (comma separated, blank = all)'
        required: false

permissions:
  contents: write
  actions: write

concurrency: { group: printful-mockups, cancel-in-progress: false }

jobs:
  mockups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Make mockups
        env:
          PRINTFUL_API_TOKEN: ${{ secrets.PRINTFUL_API_TOKEN }}
          PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
          ASSET_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/merch/print
          ONLY: ${{ github.event.inputs.only }}
        run: node scripts/printful-mockups.mjs
      - name: Convert to webp and commit
        run: |
          shopt -s nullglob
          files=(weltzcraft-site/img/merch/*.jpg)
          [ ${#files[@]} -gt 0 ] || { echo "No new mockups."; exit 0; }
          sudo apt-get install -y -qq webp >/dev/null
          for f in "${files[@]}"; do
            cwebp -quiet -q 84 -resize 1000 0 "$f" -o "${f%.jpg}.webp" && rm -- "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add weltzcraft-site/img/merch merch/mockup-results.json
          git commit -m "Merch: real Printful product mockups" || exit 0
          git push
          # Pushes made with GITHUB_TOKEN don't start other workflows, so redeploy the site by hand on main.
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh workflow run deploy-weltzcraft-site.yml --ref main; fi
        env:
          GH_TOKEN: ${{ github.token }}
