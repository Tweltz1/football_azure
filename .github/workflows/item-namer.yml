# Trains the item namer (ml/item-namer): a Create ML image classifier that names each thing the phone
# finds in a photo, for Curbsy and ToteTrack. Optionally publishes it as release item-namer-vN.
name: Item namer

on:
  # A push that changes ml/item-namer/run.json trains with its settings (other edits don't start a long run).
  push:
    paths:
      - 'ml/item-namer/run.json'
  workflow_dispatch:
    inputs:
      per_class:
        description: Training crops per kind of thing
        default: '80'
      min_class:
        description: Leave out kinds with fewer examples than this
        default: '15'
      limit_classes:
        description: Only the N biggest kinds (0 = all), for quick runs
        default: '0'
      version:
        description: Release version number (publishes item-namer-vN); leave empty to only train
        default: ''

permissions:
  contents: write

concurrency:
  group: item-namer
  cancel-in-progress: false

jobs:
  train:
    runs-on: macos-15
    timeout-minutes: 350
    defaults:
      run:
        working-directory: ml/item-namer
    steps:
      - uses: actions/checkout@v4

      - name: Settings
        id: s
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "per_class=${{ inputs.per_class }}" >> "$GITHUB_OUTPUT"
            echo "min_class=${{ inputs.min_class }}" >> "$GITHUB_OUTPUT"
            echo "limit_classes=${{ inputs.limit_classes }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            python3 -c "import json; r=json.load(open('run.json')); [print(f'{k}={v}') for k, v in r.items()]" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Keep downloaded annotation files between runs
        uses: actions/cache@v4
        with:
          path: ml/item-namer/cache
          key: item-namer-cache-v1

      - name: Get training crops
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --quiet pillow ijson nltk
          python prepare.py --out crops --cache cache --per-class "${{ steps.s.outputs.per_class }}" \
            --min-class "${{ steps.s.outputs.min_class }}" --limit-classes "${{ steps.s.outputs.limit_classes }}"
          du -sh crops

      # Learning loop: name fixes people sent from the apps (see fixes.py). The service key is asked from
      # Supabase with the deploy token and only lives for this step.
      - name: Add name fixes from the apps
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'nkwedlskhnojseeroezm' }}
        run: |
          . .venv/bin/activate
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys" \
              | python3 -c 'import json,sys; print(next((k["api_key"] for k in json.load(sys.stdin) if k.get("name") == "service_role"), ""))') || KEY=""
            if [ -n "$KEY" ]; then echo "::add-mask::$KEY"; fi
            SUPABASE_URL="https://$SUPABASE_PROJECT_ID.supabase.co" SUPABASE_SERVICE_KEY="$KEY" python fixes.py --crops crops --out out || echo "::warning::Couldn't read the name fixes; training without them"
          else
            echo "No SUPABASE_ACCESS_TOKEN: training without name fixes"
          fi

      - name: Feature prints (Apple Vision)
        run: swift features.swift crops feats

      - name: Train the namer
        run: |
          . .venv/bin/activate
          pip install --quiet numpy
          python fit.py --feats feats --crops crops --out out
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: item-namer
          path: |
            ml/item-namer/out/namer.f32
            ml/item-namer/out/labels.json
            ml/item-namer/out/metrics.json
            ml/item-namer/out/fixes.json

      - name: Publish the model
        if: ${{ steps.s.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="item-namer-v${{ steps.s.outputs.version }}"
          gh release create "$tag" out/namer.f32 out/labels.json out/metrics.json \
            --title "Item namer v${{ steps.s.outputs.version }}" \
            --notes "Names each thing the phone finds in a photo, for Curbsy and ToteTrack. Softmax weights over Apple Vision feature prints (revision 2), trained on LVIS (CC BY 4.0) crops. $(cat out/metrics.json | tr -d '\n')" \
            --target "${{ github.sha }}"
