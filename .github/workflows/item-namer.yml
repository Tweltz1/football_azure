# Trains the item namer (ml/item-namer): softmax weights over Apple Vision feature prints that name each thing
# the phone finds in a photo, for Curbsy and ToteTrack, including name fixes people sent from the apps.
# Optionally publishes it as release item-namer-vN, and makes it the one phones use (item-namer-current) when
# it's at least as good. item-namer-weekly.yml on main starts it every week.
name: Item namer

on:
  # A push to the live branch that changes ml/item-namer/run.json trains with its settings (other edits don't
  # start a long run). New work branches made from it used to start a 2.5-hour run each, and fail at the end.
  push:
    branches:
      - claude/project-thread-6lgsrr
    paths:
      - 'ml/item-namer/run.json'
  workflow_dispatch:
    inputs:
      per_class:
        description: Training crops per kind of thing
        default: '80'
      min_class:
        description: Leave out kinds with fewer examples than this
        default: '15'
      limit_classes:
        description: Only the N biggest kinds (0 = all), for quick runs
        default: '0'
      version:
        description: Release version number (publishes item-namer-vN, auto = the next one); leave empty to only train
        default: ''

permissions:
  contents: write

concurrency:
  group: item-namer
  cancel-in-progress: false

jobs:
  # Gemini names a few more photos first (gemini-teacher.yml); training goes ahead even if that fails.
  teach:
    uses: ./.github/workflows/gemini-teacher.yml
    secrets: inherit

  # ToteTrack's namer learns from the same Gemini-named photos: rebuild it on its branch (it keeps them only
  # if its test score holds). Only for the scheduled/hand-started weekly runs, not every push.
  totetrack:
    needs: teach
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild ToteTrack's namer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run totetrack-build-namer.yml -R "${{ github.repository }}" --ref claude/totetrack-app || echo "::warning::Couldn't start ToteTrack's namer build"

  train:
    needs: teach
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 350
    defaults:
      run:
        working-directory: ml/item-namer
    steps:
      - uses: actions/checkout@v4

      - name: Settings
        id: s
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "per_class=${{ inputs.per_class }}" >> "$GITHUB_OUTPUT"
            echo "min_class=${{ inputs.min_class }}" >> "$GITHUB_OUTPUT"
            echo "limit_classes=${{ inputs.limit_classes }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            python3 -c "import json; r=json.load(open('run.json')); [print(f'{k}={v}') for k, v in r.items()]" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Keep downloaded annotation files between runs
        uses: actions/cache@v4
        with:
          path: ml/item-namer/cache
          key: item-namer-cache-v2
          restore-keys: item-namer-cache-

      - name: Get training crops
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --quiet pillow ijson nltk
          python prepare.py --out crops --cache cache --per-class "${{ steps.s.outputs.per_class }}" \
            --min-class "${{ steps.s.outputs.min_class }}" --limit-classes "${{ steps.s.outputs.limit_classes }}"
          du -sh crops

      # Learning loop: name fixes people sent from the apps (see fixes.py). The service key is asked from
      # Supabase with the deploy token and only lives for this step.
      - name: Add name fixes from the apps
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'nkwedlskhnojseeroezm' }}
        run: |
          . .venv/bin/activate
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys" \
              | python3 -c 'import json,sys; print(next((k["api_key"] for k in json.load(sys.stdin) if k.get("name") == "service_role"), ""))') || KEY=""
            if [ -n "$KEY" ]; then echo "::add-mask::$KEY"; fi
            SUPABASE_URL="https://$SUPABASE_PROJECT_ID.supabase.co" SUPABASE_SERVICE_KEY="$KEY" python fixes.py --crops crops --out out || echo "::warning::Couldn't read the name fixes; training without them"
          else
            echo "No SUPABASE_ACCESS_TOKEN: training without name fixes"
          fi

      # Photos Gemini named (ml/gemini-teacher): training only, never test photos. promote.py still decides
      # whether phones get the result, on photos people labeled.
      - name: Add photos Gemini named
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . .venv/bin/activate
          mkdir -p teacher-set
          if gh release download gemini-teacher -R "${{ github.repository }}" -p teacher.zip -D . 2>/dev/null; then
            unzip -q teacher.zip -d teacher-set && rm teacher.zip
            python teacher.py --set teacher-set --crops crops --cap "${{ steps.s.outputs.per_class }}" || echo "::warning::Couldn't add the Gemini-named photos; training without them"
          else
            echo "No Gemini-named photos yet"
          fi

      # Feature prints take about an hour for 30,000 pictures; earlier ones are kept and reused by file.
      - name: Keep feature prints between runs
        uses: actions/cache@v4
        with:
          path: ml/item-namer/feats
          key: item-namer-feats-v1-${{ steps.s.outputs.per_class }}-${{ steps.s.outputs.min_class }}-${{ github.run_id }}
          restore-keys: item-namer-feats-v1-${{ steps.s.outputs.per_class }}-${{ steps.s.outputs.min_class }}-

      - name: Feature prints (Apple Vision)
        run: swift features.swift crops feats

      - name: Train the namer
        run: |
          . .venv/bin/activate
          pip install --quiet numpy
          python fit.py --feats feats --crops crops --out out
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: item-namer
          path: |
            ml/item-namer/out/namer.f32
            ml/item-namer/out/labels.json
            ml/item-namer/out/metrics.json
            ml/item-namer/out/fixes.json

      - name: Publish the model
        id: publish
        if: ${{ steps.s.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.s.outputs.version }}"
          if [ "$v" = "auto" ]; then
            last=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' | sed -n 's/^item-namer-v\([0-9]*\)$/\1/p' | sort -n | tail -1)
            v=$(( ${last:-0} + 1 ))
          fi
          tag="item-namer-v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" out/namer.f32 out/labels.json out/metrics.json \
            --title "Item namer v$v" \
            --notes "Names each thing the phone finds in a photo, for Curbsy and ToteTrack. Softmax weights over Apple Vision feature prints (revision 2), trained on LVIS (CC BY 4.0) and Open Images (CC BY 4.0, photos CC BY 2.0) crops. $(cat out/metrics.json | tr -d '\n')" \
            --target "${{ github.sha }}"

      # Phones switch to it (release item-namer-current) only if it's at least as good when it's sure.
      - name: Let phones use it if it's better
        if: ${{ steps.publish.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 promote.py --dir out --tag "${{ steps.publish.outputs.tag }}"
