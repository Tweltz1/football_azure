name: Talk Shops text sorter retrain

# Once a week, retrain the customer text sorter with real, scrubbed shop texts (talkshops_learn_texts) and publish
# it only if it does at least as well on the hand-written test texts. Logs show counts only, never texts.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Talk Shops' own Supabase project once TALKSHOPS_SUPABASE_PROJECT_ID is set; the shared project until then.
      SUPABASE_PROJECT_ID: ${{ secrets.TALKSHOPS_SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-6lgsrr
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Retrain and compare
        run: node ml/sms-topics/retrain.mjs
      - name: Publish the better model
        run: |
          if [ ! -f /tmp/sorter-improved ]; then echo "Nothing to publish."; exit 0; fi
          node --test supabase/tests/smsTopicModel.test.ts supabase/tests/shopSms.test.ts
          git config user.name "talkshops-retrain"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/_shared/smsTopicWeights.ts
          git commit -m "Talk Shops: weekly text sorter retrain with real scrubbed texts" || exit 0
          git push origin HEAD:claude/project-thread-6lgsrr
          gh workflow run deploy-supabase.yml --ref claude/project-thread-6lgsrr
          gh workflow run deploy-talkshops-supabase.yml --ref claude/project-thread-6lgsrr
