# Builds the Grocery Runner iPhone app (grocery-runner-app/, Expo + React Native) on a GitHub macOS
# machine, so no Mac is needed. Same Apple secrets as ToteTrack and the Hood League apps:
#   APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY
# Online lookups (Kroger aisles, Walmart store search, shared shopper aisles) go through the
# grocery-runner Supabase function in the Hood League Supabase project, deployed by the "backend" job
# when SUPABASE_ACCESS_TOKEN is set. Optional: KROGER_CLIENT_ID + KROGER_CLIENT_SECRET (free, from
# https://developer.kroger.com) and WALMART_CONSUMER_ID + WALMART_PRIVATE_KEY (+ WALMART_KEY_VERSION)
# from https://walmart.io. Without them the app still builds and falls back to department sorting.
#
# - Every push that touches grocery-runner-app/ runs the tests, typechecks, builds for the iPhone
#   simulator and saves screenshots to the grocery-runner-screenshots branch.
# - A push whose commit message contains [grocery-upload] (or "Run workflow" with "Upload to
#   TestFlight" ticked) signs the app and sends it to App Store Connect. The app record
#   (bundle ID com.tweltz1.groceryrunner) must exist in App Store Connect first.
name: Grocery Runner iPhone app

on:
  push:
    paths:
      - 'grocery-runner-app/**'
      - '.github/workflows/grocery-runner-app.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight'
        type: boolean
        default: false

concurrency:
  group: grocery-runner-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'nkwedlskhnojseeroezm' }}
      KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
      KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
      WALMART_CONSUMER_ID: ${{ secrets.WALMART_CONSUMER_ID }}
      WALMART_KEY_VERSION: ${{ secrets.WALMART_KEY_VERSION }}
      WALMART_PRIVATE_KEY: ${{ secrets.WALMART_PRIVATE_KEY }}
    defaults:
      run:
        working-directory: grocery-runner-app
    steps:
      - uses: actions/checkout@v4
      - name: Shared aisle table, lookup secrets and the grocery-runner function
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so the Grocery Runner backend was not deployed."
            exit 0
          fi
          python3 tools/setup_supabase.py
          SET=()
          if [ -n "$KROGER_CLIENT_ID" ] && [ -n "$KROGER_CLIENT_SECRET" ]; then
            SET+=(KROGER_CLIENT_ID="$KROGER_CLIENT_ID" KROGER_CLIENT_SECRET="$KROGER_CLIENT_SECRET")
          else
            echo "::notice::No Kroger keys yet; Kroger stores will use shared aisles and departments."
          fi
          if [ -n "$WALMART_CONSUMER_ID" ] && [ -n "$WALMART_PRIVATE_KEY" ]; then
            SET+=(WALMART_CONSUMER_ID="$WALMART_CONSUMER_ID" WALMART_KEY_VERSION="${WALMART_KEY_VERSION:-1}" WALMART_PRIVATE_KEY="$WALMART_PRIVATE_KEY")
          else
            echo "::notice::No Walmart affiliate keys; Walmart stores are picked by ZIP."
          fi
          if [ ${#SET[@]} -gt 0 ]; then
            npx -y supabase@latest secrets set --project-ref "$SUPABASE_PROJECT_ID" --yes "${SET[@]}"
          fi
          npx -y supabase@latest functions deploy grocery-runner --project-ref "$SUPABASE_PROJECT_ID" --use-api --yes

      - name: Smoke test the live function
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then exit 0; fi
          KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys" \
            | python3 -c 'import json,sys; print(next((k["api_key"] for k in json.load(sys.stdin) if k.get("name") == "anon"), ""))')
          FN="https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/grocery-runner"
          H=(-H "Authorization: Bearer $KEY" -H "apikey: $KEY")
          echo "status: $(curl -fsS "${H[@]}" "$FN?action=status")"
          echo "official stores near Madison, WI: $(curl -fsS "${H[@]}" "$FN?action=nearby&lat=43.0731&lon=-89.4012" | head -c 300)"
          echo "coverage: $(curl -fsS "${H[@]}" -H "Content-Type: application/json" -d '{"action":"coverage","stores":["woodmans:g43073xm89401"]}' "$FN")"
          curl -fsS "${H[@]}" -H "Content-Type: application/json" -d '{"action":"aisles","store":"woodmans:osm-test","items":["milk"]}' "$FN"; echo

  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || contains(github.event.head_commit.message, '[grocery-upload]') }}
      BUILD_NUMBER: ${{ github.run_number }}
      CI: 1
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'nkwedlskhnojseeroezm' }}
    defaults:
      run:
        working-directory: grocery-runner-app
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 58 builds with Xcode 27 (Xcode 26's Swift rejects some of its code).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode
        run: ls /Applications | grep -i xcode; xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and check the code
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx tsc --noEmit
          npx expo lint

      - name: Register the bundle ID with Apple
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY" ]; then echo "No App Store Connect secrets; skipping"; exit 0; fi
          python3 -m venv "$RUNNER_TEMP/apple-api"
          "$RUNNER_TEMP/apple-api/bin/pip" -q install 'PyJWT[crypto]'
          "$RUNNER_TEMP/apple-api/bin/python" tools/register_bundle_id.py

      - name: Point the app at the grocery-runner function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
        run: |
          KEY="$REACT_APP_SUPABASE_ANON_KEY"
          if [ -z "$KEY" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys" \
              | python3 -c 'import json,sys; print(next((k["api_key"] for k in json.load(sys.stdin) if k.get("name") == "anon"), ""))') || KEY=""
          fi
          if [ -z "$KEY" ]; then echo "::warning::No Supabase anon key; the app will build without online lookups"; fi
          # Baked into the JavaScript bundle by the Xcode build (it's the public key, like the website's).
          echo "EXPO_PUBLIC_SUPABASE_URL=https://$SUPABASE_PROJECT_ID.supabase.co" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        run: npx expo prebuild --platform ios --clean

      - name: Build for the iPhone simulator
        if: env.UPLOAD != 'true'
        run: |
          set -o pipefail
          xcodebuild -workspace ios/GroceryRunner.xcworkspace -scheme GroceryRunner -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:" -A4 "$RUNNER_TEMP/build.log" | head -n 120; tail -n 30 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -n 15 "$RUNNER_TEMP/build.log"

      - name: Screenshots on a simulated iPhone
        if: env.UPLOAD != 'true'
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/GroceryRunner.app"
          mkdir -p shots
          read -r DEV NAME < <(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in d if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[1].split("-")])
          devs = [x for x in d[ios[-1]] if "Pro" in x["name"] and "Max" not in x["name"]] or d[ios[-1]]
          print(devs[0]["udid"], devs[0]["name"].replace(" ", "_"))')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$DEV" "$APP"
          START=$(date "+%Y-%m-%d %H:%M:%S")
          xcrun simctl launch "$DEV" com.tweltz1.groceryrunner
          sleep 15
          xcrun simctl io "$DEV" screenshot "shots/$NAME-1-home.png"
          xcrun simctl spawn "$DEV" log show --start "$START" --style compact --predicate 'process == "GroceryRunner"' > "shots/app-log.txt" 2>&1 || true
          xcrun simctl shutdown "$DEV"
          cd shots
          git init -q -b grocery-runner-screenshots
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" grocery-runner-screenshots

      - uses: actions/upload-artifact@v4
        if: env.UPLOAD != 'true'
        with:
          name: grocery-runner-screenshots
          path: grocery-runner-app/shots/

      - name: Sign and upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -o pipefail
          for v in APPLE_TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER_ID")

          # Archive unsigned; the export below signs it for the App Store with Apple's cloud signing.
          xcodebuild -workspace ios/GroceryRunner.xcworkspace -scheme GroceryRunner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/GroceryRunner.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:" -A4 "$RUNNER_TEMP/archive.log" | head -n 120; tail -n 30 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -n 15 "$RUNNER_TEMP/archive.log"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GroceryRunner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY_PATH"
