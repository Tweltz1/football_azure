name: Merch probe (read-only)
# Lists each hat blank's Printful print spots, extra-spot costs and blank cost. Changes nothing.
on:
  push:
    branches: [claude/project-thread-tzb384]
    paths: ['scripts/merch-probe.mjs', '.github/workflows/merch-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PRINTFUL_API_TOKEN: ${{ secrets.PRINTFUL_API_TOKEN }}
      PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/merch-probe.mjs
