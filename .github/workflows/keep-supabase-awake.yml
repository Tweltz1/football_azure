name: Keep Supabase awake

# Free Supabase projects pause after a week with no activity. This pings the API (which reads the
# database) every three days so the site stays up during the off-season.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health check
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: curl --fail --silent --show-error --retry 3 "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/api/health"
