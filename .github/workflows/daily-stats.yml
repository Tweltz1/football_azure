name: Daily app stats

# Read-only usage counts for the hobby apps (shared Supabase project), for the 5 AM Central daily review.
# Prints one DAILY_STATS_JSON line with counts only: no names, emails or ids (this repo's logs are public).
on:
  schedule:
    # 08:50 UTC, before the morning review.
    - cron: '50 8 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Usage counts
        run: |
          # One number per query; a query that fails (missing table or column) gives null instead of failing the run.
          n() {
            curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -n --arg q "select ($1)::bigint as n" '{query: $q}')" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" 2>/dev/null \
              | jq -e '.[0].n' 2>/dev/null || echo null
          }
          day="now() - interval '24 hours'"
          week="now() - interval '7 days'"
          out=$(jq -c -n \
            --argjson users_total "$(n "select count(*) from auth.users")" \
            --argjson users_new_24h "$(n "select count(*) from auth.users where created_at > $day")" \
            --argjson users_active_24h "$(n "select count(*) from auth.users where last_sign_in_at > $day")" \
            --argjson users_active_7d "$(n "select count(*) from auth.users where last_sign_in_at > $week")" \
            --argjson curbsy_members "$(n "select count(*) from public.junk_members")" \
            --argjson curbsy_items_total "$(n "select count(*) from public.junk_items")" \
            --argjson curbsy_items_24h "$(n "select count(*) from public.junk_items where created_at > $day")" \
            --argjson curbsy_claims_24h "$(n "select count(*) from public.junk_claims where created_at > $day")" \
            --argjson curbsy_messages_24h "$(n "select count(*) from public.junk_messages where created_at > $day")" \
            --argjson curbsy_plus "$(n "select count(*) from public.junk_plus")" \
            --argjson league_leagues_total "$(n "select count(*) from public.leagues")" \
            --argjson league_leagues_24h "$(n "select count(*) from public.leagues where created_at > $day")" \
            --argjson league_drafts_24h "$(n "select count(*) from public.draft_history where completed_at > $day")" \
            --argjson league_chat_questions_24h "$(n "select count(*) from public.ask_log where created_at > $day")" \
            --argjson games_sessions_24h "$(n "select count(*) from public.game_sessions where updated_at > $day")" \
            --argjson games_card_games_24h "$(n "select count(*) from public.card_games where created_at > $day")" \
            --argjson games_quest_sessions_24h "$(n "select count(*) from public.dnd_sessions where played_at > $day")" \
            --argjson games_scores_24h "$(n "select count(*) from public.game_scores where at > $day")" \
            --argjson totetrack_totes_total "$(n "select count(*) from public.totetrack_totes")" \
            --argjson totetrack_users "$(n "select count(distinct user_id) from public.totetrack_totes")" \
            --argjson shopstride_rows "$(n "select coalesce(sum(n_live_tup), 0) from pg_stat_user_tables where schemaname = 'public' and relname like 'grocery\_%'")" \
            '$ARGS.named')
          echo "DAILY_STATS_JSON $out"

      - name: Website visits
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Yesterday's (UTC) requests, page views and unique visitors for each site the token can see.
          # Cloudflare counts these at its edge, so the pages need no tracking script or cookies.
          [ -n "$CF_TOKEN" ] || { echo 'SITE_VISITS_JSON {}'; exit 0; }
          cf() { curl --silent --show-error --max-time 30 -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          day=$(date -u -d yesterday +%F)
          out='{}'
          for site in weltzcraft.com hood-league.com talkshops.app; do
            zone=$(cf "https://api.cloudflare.com/client/v4/zones?name=$site" | jq -r '.result[0].id // empty' 2>/dev/null || true)
            row=null
            if [ -n "$zone" ]; then
              q='query($z:String!,$d:Date!){viewer{zones(filter:{zoneTag:$z}){httpRequests1dGroups(limit:1,filter:{date:$d}){sum{requests pageViews} uniq{uniques}}}}}'
              r=$(cf https://api.cloudflare.com/client/v4/graphql -d "$(jq -n --arg q "$q" --arg z "$zone" --arg d "$day" '{query:$q, variables:{z:$z, d:$d}}')" || true)
              row=$(echo "$r" | jq -c '.data.viewer.zones[0].httpRequests1dGroups as $g | if $g == null then null elif ($g | length) == 0 then {requests:0, page_views:0, visitors:0} else {requests:$g[0].sum.requests, page_views:$g[0].sum.pageViews, visitors:$g[0].uniq.uniques} end' 2>/dev/null || echo null)
              [ "$row" = "null" ] && echo "$site: $(echo "$r" | jq -c '[.errors[]?.message]' 2>/dev/null)"
            else
              echo "$site: the token can't see this site"
            fi
            out=$(echo "$out" | jq -c --arg s "$site" --argjson v "${row:-null}" '. + {($s): $v}')
          done
          echo "SITE_VISITS_JSON $(echo "$out" | jq -c --arg d "$day" '{date:$d} + .')"
