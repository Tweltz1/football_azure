# Builds the Junk App iPhone app (ios-junk-app/, the same website build as ios-app/ but opened on the
# Junk App pages at /junk) on a GitHub macOS machine. Same setup and secrets as ios-app.yml:
#
# - Every push that touches ios-junk-app/ or the Junk App pages checks that it still builds for the iPhone simulator.
# - Run it by hand with "Upload to TestFlight" ticked to sign it and send it to App Store Connect. The app
#   (bundle ID com.hoodleague.junk) must exist in App Store Connect first. Secrets used:
#     APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY,
#     REACT_APP_SUPABASE_URL, REACT_APP_SUPABASE_ANON_KEY (or SUPABASE_ACCESS_TOKEN)
name: Curbsy iPhone app

on:
  push:
    paths:
      - 'ios-junk-app/**'
      - 'frontend/src/junk/**'
      - 'frontend/src/native/**'
      - '.github/workflows/junk-app.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight'
        type: boolean
        default: false

concurrency:
  group: junk-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 45
    env:
      REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL || 'https://nkwedlskhnojseeroezm.supabase.co' }}
      REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the website
        working-directory: frontend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'nkwedlskhnojseeroezm' }}
        run: |
          if [ -z "$REACT_APP_SUPABASE_ANON_KEY" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            # Same public key the live site ships with, asked from Supabase with the deploy token.
            KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys" \
              | python3 -c 'import json,sys; print(next((k["api_key"] for k in json.load(sys.stdin) if k.get("name") == "anon"), ""))') || KEY=""
            export REACT_APP_SUPABASE_ANON_KEY="$KEY"
          fi
          if [ -z "$REACT_APP_SUPABASE_ANON_KEY" ]; then
            echo "::error::No site key: add REACT_APP_SUPABASE_ANON_KEY (or SUPABASE_ACCESS_TOKEN) to the repo secrets"; exit 1
          fi
          npm ci --no-audit --no-fund
          CI=false npm run build

      # Free on-device object detector (Apple's Core ML build of YOLOv3-Tiny) so a photo of a curb pile can
      # list each thing separately. A failed download only means this build labels the whole photo instead.
      - name: Download the object detection model
        working-directory: ios-junk-app
        run: |
          mkdir -p models
          for name in YOLOv3Tiny YOLOv3TinyInt8LUT; do
            if curl -fsSL --retry 3 -o models/YOLOv3Tiny.mlmodel "https://ml-assets.apple.com/coreml/models/Image/ObjectDetection/YOLOv3Tiny/$name.mlmodel"; then
              if [ "$(wc -c < models/YOLOv3Tiny.mlmodel)" -gt 1000000 ]; then echo "Got $name"; break; fi
            fi
            rm -f models/YOLOv3Tiny.mlmodel
          done
          ls -l models || true

      # Our own item namer (ml/item-namer, release item-namer-vN): names each thing in a photo from Apple's
      # feature print. A failed download only means this build uses Apple's labels alone.
      - name: Download the item namer
        working-directory: ios-junk-app
        env:
          # item-namer-current is the newest namer that passed the check in item-namer-promote.yml (phones
          # also download it from there between app updates); item-namer-v1 is the fallback.
          NAMERS: item-namer-current item-namer-v1
        run: |
          mkdir -p models
          got=""
          for NAMER in $NAMERS; do
            base="https://github.com/${{ github.repository }}/releases/download/$NAMER"
            if curl -fsSL --retry 3 -o models/namer.f32 "$base/namer.f32" && curl -fsSL --retry 3 -o models/namer-labels.json "$base/labels.json"; then
              got="$NAMER"; break
            fi
          done
          if [ -n "$got" ]; then
            echo "Got $got ($(wc -c < models/namer.f32) bytes)"
          else
            rm -f models/namer.f32 models/namer-labels.json
            echo "::warning::Item namer not downloaded; this build names things with Apple's labels only"
          fi

      # Free on-device explicit-photo check (NSFWDetector by LOVOO, BSD 3-clause, 17 KB) used by PhotoSafetyPlugin
      # before a photo is uploaded. Checked against a known hash; a failed download only skips that one check.
      - name: Download the photo safety model
        working-directory: ios-junk-app
        run: |
          mkdir -p models
          if curl -fsSL --retry 3 -o models/NSFW.mlmodel "https://raw.githubusercontent.com/lovoo/NSFWDetector/master/NSFWDetector/Classes/NSFW.mlmodel" \
            && echo "1b872d9620b8d41f10132f29063d751ffb53c6785bae7f601a1d40f4bd873778  models/NSFW.mlmodel" | shasum -a 256 -c -; then
            echo "Got the photo safety model"
          else
            rm -f models/NSFW.mlmodel
            echo "::warning::Photo safety model not downloaded; this build skips the explicit-photo check"
          fi

      - name: Copy the website into the iPhone project
        working-directory: ios-junk-app
        run: |
          npm ci --no-audit --no-fund
          npm run sync

      - name: Build for the iPhone simulator
        if: ${{ !inputs.upload }}
        working-directory: ios-junk-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}

      - name: Screenshots on a simulated iPhone
        if: ${{ !inputs.upload }}
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          mkdir -p shots
          xcrun simctl list runtimes > shots/runtimes.txt
          # Newest iPhone Pro on the newest iOS, and the smallest iPhone on the oldest iOS this Mac has.
          PICK='import json,sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in d if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[1].split("-")])
          mode = sys.argv[1]
          if mode == "new":
              r = ios[-1]; devs = [x for x in d[r] if "Pro" in x["name"] and "Max" not in x["name"]]
          else:
              r = ios[0]; devs = sorted(d[r], key=lambda x: (("SE" not in x["name"]), ("mini" not in x["name"]), x["name"]))
          x = devs[0]; print(x["udid"], r.split("iOS-")[1].replace("-", "."), x["name"].replace(" ", "_"))'
          run_on() {
            read -r DEV OS NAME < <(xcrun simctl list devices available -j | python3 -c "$PICK" "$1")
            TAG="$1-iOS$OS-$NAME"
            echo "Running on $TAG"
            xcrun simctl boot "$DEV"
            xcrun simctl bootstatus "$DEV" -b
            xcrun simctl status_bar "$DEV" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
            xcrun simctl install "$DEV" "$APP"
            # Location on, somewhere with a map, so the first screen isn't the permission prompt.
            xcrun simctl privacy "$DEV" grant location com.hoodleague.junk || true
            xcrun simctl location "$DEV" set 44.9778,-93.2650 || true
            START=$(date "+%Y-%m-%d %H:%M:%S")
            xcrun simctl launch "$DEV" com.hoodleague.junk
            sleep 20
            xcrun simctl io "$DEV" screenshot "shots/$TAG-app-open.png"
            # The app's console (web page errors show up here) for bug hunting.
            xcrun simctl spawn "$DEV" log show --start "$START" --style compact --predicate 'process == "App"' > "shots/$TAG-app-log.txt" 2>&1 || true
            xcrun simctl terminate "$DEV" com.hoodleague.junk
            sleep 3
            xcrun simctl io "$DEV" screenshot "shots/$TAG-home-screen.png"
            xcrun simctl shutdown "$DEV"
          }
          run_on new
          run_on old
          # Also save them on the junk-app-screenshots branch, for viewers that can't download artifacts.
          cd shots
          git init -q -b junk-app-screenshots
          git -c user.name=github-actions -c user.email=actions@github.com commit -q --allow-empty -m "Screenshots from ${GITHUB_SHA::7}"
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" junk-app-screenshots

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload }}
        with:
          name: junk-app-screenshots
          path: shots/

      - name: Sign and upload to TestFlight
        if: ${{ inputs.upload }}
        working-directory: ios-junk-app/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          for v in APPLE_TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER_ID")

          # Archive unsigned (signing it here would need a registered iPhone for a development
          # profile); the export below signs it for the App Store with Apple's cloud signing.
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 40
          test ${PIPESTATUS[0]} -eq 0

          # Saved-search alerts (Curbsy Plus) need the Push Notifications capability on the App ID and the
          # aps-environment entitlement in the app. The archive above is unsigned, so sign the entitlement in
          # here (a throwaway signature; the export re-signs it for the App Store and keeps the entitlement).
          APP_PATH="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          adhoc_sign() {
            find "$APP_PATH/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \; 2>/dev/null || true
            codesign --force --sign - "$@" "$APP_PATH"
          }
          PUSH=0
          if KEY_P8="$KEY_P8" KEY_ID="$KEY_ID" ISSUER_ID="$ISSUER_ID" node ../../enable-push.js; then
            adhoc_sign --entitlements App/App.entitlements && PUSH=1
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          EOF

          if ! xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"; then
            if [ "$PUSH" != 1 ]; then rm -f "$KEY_PATH"; exit 1; fi
            # Don't hold the whole build back over notifications: upload it without them.
            echo "::warning::Upload with the notifications entitlement failed; uploading this build without saved-search alerts."
            codesign --remove-signature "$APP_PATH" && adhoc_sign
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" || { rm -f "$KEY_PATH"; exit 1; }
          fi
          rm -f "$KEY_PATH"
