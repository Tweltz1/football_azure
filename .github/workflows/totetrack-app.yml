# Builds the ToteTrack iPhone app (totetrack-app/, Expo + React Native) on a GitHub macOS machine,
# so no Mac is needed. Same Apple secrets as the Hood League and Hood Games apps:
#   APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY
# Cloud backup uses the Hood League Supabase project: SUPABASE_ACCESS_TOKEN (sets up the table and
# sign-in settings, and fetches the public anon key) or REACT_APP_SUPABASE_ANON_KEY.
#
# - Every push that touches totetrack-app/ typechecks, builds for the iPhone simulator and saves
#   screenshots to the totetrack-screenshots branch.
# - A push whose commit message contains [totetrack-upload] (or "Run workflow" with "Upload to
#   TestFlight" ticked) signs the app and sends it to App Store Connect. The app record
#   (bundle ID com.tweltz1.totetrack) must exist in App Store Connect first.
name: ToteTrack iPhone app

on:
  push:
    paths:
      - 'totetrack-app/**'
      - '!totetrack-app/tools/detector/**'
      - '!totetrack-app/tools/namer/**'
      - '.github/workflows/totetrack-app.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight'
        type: boolean
        default: false

concurrency:
  group: totetrack-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || contains(github.event.head_commit.message, '[totetrack-upload]') }}
      BUILD_NUMBER: ${{ github.run_number }}
      CI: 1
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'nkwedlskhnojseeroezm' }}
    defaults:
      run:
        working-directory: totetrack-app
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 58 builds with Xcode 27 (Xcode 26's Swift rejects some of its code).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode
        run: ls /Applications | grep -i xcode; xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and check the code
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx expo lint

      - name: Register the bundle ID with Apple
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY" ]; then echo "No App Store Connect secrets; skipping"; exit 0; fi
          python3 -m venv "$RUNNER_TEMP/apple-api"
          "$RUNNER_TEMP/apple-api/bin/pip" -q install 'PyJWT[crypto]'
          "$RUNNER_TEMP/apple-api/bin/python" tools/register_bundle_id.py

      - name: Set up cloud backup in Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
        run: |
          KEY="$REACT_APP_SUPABASE_ANON_KEY"
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            python3 tools/setup_supabase.py
            if [ -z "$KEY" ]; then
              KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys" \
                | python3 -c 'import json,sys; print(next((k["api_key"] for k in json.load(sys.stdin) if k.get("name") == "anon"), ""))') || KEY=""
            fi
          fi
          if [ -z "$KEY" ]; then echo "::warning::No Supabase anon key; the app will build without cloud backup"; fi
          # Baked into the JavaScript bundle by the Xcode build (it's the public key, like the website's).
          echo "EXPO_PUBLIC_SUPABASE_URL=https://$SUPABASE_PROJECT_ID.supabase.co" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"

      # Snap to add finds each separate item with Apple's free YOLOv3 Tiny Core ML model
      # (developer.apple.com/machine-learning/models). It's downloaded here, not kept in git, and
      # compiled so the app can load it straight away. If Apple's download is ever unavailable, the
      # app still builds and Snap to add falls back to whole-photo labels and printed text.
      - name: Add the on-device object detector
        run: |
          DIR=modules/tote-native/ios/models
          NAME=YOLOv3TinyInt8LUT
          URL="https://ml-assets.apple.com/coreml/models/Image/ObjectDetection/YOLOv3Tiny/$NAME.mlmodel"
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/$NAME.mlmodel" "$URL"; then
            shasum -a 256 "$RUNNER_TEMP/$NAME.mlmodel"
            xcrun coremlc compile "$RUNNER_TEMP/$NAME.mlmodel" "$DIR"
            ls -la "$DIR"
          else
            echo "::warning::Couldn't download $NAME; Snap to add will build without per-item detection"
          fi

      # Snap to add names each thing with ToteTrack's own item namer (TinyCLIP, MIT license, trained by
      # .github/workflows/totetrack-build-namer.yml). The newest totetrack-namer release is downloaded and
      # compiled here, not kept in git. Without it Snap to add still works with Apple's labels.
      - name: Add the item namer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIR=modules/tote-native/ios/models
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq '[.[] | select(.tag_name | startswith("totetrack-namer-"))] | sort_by(.created_at) | last | .tag_name // empty' || true)
          # The newest successful namer build on the ToteTrack branch (kept 90 days), else the newest release.
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/totetrack-build-namer.yml/runs?status=success&event=push&branch=claude/totetrack-app&per_page=1" \
            --jq '.workflow_runs[0].id // empty' || true)
          if { [ -n "$RUN" ] && gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n totetrack-namer --dir "$RUNNER_TEMP/namer"; } \
             || { [ -n "$TAG" ] && gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/namer" \
               --pattern 'ToteNamer.mlpackage.zip' --pattern 'items.json' --pattern 'items.bin'; }; then
            echo "Using namer run $RUN / release $TAG"
            (cd "$RUNNER_TEMP/namer" && unzip -q ToteNamer.mlpackage.zip)
            xcrun coremlc compile "$RUNNER_TEMP/namer/ToteNamer.mlpackage" "$DIR"
            cp "$RUNNER_TEMP/namer/items.json" "$DIR/ToteNamerItems.json"
            cp "$RUNNER_TEMP/namer/items.bin" "$DIR/ToteNamerItems.bin"
            ls -la "$DIR"
          else
            echo "::warning::No item namer release found; Snap to add will build without it"
          fi

      - name: Generate the Xcode project
        run: npx expo prebuild --platform ios --clean

      - name: Build for the iPhone simulator
        if: env.UPLOAD != 'true'
        run: |
          set -o pipefail
          xcodebuild -workspace ios/ToteTrack.xcworkspace -scheme ToteTrack -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:" -A4 "$RUNNER_TEMP/build.log" | head -n 120; tail -n 30 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -n 15 "$RUNNER_TEMP/build.log"

      - name: Screenshots on a simulated iPhone
        if: env.UPLOAD != 'true'
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/ToteTrack.app"
          mkdir -p shots
          read -r DEV NAME < <(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in d if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[1].split("-")])
          devs = [x for x in d[ios[-1]] if "Pro" in x["name"] and "Max" not in x["name"]] or d[ios[-1]]
          print(devs[0]["udid"], devs[0]["name"].replace(" ", "_"))')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$DEV" "$APP"
          START=$(date "+%Y-%m-%d %H:%M:%S")
          xcrun simctl launch "$DEV" com.tweltz1.totetrack
          sleep 15
          xcrun simctl io "$DEV" screenshot "shots/$NAME-1-home.png"
          xcrun simctl spawn "$DEV" log show --start "$START" --style compact --predicate 'process == "ToteTrack"' > "shots/app-log.txt" 2>&1 || true
          xcrun simctl shutdown "$DEV"
          cd shots
          git init -q -b totetrack-screenshots
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" totetrack-screenshots

      - uses: actions/upload-artifact@v4
        if: env.UPLOAD != 'true'
        with:
          name: totetrack-screenshots
          path: totetrack-app/shots/

      - name: Sign and upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -o pipefail
          for v in APPLE_TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER_ID")

          # Archive unsigned; the export below signs it for the App Store with Apple's cloud signing.
          xcodebuild -workspace ios/ToteTrack.xcworkspace -scheme ToteTrack -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ToteTrack.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:" -A4 "$RUNNER_TEMP/archive.log" | head -n 120; tail -n 30 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -n 15 "$RUNNER_TEMP/archive.log"

          # The archive is unsigned, so its entitlements (Sign in with Apple, NFC) aren't in it, and the cloud
          # signing below only keeps entitlements the app already carries. Without this, Apple's sign-in sheet
          # fails with "The authorization attempt failed for an unknown reason". Turn the capabilities on for
          # the App ID, then sign the entitlements in with a throwaway signature that the export replaces.
          KEY_P8="$KEY_P8" KEY_ID="$KEY_ID" ISSUER_ID="$ISSUER_ID" node tools/enable_capabilities.js || { rm -f "$KEY_PATH"; exit 1; }
          APP_PATH="$RUNNER_TEMP/ToteTrack.xcarchive/Products/Applications/ToteTrack.app"
          ENT=ios/ToteTrack/ToteTrack.entitlements
          test -f "$ENT" || { echo "::error::$ENT not found after prebuild"; rm -f "$KEY_PATH"; exit 1; }
          cat "$ENT"
          find "$APP_PATH/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \; 2>/dev/null || true
          codesign --force --sign - --entitlements "$ENT" "$APP_PATH"
          codesign -d --entitlements - "$APP_PATH" | grep -q applesignin || { echo "::error::Sign in with Apple entitlement missing"; rm -f "$KEY_PATH"; exit 1; }

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ToteTrack.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY_PATH"
