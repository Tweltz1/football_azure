name: Merch hat scout (read-only)
# Lists Printful performance / athletic caps with colors, print spots and costs. Changes nothing.
on:
  push:
    branches: [claude/project-thread-3fy47d]
    paths: ['scripts/merch-hat-scout.mjs', '.github/workflows/merch-hat-scout.yml']
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      PRINTFUL_API_TOKEN: ${{ secrets.PRINTFUL_API_TOKEN }}
      PRINTFUL_STORE_ID: ${{ secrets.PRINTFUL_STORE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/merch-hat-scout.mjs
