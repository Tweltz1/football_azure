name: weltzcraft.com layout check

# Opens weltzcraft-site/ in a headless browser at phone, tablet and desktop widths and fails if a
# page scrolls sideways, throws a script error, or the top menu wraps or collides.
on:
  pull_request:
    paths: ['weltzcraft-site/**', 'scripts/weltzcraft-layout-check.js', '.github/workflows/weltzcraft-site-check.yml']
  push:
    branches: [main]
    paths: ['weltzcraft-site/**', 'scripts/weltzcraft-layout-check.js', '.github/workflows/weltzcraft-site-check.yml']
  workflow_dispatch:

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/weltzcraft-layout-check.js
