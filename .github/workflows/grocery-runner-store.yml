# Shop Stride's App Store listing, done from GitHub so no Mac or typing into App Store Connect is needed.
#
# - A push whose commit message contains [stride-shots] builds the app with a sample list
#   (EXPO_PUBLIC_DEMO=1, src/lib/demo.ts), photographs each screen on a simulated iPhone Pro Max and
#   saves the pictures to the grocery-runner-store-shots branch.
# - A push whose commit message contains [stride-listing] fills in the App Store listing from
#   grocery-runner-app/store/listing.json with tools/app_store_listing.py.
name: Shop Stride App Store listing

on:
  push:
    paths:
      - 'grocery-runner-app/**'
      - '.github/workflows/grocery-runner-store.yml'

concurrency:
  group: grocery-runner-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    if: contains(github.event.head_commit.message, '[stride-shots]')
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CI: 1
      EXPO_PUBLIC_DEMO: 1
    defaults:
      run:
        working-directory: grocery-runner-app
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Point the app at the grocery-runner function (for the Stores tab)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'nkwedlskhnojseeroezm' }}
        run: |
          KEY="$REACT_APP_SUPABASE_ANON_KEY"
          if [ -z "$KEY" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys" \
              | python3 -c 'import json,sys; print(next((k["api_key"] for k in json.load(sys.stdin) if k.get("name") == "anon"), ""))') || KEY=""
          fi
          echo "EXPO_PUBLIC_SUPABASE_URL=https://$SUPABASE_PROJECT_ID.supabase.co" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Generate the Xcode project
        run: npx expo prebuild --platform ios --clean
      - name: Build for the iPhone simulator (sample list)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/ShopStride.xcworkspace -scheme ShopStride -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:" -A4 "$RUNNER_TEMP/build.log" | head -n 120; tail -n 30 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/build.log"
      - name: Photograph the screens on an iPhone Pro Max
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/ShopStride.app"
          mkdir -p shots
          read -r DEV NAME < <(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in d if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[1].split("-")])
          devs = [x for x in d[ios[-1]] if "Pro Max" in x["name"]] or [x for x in d[ios[-1]] if "Plus" in x["name"]] or d[ios[-1]]
          print(devs[-1]["udid"], devs[-1]["name"].replace(" ", "_"))')
          echo "Simulator: $NAME"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl ui "$DEV" appearance light || true
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryLevel 100 --batteryState charged --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$DEV" "$APP"
          # Madison, WI, with location already allowed, so the Stores tab has stores and no permission prompt.
          xcrun simctl privacy "$DEV" grant location com.tweltz1.groceryrunner || true
          xcrun simctl location "$DEV" set 43.0731,-89.4012 || true
          xcrun simctl launch "$DEV" com.tweltz1.groceryrunner
          sleep 25
          xcrun simctl terminate "$DEV" com.tweltz1.groceryrunner || true
          sleep 3
          xcrun simctl launch "$DEV" com.tweltz1.groceryrunner
          # The app shows a new screen every 20 seconds (src/lib/demo.ts); photograph the middle of each.
          sleep 12
          for SHOT in 1-list 2-route 3-recipes 4-recipe 5-community 6-stores 7-account 8-item; do
            xcrun simctl io "$DEV" screenshot "shots/$SHOT.png"
            sleep 19
          done
          xcrun simctl ui "$DEV" appearance dark || true
          xcrun simctl terminate "$DEV" com.tweltz1.groceryrunner || true
          sleep 2
          xcrun simctl launch "$DEV" com.tweltz1.groceryrunner
          sleep 12
          xcrun simctl io "$DEV" screenshot "shots/9-list-dark.png"
          sleep 20
          xcrun simctl io "$DEV" screenshot "shots/10-route-dark.png"
          xcrun simctl shutdown "$DEV"
          sips -g pixelWidth -g pixelHeight shots/*.png
          echo "$NAME" > shots/device.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # GitHub's artifact service has outages; the pictures also go to a branch
        with:
          name: grocery-runner-store-shots
          path: grocery-runner-app/shots/
      - name: Save the screenshots to the grocery-runner-store-shots branch
        run: |
          cd shots
          git init -q -b grocery-runner-store-shots
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "App Store screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" grocery-runner-store-shots

  listing:
    if: contains(github.event.head_commit.message, '[stride-listing]') || contains(github.event.head_commit.message, '[stride-submit]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Get the saved screenshots
        run: |
          git fetch -q --depth 1 origin grocery-runner-store-shots && git worktree add -q "$RUNNER_TEMP/shots" FETCH_HEAD \
            || echo "::warning::No saved screenshots yet; the listing is filled in without them"
      - name: Fill in the App Store listing
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
          APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
          APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          SUBMIT: ${{ contains(github.event.head_commit.message, '[stride-submit]') && '1' || '0' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/apple-api"
          "$RUNNER_TEMP/apple-api/bin/pip" -q install 'PyJWT[crypto]' pillow
          SHOTS=""
          if [ -f "$RUNNER_TEMP/shots/1-list.png" ]; then
            # App Store screenshots can't have a transparency channel; the simulator's do.
            SHOTS="$RUNNER_TEMP/shots-rgb"
            mkdir -p "$SHOTS"
            "$RUNNER_TEMP/apple-api/bin/python" -c 'import glob, os, sys; from PIL import Image; [Image.open(f).convert("RGB").save(os.path.join(sys.argv[2], os.path.basename(f))) for f in glob.glob(sys.argv[1] + "/*.png")]' "$RUNNER_TEMP/shots" "$SHOTS"
          fi
          "$RUNNER_TEMP/apple-api/bin/python" grocery-runner-app/tools/app_store_listing.py "$SHOTS"
