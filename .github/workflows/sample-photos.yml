name: Weltzcraft sample-site photos

# Downloads CC0 / public-domain stock photos for the weltzcraft.com/sample demo sites
# (scripts/sample-photos.py) and commits them to the branch it ran on.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/sample-photos.py', '.github/workflows/sample-photos.yml']

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python scripts/sample-photos.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add weltzcraft-site/img/sample
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Weltzcraft sample-site photos (CC0 / public domain)"
          git push origin HEAD:${GITHUB_REF_NAME}
