name: Talk Shops Connect Stripe live test

# One-off live test of the "Connect Stripe" button's Stripe calls (same as supabase/functions/_shared/shopPay.ts):
# create a Standard connected account, create its onboarding link, check the link is a Stripe URL, then DELETE the
# test account. Logs are public, so ids, emails and key text are masked; only status, yes/no and permission names print.
on:
  push:
    branches: [claude/project-thread-tw1m90]
    paths: [.github/workflows/talkshops-connect-e2e.yml]
  workflow_dispatch:

permissions: {}

concurrency: { group: talkshops-connect-e2e, cancel-in-progress: false }

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      STRIPE_KEY: ${{ secrets.TALKSHOPS_STRIPE_SECRET_KEY }}
    steps:
      - name: Connect Stripe end to end
        run: |
          cat > e2e.mjs <<'JS'
          const key = process.env.STRIPE_KEY;
          const mask = (s) => String(s || '').replace(/acct_[A-Za-z0-9]+/g, 'acct_***').replace(/[rs]k_(live|test)_[A-Za-z0-9*]+/g, 'key_***').replace(/[\w.+-]+@[\w.-]+/g, 'email_***').replace(/mk_[A-Za-z0-9]+/g, 'mk_***').replace(/'[rs]k_live_\.\.\.[A-Za-z0-9]+'/g, "'key_***'");
          async function call(method, path, body) {
            const r = await fetch('https://api.stripe.com/v1/' + path, {
              method, headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/x-www-form-urlencoded' },
              body: body ? new URLSearchParams(body) : undefined,
            });
            let j = {}; try { j = await r.json(); } catch {}
            return { status: r.status, j };
          }
          const err = (r) => r.j.error ? { status: r.status, type: r.j.error.type, code: r.j.error.code || null, message: mask(r.j.error.message) } : null;
          const out = { key: !key ? 'missing' : /^[rs]k_live/.test(key) ? 'live' : 'test' };
          let id = null;
          try {
            if (!key) throw new Error('no key');
            const list = await call('GET', 'accounts?limit=100');
            out.list_accounts = list.status === 200 ? { ok: true, count: list.j.data.length } : err(list);
            // Live Standard accounts can't be deleted by API, so reuse the test account an earlier run left, if any.
            const prior = list.status === 200 ? list.j.data.find((x) => x.metadata?.talkshops_test === 'connect-e2e') : null;
            out.reused_test_account = !!prior;
            const a = prior ? { status: 200, j: prior } : await call('POST', 'accounts', {
              type: 'standard', country: 'US', 'business_profile[name]': 'Talk Shops connect test (delete me)', 'metadata[talkshops_test]': 'connect-e2e',
            });
            out.create_account = a.status === 200 ? { ok: true, type: a.j.type, charges_enabled: a.j.charges_enabled } : err(a);
            if (a.status === 200) {
              id = a.j.id;
              const l = await call('POST', 'account_links', { account: id, type: 'account_onboarding', refresh_url: 'https://talkshops.app/settings?pay=retry', return_url: 'https://talkshops.app/settings?pay=done' });
              out.account_link = l.status === 200 ? { ok: true, url_host: new URL(l.j.url).host, url_path_start: new URL(l.j.url).pathname.split('/').slice(0, 2).join('/'), expires_in_s: l.j.expires_at - Math.floor(Date.now() / 1000) } : err(l);
              const g = await call('GET', 'accounts/' + id);
              out.read_account = g.status === 200 ? { ok: true } : err(g);
            }
          } catch (e) { out.crash = mask(e.message); }
          if (id && !out.reused_test_account && process.env.TRY_DELETE === '1') {
            const d = await call('DELETE', 'accounts/' + id);
            out.delete_account = d.status === 200 ? { ok: true, deleted: d.j.deleted } : err(d);
            if (d.status !== 200) {
              // Fall back: reject it so it can never be used.
              const rj = await call('POST', 'accounts/' + id + '/reject', { reason: 'other' });
              out.reject_account = rj.status === 200 ? { ok: true } : err(rj);
            }
          }
          console.log('TALKSHOPS_CONNECT_E2E ' + JSON.stringify(out, null, 1));
          JS
          node e2e.mjs
