name: Deploy weltzcraft.com

# Publishes weltzcraft-site/ (the Weltzcraft Studios website) to Cloudflare Pages project "weltzcraft"
# and points weltzcraft.com + www.weltzcraft.com at it. Safe to re-run.
# Needs the CLOUDFLARE_API_TOKEN secret with: Zone weltzcraft.com DNS Edit + Zone Read (already there)
# and Account > Cloudflare Pages > Edit (needed to create and deploy the Pages project).
on:
  push:
    branches: [main]
    paths: ['weltzcraft-site/**', '.github/workflows/deploy-weltzcraft-site.yml']
  workflow_dispatch:
    inputs:
      test_brief:
        description: 'Send one test brief through the live form (arrives at sales@weltzcraft.com)'
        type: boolean
        default: false

concurrency: { group: weltzcraft-site, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DOMAIN: weltzcraft.com
      PROJECT: weltzcraft
    steps:
      - uses: actions/checkout@v4

      - name: Find account and make sure the Pages project exists
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::Add the CLOUDFLARE_API_TOKEN secret first"; exit 1; }
          cf() { curl --silent --show-error -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          API=https://api.cloudflare.com/client/v4
          zone=$(cf "$API/zones?name=$DOMAIN")
          ZONE=$(echo "$zone" | jq -r '.result[0].id // empty'); ACCOUNT=$(echo "$zone" | jq -r '.result[0].account.id // empty')
          [ -n "$ZONE" ] || { echo "$zone" | jq -c '.errors'; echo "::error::Token can't see $DOMAIN"; exit 1; }
          echo "ZONE=$ZONE" >> "$GITHUB_ENV"; echo "ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
          p=$(cf "$API/accounts/$ACCOUNT/pages/projects/$PROJECT")
          if [ "$(echo "$p" | jq -r .success)" = "true" ]; then echo "Pages project exists."; exit 0; fi
          if echo "$p" | jq -e '.errors[]? | select(.code == 8000007)' >/dev/null; then
            r=$(cf -X POST "$API/accounts/$ACCOUNT/pages/projects" -d "$(jq -n --arg n "$PROJECT" '{name:$n, production_branch:"main"}')")
            echo "$r" | jq -c '{success, errors}'
            [ "$(echo "$r" | jq -r .success)" = "true" ] && exit 0
          else
            echo "$p" | jq -c '.errors'
          fi
          echo "::error::The CLOUDFLARE_API_TOKEN can't use Cloudflare Pages. In Cloudflare > My Profile > API Tokens, edit the token and add the permission Account > Cloudflare Pages > Edit, then re-run this workflow."
          exit 1

      - name: Give the brief form its email key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A Resend sending key just for this site (limit it to weltzcraft.com).
          RESEND_KEY: ${{ secrets.WELTZCRAFT_RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_KEY" ]; then echo "::warning::No WELTZCRAFT_RESEND_API_KEY secret yet; the brief form will fall back to opening an email."; exit 0; fi
          printf '%s' "$RESEND_KEY" | CLOUDFLARE_ACCOUNT_ID=$ACCOUNT npx --yes wrangler@3 pages secret put RESEND_API_KEY --project-name "$PROJECT"

      - name: Merch shop keys (Stripe checkout + Printful orders)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Same Stripe account as Talk Shops unless a separate WELTZCRAFT_STRIPE_SECRET_KEY is added.
          STRIPE_KEY: ${{ secrets.WELTZCRAFT_STRIPE_SECRET_KEY || secrets.TALKSHOPS_STRIPE_SECRET_KEY }}
          PRINTFUL_KEY: ${{ secrets.PRINTFUL_API_TOKEN }}
          PRINTFUL_STORE: ${{ secrets.PRINTFUL_STORE_ID }}
          # Optional: replaces the default FAMILY promo code (cost + $2 pricing). MERCH_DISCOUNT_CODE is the name to use;
          # the older MERCH_FAMILY_CODE still works if it's the only one set.
          FAMILY_CODE: ${{ secrets.MERCH_DISCOUNT_CODE || secrets.MERCH_FAMILY_CODE }}
        run: |
          put() { CLOUDFLARE_ACCOUNT_ID=$ACCOUNT npx --yes wrangler@3 pages secret put "$1" --project-name "$PROJECT" >/dev/null && echo "set $1"; }
          [ -n "$PRINTFUL_KEY" ] && printf '%s' "$PRINTFUL_KEY" | put PRINTFUL_API_TOKEN
          [ -n "$PRINTFUL_STORE" ] && printf '%s' "$PRINTFUL_STORE" | put PRINTFUL_STORE_ID
          [ -n "$FAMILY_CODE" ] && printf '%s' "$FAMILY_CODE" | put MERCH_FAMILY_CODE
          if [ -n "$PRINTFUL_KEY" ]; then
            # Printful tells the site when a package ships, so the buyer gets the tracking link by email.
            hk=$(printf 'wc-printful-hook:%s' "$PRINTFUL_KEY" | sha256sum | cut -c1-32); echo "::add-mask::$hk"
            curl --silent -X POST https://api.printful.com/webhooks -H "Authorization: Bearer $PRINTFUL_KEY" -H 'Content-Type: application/json' \
              ${PRINTFUL_STORE:+-H "X-PB-Store-Id: $PRINTFUL_STORE"} \
              -d "{\"url\":\"https://$DOMAIN/api/merch/printful-webhook?key=$hk\",\"types\":[\"package_shipped\"]}" \
              | jq -c '{printful_webhook: (.code == 200), types: .result.types, error: .error.message}'
          fi
          if [ -z "$STRIPE_KEY" ]; then echo "::warning::No Stripe key secret; merch checkout stays closed."; exit 0; fi
          printf '%s' "$STRIPE_KEY" | put STRIPE_SECRET_KEY
          # Stripe tells us paid orders at this address. The signing secret is only shown when the endpoint is
          # made, so if the site doesn't have it yet the endpoint is made again.
          HOOK="https://$DOMAIN/api/merch/stripe-webhook"
          st() { curl --silent --show-error -u "$STRIPE_KEY:" "$@"; }
          have=$(curl --silent -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/$PROJECT" \
            | jq -r '.result.deployment_configs.production.env_vars // {} | has("STRIPE_MERCH_WEBHOOK_SECRET")')
          ids=$(st "https://api.stripe.com/v1/webhook_endpoints?limit=100" | jq -r --arg u "$HOOK" '[.data[]? | select(.url == $u) | .id] | join(" ")')
          if [ -n "$ids" ] && [ "$have" = "true" ]; then
            # Keep the endpoint (and its secret) and make sure it hears about ended subscriptions too.
            for id in $ids; do st "https://api.stripe.com/v1/webhook_endpoints/$id" -d "enabled_events[]=checkout.session.completed" -d "enabled_events[]=customer.subscription.deleted" | jq -c '{events: .enabled_events, error: .error.message}' || true; done
            echo "merch webhook ok"; exit 0
          fi
          for id in $ids; do st -X DELETE "https://api.stripe.com/v1/webhook_endpoints/$id" | jq -c '{deleted}'; done
          r=$(st https://api.stripe.com/v1/webhook_endpoints -d url="$HOOK" -d "enabled_events[]=checkout.session.completed" -d "enabled_events[]=customer.subscription.deleted" -d description="weltzcraft.com merch orders to Printful")
          sec=$(echo "$r" | jq -r '.secret // empty')
          if [ -z "$sec" ]; then echo "::error::Could not create the Stripe webhook: $(echo "$r" | jq -r '.error.message // "unknown"')"; exit 1; fi
          echo "::add-mask::$sec"
          printf '%s' "$sec" | put STRIPE_MERCH_WEBHOOK_SECRET
          echo "merch webhook created"

      - name: Merch checkout wallets (Apple Pay + Google Pay)
        # Merch uses Stripe Checkout with no fixed payment method list, so the account's default
        # payment method settings decide what buyers see. This turns Apple Pay and Google Pay on there
        # and registers weltzcraft.com as a payment method domain. Never fails the deploy.
        continue-on-error: true
        env:
          STRIPE_KEY: ${{ secrets.WELTZCRAFT_STRIPE_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_KEY" ]; then echo "::warning::No WELTZCRAFT_STRIPE_SECRET_KEY; skipping wallets."; exit 0; fi
          st() { curl --silent --show-error -u "$STRIPE_KEY:" "$@"; }
          cfgs=$(st "https://api.stripe.com/v1/payment_method_configurations?limit=100")
          err=$(echo "$cfgs" | jq -r '.error.message // empty')
          if [ -n "$err" ]; then echo "::warning::Stripe key can't read payment method settings ($err). Turn on Apple Pay + Google Pay in the Stripe dashboard instead."; fi
          id=$(echo "$cfgs" | jq -r '[.data[]? | select(.is_default == true and .active == true)][0].id // empty')
          if [ -n "$id" ]; then
            r=$(st "https://api.stripe.com/v1/payment_method_configurations/$id"               -d "apple_pay[display_preference][preference]=on"               -d "google_pay[display_preference][preference]=on")
            echo "$r" | jq -c '{config: .name, card: .card.available, apple_pay: .apple_pay.available, google_pay: .google_pay.available, error: .error.message}'
          fi
          for d in "$DOMAIN" "www.$DOMAIN"; do
            have=$(st "https://api.stripe.com/v1/payment_method_domains?domain_name=$d" | jq -r '.data[0].id // empty')
            if [ -z "$have" ]; then have=$(st https://api.stripe.com/v1/payment_method_domains -d domain_name="$d" | jq -r '.id // .error.message'); fi
            st -X POST "https://api.stripe.com/v1/payment_method_domains/$have/validate"               | jq -c '{domain: .domain_name, apple_pay: .apple_pay.status, google_pay: .google_pay.status, error: .error.message}'
          done

      - name: Free website previews (saved previews table + AI key)
        # /build -> /api/preview saves each free preview for 30 days in the shared hobby Supabase project
        # (table weltzcraft_previews, only the site's server key can read it) and has Gemini write the words.
        # Uses Tyler's paid Gemini key, spelled GENINI_TRAINING_KEY in GitHub secrets. Never fails the deploy.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          GEMINI_KEY: ${{ secrets.GENINI_TRAINING_KEY || secrets.GEMINI_TRAINING_KEY || secrets.GEMINI_API_KEY }}
        run: |
          put() { CLOUDFLARE_ACCOUNT_ID=$ACCOUNT npx --yes wrangler@3 pages secret put "$1" --project-name "$PROJECT" >/dev/null && echo "set $1"; }
          if [ -n "$GEMINI_KEY" ]; then printf '%s' "$GEMINI_KEY" | put GEMINI_API_KEY; else echo "::warning::No Gemini key; previews use the built-in wording."; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then echo "::warning::No Supabase secrets; previews won't be saved."; exit 0; fi
          sql=$(cat <<'SQL'
          create table if not exists public.weltzcraft_previews (
            id bigint generated always as identity primary key,
            slug text not null unique,
            answers jsonb not null,
            copy jsonb,
            ip_hash text not null,
            created_at timestamptz not null default now(),
            expires_at timestamptz not null
          );
          create index if not exists weltzcraft_previews_ip_day on public.weltzcraft_previews (ip_hash, created_at);
          create index if not exists weltzcraft_previews_created on public.weltzcraft_previews (created_at);
          alter table public.weltzcraft_previews enable row level security;
          revoke all on public.weltzcraft_previews from anon, authenticated;
          delete from public.weltzcraft_previews where expires_at < now() - interval '7 days';
          SQL
          )
          curl --silent --show-error -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg q "$sql" '{query:$q}')" | head -c 300; echo
          key=$(curl --silent -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" \
            | jq -r '[.[] | select(.type=="secret")][0].api_key // ([.[] | select(.name=="service_role")][0].api_key) // empty')
          [ -n "$key" ] || { echo "::warning::Could not read the Supabase server key"; exit 0; }
          echo "::add-mask::$key"
          printf '%s' "https://$REF.supabase.co" | put SUPABASE_URL
          printf '%s' "$key" | put SUPABASE_SERVICE_KEY

      - name: Make it live (orders table + domain keys)
        # /live: customers pick a domain and pay; Tyler approves; the site buys the domain in the customer's name
        # (Cloudflare Registrar API) and serves their site on it. Orders live in Supabase table weltzcraft_live.
        # The site's server uses CLOUDFLARE_API_TOKEN, which needs (Cloudflare > My Profile > API Tokens > edit):
        # Account > Registrar: Domains > Edit, Zone > DNS > Edit for All zones, Account > Cloudflare Pages > Edit.
        # Set the repo variable REGISTRAR_SANDBOX=1 to use Cloudflare's test registrar (nothing real is bought).
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          SANDBOX: ${{ vars.REGISTRAR_SANDBOX }}
        run: |
          put() { CLOUDFLARE_ACCOUNT_ID=$ACCOUNT npx --yes wrangler@3 pages secret put "$1" --project-name "$PROJECT" >/dev/null && echo "set $1"; }
          printf '%s' "$CF_TOKEN" | put CF_API_TOKEN
          printf '%s' "$ACCOUNT" | put CF_ACCOUNT_ID
          printf '%s' "${SANDBOX:-0}" | put REGISTRAR_SANDBOX
          # Can the token use the Registrar API? (read-only check, buys nothing)
          r=$(curl --silent -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/registrar/domain-check" -d '{"domains":["weltzcraft-test-check-0001.com"]}')
          echo "registrar check: $(echo "$r" | jq -c '{success, errors: [.errors[]?.message], result: .result.domains}')"
          [ "$(echo "$r" | jq -r .success)" = "true" ] || echo "::warning::The Cloudflare token can't use Registrar yet. Add Account > Registrar: Domains > Edit (and Zone > DNS > Edit for All zones) to it."
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then echo "::warning::No Supabase secrets"; exit 0; fi
          sql=$(cat <<'SQL'
          create table if not exists public.weltzcraft_live (
            id uuid primary key default gen_random_uuid(),
            preview_slug text not null,
            domain text not null,
            care boolean not null default false,
            domain_cents int,
            domain_cost text,
            paid_cents int,
            status text not null default 'checkout',
            site jsonb not null,
            customer jsonb,
            stripe_session text,
            stripe_customer text,
            stripe_subscription text,
            workflow jsonb,
            error text,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            live_at timestamptz
          );
          create index if not exists weltzcraft_live_domain on public.weltzcraft_live (domain, status);
          alter table public.weltzcraft_live enable row level security;
          revoke all on public.weltzcraft_live from anon, authenticated;
          delete from public.weltzcraft_live where status = 'checkout' and created_at < now() - interval '14 days';
          SQL
          )
          curl --silent --show-error -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg q "$sql" '{query:$q}')" | head -c 300; echo

      - name: Built-in site features (booking + forms table, preview edit key)
        # Generated sites carry an online booking calendar and a contact / quote form (features.js, /api/site/*).
        # Live sites save each booking or message in weltzcraft_site_requests; the unique index stops two people
        # booking the same time. edit_hash lets the maker of a free preview customize it later. Never fails the deploy.
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then echo "::warning::No Supabase secrets"; exit 0; fi
          sql=$(cat <<'SQL'
          alter table public.weltzcraft_previews add column if not exists edit_hash text;
          alter table public.weltzcraft_live add column if not exists site_history jsonb;
          alter table public.weltzcraft_live add column if not exists site_backup jsonb;
          alter table public.weltzcraft_previews add column if not exists backup jsonb;
          insert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types) values ('weltzcraft-sites', 'weltzcraft-sites', true, 1500000, array['image/jpeg']) on conflict (id) do nothing;
          create table if not exists public.weltzcraft_site_requests (
            id bigint generated always as identity primary key,
            site text not null,
            kind text not null,
            status text not null default 'new',
            day date,
            slot text,
            data jsonb not null,
            ip_hash text not null,
            created_at timestamptz not null default now()
          );
          create index if not exists weltzcraft_site_requests_site on public.weltzcraft_site_requests (site, created_at);
          create index if not exists weltzcraft_site_requests_ip on public.weltzcraft_site_requests (ip_hash);
          create unique index if not exists weltzcraft_site_requests_slot on public.weltzcraft_site_requests (site, day, slot)
            where kind = 'book' and status in ('new', 'confirmed');
          alter table public.weltzcraft_site_requests enable row level security;
          revoke all on public.weltzcraft_site_requests from anon, authenticated;
          notify pgrst, 'reload schema';
          SQL
          )
          curl --silent --show-error -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg q "$sql" '{query:$q}')" | head -c 300; echo

      - name: Upload the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CLOUDFLARE_ACCOUNT_ID=$ACCOUNT npx --yes wrangler@3 pages deploy weltzcraft-site \
            --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Connect weltzcraft.com and www
        run: |
          cf() { curl --silent --show-error -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          API=https://api.cloudflare.com/client/v4
          for host in "$DOMAIN" "www.$DOMAIN"; do
            # Pages custom domain (ignored if it is already attached)
            cf -X POST "$API/accounts/$ACCOUNT/pages/projects/$PROJECT/domains" -d "$(jq -n --arg n "$host" '{name:$n}')" \
              | jq -c --arg h "$host" '{domain:$h, success, errors: [.errors[]?.message]}'
            # DNS: proxied CNAME to the Pages project (apex CNAME is flattened; email MX/TXT records stay)
            existing=$(cf "$API/zones/$ZONE/dns_records?name=$host" | jq -c '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")]')
            body=$(jq -n --arg n "$host" --arg c "$PROJECT.pages.dev" '{type:"CNAME", name:$n, content:$c, proxied:true, ttl:1}')
            if [ "$(echo "$existing" | jq length)" = "0" ]; then
              cf -X POST "$API/zones/$ZONE/dns_records" -d "$body" | jq -c --arg h "$host" '{dns:$h, added:.success, errors}'
            elif [ "$(echo "$existing" | jq -r --arg c "$PROJECT.pages.dev" '.[0].type == "CNAME" and .[0].content == $c')" = "true" ]; then
              echo "dns ok: $host"
            else
              id=$(echo "$existing" | jq -r '.[0].id')
              echo "replacing $(echo "$existing" | jq -c '.[0] | {type, content}') for $host"
              cf -X PUT "$API/zones/$ZONE/dns_records/$id" -d "$body" | jq -c --arg h "$host" '{dns:$h, updated:.success, errors}'
            fi
          done
          sleep 20
          cf "$API/accounts/$ACCOUNT/pages/projects/$PROJECT/domains" | jq -c '[.result[]? | {name, status}]'

      - name: Check the live site
        run: |
          for u in "https://$PROJECT.pages.dev/" "https://$DOMAIN/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u" || true); echo "$u -> $code"
          done
          echo "A new custom domain can take a few minutes to get its certificate; re-run this step later if weltzcraft.com isn't 200 yet."

      - name: Check the brief form
        env:
          TEST_BRIEF: ${{ github.event.inputs.test_brief }}
        run: |
          u="https://$PROJECT.pages.dev/api/brief"
          # A filled "website" box marks a bot: the form must answer OK without sending anything.
          code=$(curl -s -o out.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"Check","email":"check@example.com","idea":"check","website":"x","elapsed":9}' "$u" || true)
          echo "bot check -> $code $(cat out.json)"
          [ "$code" = "200" ] || { echo "::error::The brief form endpoint is not answering"; exit 1; }
          # Merch: a made-up slug must be refused (400), which proves the checkout endpoint and its Stripe key are live.
          code=$(curl -s -o out.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"slug":"nope","size":"M"}' "https://$PROJECT.pages.dev/api/merch/checkout" || true)
          echo "merch checkout check -> $code $(cat out.json)"
          # Free previews: a made-up preview must be 404 (503 means the previews table or its key isn't set up).
          code=$(curl -s -o out.json -w '%{http_code}' "https://$PROJECT.pages.dev/api/preview/no-such-preview-0000" || true)
          echo "preview check -> $code $(cat out.json)"
          [ "$code" = "404" ] || echo "::warning::Free previews are not saving yet (got $code)"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://$PROJECT.pages.dev/preview/no-such-preview-0000" || true)
          echo "preview page -> $code"
          # Booking and forms: a made-up site must be 404 (anything else means /api/site isn't answering).
          code=$(curl -s -o out.json -w '%{http_code}' "https://$PROJECT.pages.dev/api/site/slots?site=no-such-preview-0000&day=2030-01-01" || true)
          echo "site features check -> $code $(cat out.json)"
          code=$(curl -s -o out.json -w '%{http_code}' "https://$PROJECT.pages.dev/api/live/domains?q=weltzcraft%20check" || true)
          echo "live domain search -> $code $(head -c 400 out.json)"
          if [ "$TEST_BRIEF" = "true" ]; then
            code=$(curl -s -o out.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"Deploy test","email":"sales@weltzcraft.com","org":"Test: brief form check","idea":"This is a test of the weltzcraft.com project brief form. No reply needed.","elapsed":9}' "$u" || true)
            echo "test brief -> $code $(cat out.json)"
            [ "$code" = "200" ] || { echo "::error::The brief form could not send email"; exit 1; }
          fi
