name: Deploy weltzcraft.com

# Publishes weltzcraft-site/ (the Weltzcraft Studios website) to Cloudflare Pages project "weltzcraft"
# and points weltzcraft.com + www.weltzcraft.com at it. Safe to re-run.
# Needs the CLOUDFLARE_API_TOKEN secret with: Zone weltzcraft.com DNS Edit + Zone Read (already there)
# and Account > Cloudflare Pages > Edit (needed to create and deploy the Pages project).
on:
  push:
    branches: [main]
    paths: ['weltzcraft-site/**', '.github/workflows/deploy-weltzcraft-site.yml']
  workflow_dispatch:
    inputs:
      test_brief:
        description: 'Send one test brief through the live form (arrives at sales@weltzcraft.com)'
        type: boolean
        default: false

concurrency: { group: weltzcraft-site, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DOMAIN: weltzcraft.com
      PROJECT: weltzcraft
    steps:
      - uses: actions/checkout@v4

      - name: Find account and make sure the Pages project exists
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::Add the CLOUDFLARE_API_TOKEN secret first"; exit 1; }
          cf() { curl --silent --show-error -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          API=https://api.cloudflare.com/client/v4
          zone=$(cf "$API/zones?name=$DOMAIN")
          ZONE=$(echo "$zone" | jq -r '.result[0].id // empty'); ACCOUNT=$(echo "$zone" | jq -r '.result[0].account.id // empty')
          [ -n "$ZONE" ] || { echo "$zone" | jq -c '.errors'; echo "::error::Token can't see $DOMAIN"; exit 1; }
          echo "ZONE=$ZONE" >> "$GITHUB_ENV"; echo "ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
          p=$(cf "$API/accounts/$ACCOUNT/pages/projects/$PROJECT")
          if [ "$(echo "$p" | jq -r .success)" = "true" ]; then echo "Pages project exists."; exit 0; fi
          if echo "$p" | jq -e '.errors[]? | select(.code == 8000007)' >/dev/null; then
            r=$(cf -X POST "$API/accounts/$ACCOUNT/pages/projects" -d "$(jq -n --arg n "$PROJECT" '{name:$n, production_branch:"main"}')")
            echo "$r" | jq -c '{success, errors}'
            [ "$(echo "$r" | jq -r .success)" = "true" ] && exit 0
          else
            echo "$p" | jq -c '.errors'
          fi
          echo "::error::The CLOUDFLARE_API_TOKEN can't use Cloudflare Pages. In Cloudflare > My Profile > API Tokens, edit the token and add the permission Account > Cloudflare Pages > Edit, then re-run this workflow."
          exit 1

      - name: Give the brief form its email key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A Resend sending key just for this site (limit it to weltzcraft.com).
          RESEND_KEY: ${{ secrets.WELTZCRAFT_RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_KEY" ]; then echo "::warning::No WELTZCRAFT_RESEND_API_KEY secret yet; the brief form will fall back to opening an email."; exit 0; fi
          printf '%s' "$RESEND_KEY" | CLOUDFLARE_ACCOUNT_ID=$ACCOUNT npx --yes wrangler@3 pages secret put RESEND_API_KEY --project-name "$PROJECT"

      - name: Merch shop keys (Stripe checkout + Printful orders)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Same Stripe account as Talk Shops unless a separate WELTZCRAFT_STRIPE_SECRET_KEY is added.
          STRIPE_KEY: ${{ secrets.WELTZCRAFT_STRIPE_SECRET_KEY || secrets.TALKSHOPS_STRIPE_SECRET_KEY }}
          PRINTFUL_KEY: ${{ secrets.PRINTFUL_API_TOKEN }}
          PRINTFUL_STORE: ${{ secrets.PRINTFUL_STORE_ID }}
        run: |
          put() { CLOUDFLARE_ACCOUNT_ID=$ACCOUNT npx --yes wrangler@3 pages secret put "$1" --project-name "$PROJECT" >/dev/null && echo "set $1"; }
          [ -n "$PRINTFUL_KEY" ] && printf '%s' "$PRINTFUL_KEY" | put PRINTFUL_API_TOKEN
          [ -n "$PRINTFUL_STORE" ] && printf '%s' "$PRINTFUL_STORE" | put PRINTFUL_STORE_ID
          if [ -z "$STRIPE_KEY" ]; then echo "::warning::No Stripe key secret; merch checkout stays closed."; exit 0; fi
          printf '%s' "$STRIPE_KEY" | put STRIPE_SECRET_KEY
          # Stripe tells us paid orders at this address. The signing secret is only shown when the endpoint is
          # made, so if the site doesn't have it yet the endpoint is made again.
          HOOK="https://$DOMAIN/api/merch/stripe-webhook"
          st() { curl --silent --show-error -u "$STRIPE_KEY:" "$@"; }
          have=$(curl --silent -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/$PROJECT" \
            | jq -r '.result.deployment_configs.production.env_vars // {} | has("STRIPE_MERCH_WEBHOOK_SECRET")')
          ids=$(st "https://api.stripe.com/v1/webhook_endpoints?limit=100" | jq -r --arg u "$HOOK" '[.data[]? | select(.url == $u) | .id] | join(" ")')
          if [ -n "$ids" ] && [ "$have" = "true" ]; then echo "merch webhook ok"; exit 0; fi
          for id in $ids; do st -X DELETE "https://api.stripe.com/v1/webhook_endpoints/$id" | jq -c '{deleted}'; done
          r=$(st https://api.stripe.com/v1/webhook_endpoints -d url="$HOOK" -d "enabled_events[]=checkout.session.completed" -d description="weltzcraft.com merch orders to Printful")
          sec=$(echo "$r" | jq -r '.secret // empty')
          if [ -z "$sec" ]; then echo "::error::Could not create the Stripe webhook: $(echo "$r" | jq -r '.error.message // "unknown"')"; exit 1; fi
          echo "::add-mask::$sec"
          printf '%s' "$sec" | put STRIPE_MERCH_WEBHOOK_SECRET
          echo "merch webhook created"

      - name: Upload the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CLOUDFLARE_ACCOUNT_ID=$ACCOUNT npx --yes wrangler@3 pages deploy weltzcraft-site \
            --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Connect weltzcraft.com and www
        run: |
          cf() { curl --silent --show-error -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          API=https://api.cloudflare.com/client/v4
          for host in "$DOMAIN" "www.$DOMAIN"; do
            # Pages custom domain (ignored if it is already attached)
            cf -X POST "$API/accounts/$ACCOUNT/pages/projects/$PROJECT/domains" -d "$(jq -n --arg n "$host" '{name:$n}')" \
              | jq -c --arg h "$host" '{domain:$h, success, errors: [.errors[]?.message]}'
            # DNS: proxied CNAME to the Pages project (apex CNAME is flattened; email MX/TXT records stay)
            existing=$(cf "$API/zones/$ZONE/dns_records?name=$host" | jq -c '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")]')
            body=$(jq -n --arg n "$host" --arg c "$PROJECT.pages.dev" '{type:"CNAME", name:$n, content:$c, proxied:true, ttl:1}')
            if [ "$(echo "$existing" | jq length)" = "0" ]; then
              cf -X POST "$API/zones/$ZONE/dns_records" -d "$body" | jq -c --arg h "$host" '{dns:$h, added:.success, errors}'
            elif [ "$(echo "$existing" | jq -r --arg c "$PROJECT.pages.dev" '.[0].type == "CNAME" and .[0].content == $c')" = "true" ]; then
              echo "dns ok: $host"
            else
              id=$(echo "$existing" | jq -r '.[0].id')
              echo "replacing $(echo "$existing" | jq -c '.[0] | {type, content}') for $host"
              cf -X PUT "$API/zones/$ZONE/dns_records/$id" -d "$body" | jq -c --arg h "$host" '{dns:$h, updated:.success, errors}'
            fi
          done
          sleep 20
          cf "$API/accounts/$ACCOUNT/pages/projects/$PROJECT/domains" | jq -c '[.result[]? | {name, status}]'

      - name: Check the live site
        run: |
          for u in "https://$PROJECT.pages.dev/" "https://$DOMAIN/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u" || true); echo "$u -> $code"
          done
          echo "A new custom domain can take a few minutes to get its certificate; re-run this step later if weltzcraft.com isn't 200 yet."

      - name: Check the brief form
        env:
          TEST_BRIEF: ${{ github.event.inputs.test_brief }}
        run: |
          u="https://$PROJECT.pages.dev/api/brief"
          # A filled "website" box marks a bot: the form must answer OK without sending anything.
          code=$(curl -s -o out.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"Check","email":"check@example.com","idea":"check","website":"x","elapsed":9}' "$u" || true)
          echo "bot check -> $code $(cat out.json)"
          [ "$code" = "200" ] || { echo "::error::The brief form endpoint is not answering"; exit 1; }
          # Merch: a made-up slug must be refused (400), which proves the checkout endpoint and its Stripe key are live.
          code=$(curl -s -o out.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"slug":"nope","size":"M"}' "https://$PROJECT.pages.dev/api/merch/checkout" || true)
          echo "merch checkout check -> $code $(cat out.json)"
          if [ "$TEST_BRIEF" = "true" ]; then
            code=$(curl -s -o out.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"Deploy test","email":"sales@weltzcraft.com","org":"Test: brief form check","idea":"This is a test of the weltzcraft.com project brief form. No reply needed.","elapsed":9}' "$u" || true)
            echo "test brief -> $code $(cat out.json)"
            [ "$code" = "200" ] || { echo "::error::The brief form could not send email"; exit 1; }
          fi
