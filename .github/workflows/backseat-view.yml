name: Backseat View iPhone

on:
  push:
    branches:
      - feature/backseat-view-carplay-widget
      - claude/project-thread-6lgsrr
      - claude/project-thread-ujg0zh
      - claude/project-thread-1v1zpc
    paths:
      - "backseat-view/**"
      - ".github/workflows/backseat-view.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload Backseat View to TestFlight"
        type: boolean
        default: false
      screenshots:
        description: "Take simulator screenshots of the setup guide"
        type: boolean
        default: false

concurrency:
  group: backseat-view-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || contains(github.event.head_commit.message, '[backseat-upload]') }}
    defaults:
      run:
        working-directory: backseat-view
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Register separate Apple bundle IDs
        if: contains(github.event.head_commit.message, '[backseat-register]')
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_KEY" ]; then
            echo "::error::Missing existing App Store Connect GitHub Actions secrets"
            exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/backseat-apple-api"
          "$RUNNER_TEMP/backseat-apple-api/bin/pip" -q install 'PyJWT[crypto]'
          "$RUNNER_TEMP/backseat-apple-api/bin/python" tools/register_apple_ids.py
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Internet backup for the home monitor: Supabase Realtime on the shared hobby project. The site key
      # is public (the website ships it too); without it the app just has no away-from-home backup.
      - name: Internet backup settings
        env:
          RELAY_HOST: ${{ secrets.REACT_APP_SUPABASE_URL || 'https://nkwedlskhnojseeroezm.supabase.co' }}
          RELAY_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'nkwedlskhnojseeroezm' }}
        run: |
          if [ -z "$RELAY_KEY" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            RELAY_KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys" \
              | python3 -c 'import json,sys; print(next((k["api_key"] for k in json.load(sys.stdin) if k.get("name") == "anon"), ""))') || RELAY_KEY=""
          fi
          if [ -z "$RELAY_KEY" ]; then
            echo "::warning::No Supabase site key, so this build has no away-from-home backup"; exit 0
          fi
          RELAY_URL="$(echo "$RELAY_HOST" | sed -e 's#^https://#wss://#' -e 's#/*$##')/realtime/v1/websocket"
          /usr/libexec/PlistBuddy -c "Add :StorkRelayURL string $RELAY_URL" App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :StorkRelayKey string $RELAY_KEY" App/Info.plist
          RELAY_URL="$RELAY_URL" RELAY_KEY="$RELAY_KEY" node tools/relay_test.mjs || echo "::warning::Relay test failed (see above)"
      - name: Make app icon and Xcode project
        run: |
          [ -f App/Assets.xcassets/AppIcon.appiconset/AppIcon.png ] || swift tools/make_icon.swift
          xcodegen generate
      - name: Build for iPhone simulator
        if: env.UPLOAD != 'true'
        run: |
          set -o pipefail
          xcodebuild -project BackseatView.xcodeproj -scheme BackseatView -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/backseat-dd" CODE_SIGNING_ALLOWED=NO \
            build | tail -n 65
      - name: Setup guide screenshots
        if: env.UPLOAD != 'true' && github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          set -x
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone 16") or x["name"].startswith("iPhone 17")))')
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV"
          APP=$(find "$RUNNER_TEMP/backseat-dd" -name 'BackseatView.app' -path '*iphonesimulator*' | head -1)
          xcrun simctl install "$DEV" "$APP"
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun simctl launch --terminate-running-process "$DEV" com.tweltz1.backseatview
          sleep 6; xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/shots/start.png"
          for t in list babyPhone parentPhone nightView tesla carPlay solo general trouble; do
            xcrun simctl launch --terminate-running-process "$DEV" com.tweltz1.backseatview -guideTopic "$t"
            sleep 5; xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/shots/guide-$t.png"
          done
          for m in tesla camera solo babyphone; do
            xcrun simctl launch --terminate-running-process "$DEV" com.tweltz1.backseatview -mode "$m"
            sleep 5; xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/shots/mode-$m.png"
          done
          # Small copies in the log too (artifact downloads aren't reachable from every machine).
          set +x
          for f in "$RUNNER_TEMP"/shots/*.png; do
            sips -Z 900 -s format jpeg -s formatOptions 60 "$f" --out "$f.jpg" >/dev/null
            echo "SHOT-BEGIN $(basename "$f")"; base64 -b 3000 -i "$f.jpg"; echo "SHOT-END"
          done
      - uses: actions/upload-artifact@v4
        if: env.UPLOAD != 'true' && github.event_name == 'workflow_dispatch' && inputs.screenshots
        with:
          name: stork-screenshots
          path: ${{ runner.temp }}/shots
      - name: Check upload credentials
        if: env.UPLOAD == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          for key in APPLE_TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing $key GitHub secret"
              exit 1
            fi
          done
      - name: Archive and upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project BackseatView.xcodeproj -scheme BackseatView \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BackseatView.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 65
          cat > "$RUNNER_TEMP/BackseatExport.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/BackseatView.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/BackseatExport.plist" \
            -exportPath "$RUNNER_TEMP/backseat-export" "${AUTH[@]}"
          rm -f "$KEY_PATH"
