name: Hood Protocol iPhone

on:
  push:
    branches:
      - main
      - claude/rogue-protocol-game
      - claude/project-thread-6lgsrr
    paths:
      - "hood-protocol/**"
      - ".github/workflows/hood-protocol.yml"
  pull_request:
    paths:
      - "hood-protocol/**"
      - ".github/workflows/hood-protocol.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload Hood Protocol to TestFlight"
        type: boolean
        default: false
      shots:
        description: "Make App Store screenshots (saved on branch hood-protocol-store-shots)"
        type: boolean
        default: false

concurrency:
  group: hood-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  add-redirect:
    # One-time: lets Google sign-in come back to the app instead of the Hood League site.
    # Adds only the app's own redirect and keeps every URL already on the list.
    if: contains(github.event.head_commit.message, '[hood-redirect]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Add the app redirect to Supabase sign-in
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'nkwedlskhnojseeroezm' }}
          REDIRECT: com.tweltz1.hoodprotocol://auth
        run: |
          API="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth"
          CURRENT=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("uri_allow_list") or "")')
          echo "Current redirect URLs: $CURRENT"
          if printf '%s' "$CURRENT" | tr ',' '\n' | grep -qxF "$REDIRECT"; then
            echo "Already on the list"; exit 0
          fi
          NEW=$(python3 -c 'import sys; c,r=sys.argv[1],sys.argv[2]; print(",".join([u for u in c.split(",") if u.strip()]+[r]))' "$CURRENT" "$REDIRECT")
          BODY=$(python3 -c 'import json,sys; print(json.dumps({"uri_allow_list": sys.argv[1]}))' "$NEW")
          curl -fsS -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$BODY" "$API" > /dev/null
          AFTER=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("uri_allow_list") or "")')
          echo "Redirect URLs now: $AFTER"

  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || contains(github.event.head_commit.message, '[hood-upload]') }}
    defaults:
      run:
        working-directory: hood-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Register Apple bundle ID
        if: contains(github.event.head_commit.message, '[hood-register]')
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_ID" ] || [ -z "$APP_STORE_CONNECT_KEY" ]; then
            echo "::error::Missing existing App Store Connect GitHub Actions secrets"
            exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/hood-apple-api"
          "$RUNNER_TEMP/hood-apple-api/bin/pip" -q install 'PyJWT[crypto]'
          "$RUNNER_TEMP/hood-apple-api/bin/python" tools/register_apple_ids.py
      - name: Test rules engine and bots
        working-directory: hood-protocol/Engine
        run: swift test
      - name: Get the online play key
        env:
          ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'nkwedlskhnojseeroezm' }}
        run: |
          KEY="$ANON_KEY"
          if [ -z "$KEY" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            # Same public key the Hood League site ships with, asked from Supabase with the deploy token.
            KEY=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys" \
              | python3 -c 'import json,sys; print(next((k["api_key"] for k in json.load(sys.stdin) if k.get("name") == "anon"), ""))') || KEY=""
          fi
          if [ -z "$KEY" ]; then
            echo "::warning::No Supabase key found, so online play is turned off in this build"
          else
            echo "::add-mask::$KEY"
            echo "SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
          fi
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Make Xcode project
        run: |
          xcodegen generate
      - name: Build for iPhone simulator
        if: env.UPLOAD != 'true'
        run: |
          set -o pipefail
          xcodebuild -project HoodProtocol.xcodeproj -scheme HoodProtocol -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/hood-dd" CODE_SIGNING_ALLOWED=NO \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            build | tail -n 65
      - name: App Store screenshots
        if: env.UPLOAD != 'true' && github.event_name == 'workflow_dispatch' && inputs.shots
        run: |
          APP=$(find "$RUNNER_TEMP/hood-dd/Build/Products" -name 'HoodProtocol.app' -maxdepth 3 | head -1)
          # The biggest iPhone on the newest iOS; App Store 6.7-inch shots are 1290x2796.
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in d if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[1].split("-")])
          devs = [x for x in d[ios[-1]] if "Pro Max" in x["name"]] or [x for x in d[ios[-1]] if "Plus" in x["name"]]
          print(devs[0]["udid"])')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl ui "$DEV" appearance dark || true
          xcrun simctl install "$DEV" "$APP"
          mkdir -p "$RUNNER_TEMP/shots"
          shoot() {
            xcrun simctl terminate "$DEV" com.tweltz1.hoodprotocol 2>/dev/null || true
            if [ "$2" = home ]; then xcrun simctl launch "$DEV" com.tweltz1.hoodprotocol; else xcrun simctl launch "$DEV" com.tweltz1.hoodprotocol -shot "$2"; fi
            sleep "$3"
            xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/shots/raw.png"
            sips -z 2796 1290 "$RUNNER_TEMP/shots/raw.png" --out "$RUNNER_TEMP/shots/sized.png" >/dev/null
            sips -s format jpeg -s formatOptions 92 "$RUNNER_TEMP/shots/sized.png" --out "$RUNNER_TEMP/shots/$1.jpg" >/dev/null
          }
          shoot 1-home home 8
          shoot 2-role role 8
          shoot 3-game game 12
          shoot 4-game-later game 45
          shoot 5-looks looks 6
          shoot 6-rules rules 6
          rm -f "$RUNNER_TEMP/shots/raw.png" "$RUNNER_TEMP/shots/sized.png"
          cd "$RUNNER_TEMP/shots"
          git init -q -b hood-protocol-store-shots
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Hood Protocol store screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" hood-protocol-store-shots
      - name: Check upload credentials
        if: env.UPLOAD == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          for key in APPLE_TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing $key GitHub secret"
              exit 1
            fi
          done
      - name: Archive and upload to TestFlight
        if: env.UPLOAD == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project HoodProtocol.xcodeproj -scheme HoodProtocol \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HoodProtocol.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            archive | tail -n 65
          # Sign in with Apple needs the capability on the App ID and the entitlement in the app. The archive
          # above is unsigned, so sign the entitlement in here (a throwaway signature; the export re-signs it
          # for the App Store and keeps the entitlement).
          APP_PATH="$RUNNER_TEMP/HoodProtocol.xcarchive/Products/Applications/HoodProtocol.app"
          BUNDLE=com.tweltz1.hoodprotocol node "$GITHUB_WORKSPACE/scripts/ios/enable-apple-signin.js" || { rm -f "$KEY_PATH"; exit 1; }
          find "$APP_PATH/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \; 2>/dev/null || true
          codesign --force --sign - --entitlements "$GITHUB_WORKSPACE/hood-protocol/App/HoodProtocol.entitlements" "$APP_PATH"
          cat > "$RUNNER_TEMP/HoodExport.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/HoodProtocol.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/HoodExport.plist" \
            -exportPath "$RUNNER_TEMP/hood-export" "${AUTH[@]}"
          rm -f "$KEY_PATH"
