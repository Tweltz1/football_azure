# Builds the Hood League iPhone app (ios-app/, a Capacitor wrapper around
# frontend/) on a GitHub macOS machine, so no Mac is needed.
#
# - Every push that touches ios-app/ checks that it still builds for the
#   iPhone simulator (no Apple account needed). Website-only pushes skip it:
#   the repo is private and GitHub counts macOS minutes 10x.
# - Run it by hand ("Run workflow") with "Upload to TestFlight" ticked to sign
#   it and send it to App Store Connect. That needs these repo secrets:
#     APPLE_TEAM_ID                  10-character Team ID (Apple Developer > Membership)
#     APP_STORE_CONNECT_KEY_ID       App Store Connect API key ID (Admin role)
#     APP_STORE_CONNECT_ISSUER_ID    Issuer ID shown above the keys list
#     APP_STORE_CONNECT_KEY          full text of the downloaded .p8 key file
#   and, for the website inside the app, the same values Cloudflare uses:
#     REACT_APP_SUPABASE_URL, REACT_APP_SUPABASE_ANON_KEY
name: iPhone app

on:
  push:
    paths:
      - 'ios-app/**'
      - 'frontend/src/offline/**'
      - 'frontend/src/native/**'
      - '.github/workflows/ios-app.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight'
        type: boolean
        default: false

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 45
    env:
      REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL || 'https://nkwedlskhnojseeroezm.supabase.co' }}
      REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the website
        working-directory: frontend
        run: |
          if [ -z "$REACT_APP_SUPABASE_ANON_KEY" ]; then
            # Same public key the live site ships with; read it from hood-league.com.
            JS=$(curl -fsSL https://hood-league.com/ | grep -oE '/static/js/main\.[a-z0-9]+\.js' | head -1)
            KEY=$(curl -fsSL "https://hood-league.com$JS" | grep -oE 'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+|sb_publishable_[A-Za-z0-9_-]+' | head -1)
            if [ -z "$KEY" ]; then echo "::error::Couldn't read the site key from hood-league.com"; exit 1; fi
            export REACT_APP_SUPABASE_ANON_KEY="$KEY"
          fi
          npm ci --no-audit --no-fund
          CI=false npm run build

      - name: Copy the website into the iPhone project
        working-directory: ios-app
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios

      - name: Build for the iPhone simulator
        if: ${{ !inputs.upload }}
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}

      - name: Screenshots on a simulated iPhone
        if: ${{ !inputs.upload }}
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          mkdir -p shots
          xcrun simctl list runtimes > shots/runtimes.txt
          # Newest iPhone Pro on the newest iOS, and the smallest iPhone on the oldest iOS this Mac has.
          PICK='import json,sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in d if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[1].split("-")])
          mode = sys.argv[1]
          if mode == "new":
              r = ios[-1]; devs = [x for x in d[r] if "Pro" in x["name"] and "Max" not in x["name"]]
          else:
              r = ios[0]; devs = sorted(d[r], key=lambda x: (("SE" not in x["name"]), ("mini" not in x["name"]), x["name"]))
          x = devs[0]; print(x["udid"], r.split("iOS-")[1].replace("-", "."), x["name"].replace(" ", "_"))'
          run_on() {
            read -r DEV OS NAME < <(xcrun simctl list devices available -j | python3 -c "$PICK" "$1")
            TAG="$1-iOS$OS-$NAME"
            echo "Running on $TAG"
            xcrun simctl boot "$DEV"
            xcrun simctl bootstatus "$DEV" -b
            xcrun simctl status_bar "$DEV" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
            xcrun simctl install "$DEV" "$APP"
            START=$(date "+%Y-%m-%d %H:%M:%S")
            xcrun simctl launch "$DEV" com.hoodleague.draft
            sleep 20
            xcrun simctl io "$DEV" screenshot "shots/$TAG-app-open.png"
            # The app's console (web page errors show up here) for bug hunting.
            xcrun simctl spawn "$DEV" log show --start "$START" --style compact --predicate 'process == "App"' > "shots/$TAG-app-log.txt" 2>&1 || true
            xcrun simctl terminate "$DEV" com.hoodleague.draft
            sleep 3
            xcrun simctl io "$DEV" screenshot "shots/$TAG-home-screen.png"
            xcrun simctl shutdown "$DEV"
          }
          run_on new
          run_on old
          # Also save them on the ios-screenshots branch, for viewers that can't download artifacts.
          cd shots
          git init -q -b ios-screenshots
          git -c user.name=github-actions -c user.email=actions@github.com commit -q --allow-empty -m "Screenshots from ${GITHUB_SHA::7}"
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ios-screenshots

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload }}
        with:
          name: iphone-screenshots
          path: shots/

      - name: Sign and upload to TestFlight
        if: ${{ inputs.upload }}
        working-directory: ios-app/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          for v in APPLE_TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER_ID")

          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive | tail -n 40
          test ${PIPESTATUS[0]} -eq 0

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY_PATH"
