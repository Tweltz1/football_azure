name: Backseat View camera firmware

on:
  push:
    paths:
      - "backseat-view/camera-firmware/**"
      - ".github/workflows/backseat-camera-firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli + ESP32 core
        run: |
          mkdir -p $HOME/bin
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/bin sh
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH=$HOME/bin:$PATH
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.2.0
          arduino-cli lib search improv --names || true
          arduino-cli lib install "Improv WiFi Library" || { arduino-cli config set library.enable_unsafe_install true; arduino-cli lib install --git-url https://github.com/jnthas/Improv-WiFi-Library.git; }
          find ~/Arduino/libraries -maxdepth 3 -iname "*improv*h" | head
          arduino-cli board details -b esp32:esp32:XIAO_ESP32S3 | grep -E "PSRAM|CDCOnBoot|USBMode|PartitionScheme" | head -40 || true
      - name: Build
        run: |
          arduino-cli compile --fqbn "esp32:esp32:XIAO_ESP32S3:PSRAM=opi" \
            --export-binaries --output-dir out backseat-view/camera-firmware/BackseatCam
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: backseat-camera-firmware
          path: out/*.bin
      - name: Put the install file on the weltzcraft.com branch
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[camera-publish]')
        env:
          SITE_BRANCH: claude/project-thread-ujg0zh-site
        run: |
          python3 - <<'PY'
          d = open('out/BackseatCam.ino.merged.bin', 'rb').read()
          end = (len(d.rstrip(b'\xff')) + 4095) // 4096 * 4096   # drop the empty padding at the end
          open('/tmp/backseat-camera.bin', 'wb').write(d[:end])
          print('install file', end, 'bytes')
          PY
          git fetch origin "$SITE_BRANCH"
          git checkout -B site "origin/$SITE_BRANCH"
          cp /tmp/backseat-camera.bin weltzcraft-site/backseatview/camera/backseat-camera.bin
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add weltzcraft-site/backseatview/camera/backseat-camera.bin
          git diff --cached --quiet || git commit -m "Backseat View camera firmware build ${GITHUB_SHA::7}"
          git push origin "HEAD:$SITE_BRANCH"
