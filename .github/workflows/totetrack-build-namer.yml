# Builds ToteTrack's item namer for Snap to add, for free, on a GitHub Linux machine:
# TinyCLIP (MIT license) as a Core ML image encoder plus text embeddings for every name in
# totetrack-app/tools/namer/items.txt, trained on real photos of 150+ item types from LVIS v1 (CC BY 4.0,
# COCO images) and Open Images V7 (CC BY 4.0, images CC BY 2.0) picked by tools/detector/classes.txt.
# Runs when the namer or the dataset scripts change, and publishes a GitHub release named
# totetrack-namer-<run number> with the model, the vocabulary and the accuracy log.
name: ToteTrack build namer

on:
  push:
    paths:
      - 'totetrack-app/tools/namer/**'
      - 'totetrack-app/tools/detector/**'
      - '.github/workflows/totetrack-build-namer.yml'

concurrency:
  group: totetrack-namer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    defaults:
      run:
        working-directory: totetrack-app/tools/namer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.40' coremltools pillow numpy ijson

      - uses: actions/cache@v4
        with:
          path: ~/data-src
          key: lvis-v1-openimages-v7

      - name: Download LVIS and Open Images annotations
        run: |
          mkdir -p ~/data-src && cd ~/data-src
          [ -f lvis_v1_train.json.zip ] || curl -fL --retry 4 -o lvis_v1_train.json.zip https://dl.fbaipublicfiles.com/LVIS/lvis_v1_train.json.zip
          [ -f oidv6-train-annotations-bbox.csv ] || curl -fL --retry 4 -o oidv6-train-annotations-bbox.csv https://storage.googleapis.com/openimages/v6/oidv6-train-annotations-bbox.csv
          [ -f oidv7-class-descriptions-boxable.csv ] || curl -fL --retry 4 -o oidv7-class-descriptions-boxable.csv https://storage.googleapis.com/openimages/v7/oidv7-class-descriptions-boxable.csv
          ls -lh

      - name: Build the photo set
        working-directory: totetrack-app/tools/detector
        run: |
          set -o pipefail
          python prepare_lvis.py ~/data-src/lvis_v1_train.json.zip "$RUNNER_TEMP/data" --per-class 150 --min-images 1 2>&1 | tee prepare.log
          python prepare_openimages.py ~/data-src/oidv6-train-annotations-bbox.csv ~/data-src/oidv7-class-descriptions-boxable.csv "$RUNNER_TEMP/data" --per-class 150 2>&1 | tee -a prepare.log
          du -sh "$RUNNER_TEMP/data"

      - name: Train and build
        run: |
          set -o pipefail
          python build_namer.py "$RUNNER_TEMP/namer" --train "$RUNNER_TEMP/data" 2>&1 | tee build.log
          cd "$RUNNER_TEMP/namer" && zip -qr ToteNamer.mlpackage.zip ToteNamer.mlpackage && ls -lh

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ../detector/prepare.log .
          gh release create "totetrack-namer-${{ github.run_number }}" \
            "$RUNNER_TEMP/namer/ToteNamer.mlpackage.zip" "$RUNNER_TEMP/namer/items.json" "$RUNNER_TEMP/namer/items.bin" build.log prepare.log \
            --target "$GITHUB_SHA" --prerelease \
            --title "ToteTrack namer ${{ github.run_number }}" \
            --notes "Item namer for Snap to add: TinyCLIP image encoder (MIT license), trained on LVIS and Open Images photos, with embeddings for every item name. See build.log for accuracy."
