# Builds ToteTrack's item namer for Snap to add: TinyCLIP (MIT license) as a Core ML image encoder plus
# text embeddings for every name in totetrack-app/tools/namer/items.txt. Runs when anything in
# totetrack-app/tools/namer changes, and publishes a GitHub release named totetrack-namer-<run number>.
name: ToteTrack build namer

on:
  push:
    paths:
      - 'totetrack-app/tools/namer/**'
      - '.github/workflows/totetrack-build-namer.yml'

concurrency:
  group: totetrack-namer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: totetrack-app/tools/namer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.40' coremltools pillow numpy

      - name: Build
        run: |
          set -o pipefail
          python build_namer.py "$RUNNER_TEMP/namer" 2>&1 | tee build.log
          cd "$RUNNER_TEMP/namer" && zip -qr ToteNamer.mlpackage.zip ToteNamer.mlpackage && ls -lh

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "totetrack-namer-${{ github.run_number }}" \
            "$RUNNER_TEMP/namer/ToteNamer.mlpackage.zip" "$RUNNER_TEMP/namer/items.json" "$RUNNER_TEMP/namer/items.bin" build.log \
            --target "$GITHUB_SHA" --prerelease \
            --title "ToteTrack namer ${{ github.run_number }}" \
            --notes "Item namer for Snap to add: TinyCLIP image encoder (MIT license) and embeddings for the names in items.txt."
