name: Supabase API

on:
  push:
    branches:
      - main
      # The migration branch deploys too, so the new Supabase project can be tested before merging.
      - claude/project-thread-6lgsrr
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run API tests
        run: node --test supabase/tests/handlers.test.ts supabase/tests/dnd.test.ts supabase/tests/cards.test.ts supabase/tests/junk.test.ts supabase/tests/appleJws.test.ts supabase/tests/footballAsk.test.ts supabase/tests/shop.test.ts supabase/tests/shopPlans.test.ts supabase/tests/shopHowTo.test.ts supabase/tests/nhtsa.test.ts supabase/tests/shopAccount.test.ts supabase/tests/shopStaff.test.ts supabase/tests/shopSms.test.ts supabase/tests/smsFit.test.ts supabase/tests/smsTopicModel.test.ts supabase/tests/learnTexts.test.ts

  deploy:
    name: Deploy database and API
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check Supabase secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase secrets are not set yet, so nothing was deployed. See docs/supabase-cloudflare-setup.md, Part 2."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 2.119.0
      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database changes
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy API function
        if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      # Hobby apps sign in with Google, Apple (Curbsy, ToteTrack) or email + password. GitHub sign-in is off.
      # Prints only counts and on/off settings: this repo is public, so its run logs are too.
      - name: Sign-in options
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID"
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json")
          echo "Accounts by sign-in type (before):"
          curl -fsS "${auth[@]}" -X POST "$api/database/query" -d '{"query":"select provider, count(distinct user_id) as users from auth.identities group by provider order by provider"}' \
            | jq -r '.[] | "  \(.provider): \(.users)"' || echo "  (couldn't count)"
          curl -fsS "${auth[@]}" -X POST "$api/database/query" -d '{"query":"select count(*) as n from auth.users u where exists (select 1 from auth.identities i where i.user_id = u.id and i.provider = '"'"'github'"'"') and not exists (select 1 from auth.identities i where i.user_id = u.id and i.provider <> '"'"'github'"'"')"}' \
            | jq -r '.[0] | "  GitHub-only accounts (can get back in with Forgot password on their GitHub email): \(.n)"' || echo "  (couldn't count)"
          current=$(curl -fsS "${auth[@]}" "$api/config/auth")
          allow=$(echo "$current" | jq -r '.uri_allow_list // ""')
          # Email links (confirm sign-up, reset password) come back to the website.
          for url in "https://hood-league.com/**" "https://www.hood-league.com/**"; do
            case ",$allow," in *",$url,"*) ;; *) allow="${allow:+$allow,}$url" ;; esac
          done
          body=$(jq -n --arg allow "$allow" '{external_github_enabled: false, external_email_enabled: true, uri_allow_list: $allow}')
          curl -fsS "${auth[@]}" -X PATCH "$api/config/auth" -d "$body" \
            | jq '{external_github_enabled, external_google_enabled, external_apple_enabled, external_email_enabled, mailer_autoconfirm, custom_smtp_on: (.smtp_host != null and .smtp_host != "")}'
