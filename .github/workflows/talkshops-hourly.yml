name: Talk Shops hourly

# Sends Talk Shops reminder texts that came due (including "your estimate is still waiting" reminders)
# and each shop's 7am morning summary email, for shops that turned them on in Settings.
# The API checks the service key, which the Supabase CLI reads with the deploy token.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: talkshops-hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Run reminders and morning emails
        run: |
          KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" -o json | jq -r '.[] | select(.name == "service_role") | .api_key' | head -n 1)
          if [ -z "$KEY" ]; then echo "::error::Could not read the service key."; exit 1; fi
          echo "::add-mask::$KEY"
          curl --fail-with-body --silent --show-error --retry 2 -X POST \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' \
            "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/api/shop/cron"
