name: Temporary weather check
on:
  push:
    branches: [claude/project-thread-mnh3z6]
    paths: ['.github/workflows/tmp-weather-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      P: ${{ secrets.SUPABASE_PROJECT_ID }}
      T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - run: |
          API="https://$P.supabase.co/functions/v1/api"
          for w in 10; do echo "--- /weather?week=$w"; curl -s -w '\nHTTP %{http_code}\n' "$API/weather?week=$w" | head -c 3000; echo; done
          echo "--- startsit"; curl -s -o /dev/null -w 'HTTP %{http_code}\n' "$API/startsit"
          echo "--- edge logs"
          SQL="select timestamp, event_message from function_logs where timestamp > timestamp_sub(current_timestamp(), interval 30 minute) and (event_message like '%Weather%' or event_message like '%weather%' or event_message like '%scoreboard%') order by timestamp desc limit 20"
          curl -s -G -H "Authorization: Bearer $T" --data-urlencode "sql=$SQL" "https://api.supabase.com/v1/projects/$P/analytics/endpoints/logs" | head -c 6000
