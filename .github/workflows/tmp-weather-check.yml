name: Temporary weather check
on:
  push:
    branches: [claude/project-thread-mnh3z6]
    paths: ['.github/workflows/tmp-weather-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=10" "https://api.open-meteo.com/v1/forecast?latitude=40&longitude=-75&hourly=wind_speed_10m&forecast_days=1"; do
            echo "== $u"; curl -s -D - -o /dev/null -H 'Origin: https://hood-league.com' "$u" | grep -i -E "^HTTP|access-control|cache-control"
          done
          echo "== sleeper schedule"; curl -s "https://api.sleeper.app/schedule/nfl/regular/2026" | head -c 400
