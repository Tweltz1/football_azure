# Trains ToteTrack's own item detector for Snap to add, for free, on a GitHub macOS machine.
# Data: LVIS v1 box annotations (CC BY 4.0) on COCO 2017 images, plus Open Images V7 boxes (CC BY 4.0,
# images CC BY 2.0), limited to the household and garage items in totetrack-app/tools/detector/classes.txt. Training: Apple Create ML (transfer learning).
# Runs when anything in totetrack-app/tools/detector changes. The model is published as a GitHub
# release named totetrack-detector-<run number>, with classes.json and the training log.
name: ToteTrack train detector

on:
  push:
    paths:
      - 'totetrack-app/tools/detector/**'
      - '.github/workflows/totetrack-train-detector.yml'

concurrency:
  group: totetrack-train-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: macos-26
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      PER_CLASS: 150
      MAX_ITERATIONS: 3000
    defaults:
      run:
        working-directory: totetrack-app/tools/detector
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show the Create ML API
        run: |
          xcodebuild -version
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          grep -rh -A3 -E "MLObjectDetector|AnnotationType|BoundingBox" "$SDK"/System/Library/Frameworks/CreateML.framework/Modules/ | grep -E "init\(|func |case |enum " | sort -u | head -80 || true
          # Fails in a minute instead of after the dataset download if train.swift doesn't compile.
          xcrun swiftc -typecheck train.swift

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/lvis
          key: lvis-v1-openimages-v7

      - name: Download LVIS annotations
        run: |
          mkdir -p ~/lvis
          [ -f ~/lvis/lvis_v1_train.json.zip ] || curl -fL --retry 4 -o ~/lvis/lvis_v1_train.json.zip https://dl.fbaipublicfiles.com/LVIS/lvis_v1_train.json.zip
          [ -f ~/lvis/oidv6-train-annotations-bbox.csv ] || curl -fL --retry 4 -o ~/lvis/oidv6-train-annotations-bbox.csv https://storage.googleapis.com/openimages/v6/oidv6-train-annotations-bbox.csv
          [ -f ~/lvis/oidv7-class-descriptions-boxable.csv ] || curl -fL --retry 4 -o ~/lvis/oidv7-class-descriptions-boxable.csv https://storage.googleapis.com/openimages/v7/oidv7-class-descriptions-boxable.csv
          ls -lh ~/lvis

      - name: Build the dataset
        run: |
          pip install ijson pillow
          set -o pipefail
          python prepare_lvis.py ~/lvis/lvis_v1_train.json.zip "$RUNNER_TEMP/data" --per-class "$PER_CLASS" --min-images 1 2>&1 | tee prepare.log
          python prepare_openimages.py ~/lvis/oidv6-train-annotations-bbox.csv ~/lvis/oidv7-class-descriptions-boxable.csv "$RUNNER_TEMP/data" --per-class "$PER_CLASS" 2>&1 | tee -a prepare.log
          du -sh "$RUNNER_TEMP/data"

      - name: Train
        run: |
          set -o pipefail
          xcrun swift train.swift "$RUNNER_TEMP/data" "$RUNNER_TEMP/ToteDetector.mlmodel" "$MAX_ITERATIONS" 2>&1 | tee train.log
          ls -lh "$RUNNER_TEMP/ToteDetector.mlmodel"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: totetrack-detector
          path: |
            ${{ runner.temp }}/ToteDetector.mlmodel
            ${{ runner.temp }}/data/classes.json
            totetrack-app/tools/detector/*.log
          if-no-files-found: warn

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/data/classes.json" .
          gh release create "totetrack-detector-${{ github.run_number }}" \
            "$RUNNER_TEMP/ToteDetector.mlmodel" classes.json prepare.log train.log \
            --target "$GITHUB_SHA" --prerelease \
            --title "ToteTrack detector ${{ github.run_number }}" \
            --notes "Item detector for Snap to add. Trained with Create ML on LVIS v1 (CC BY 4.0) and COCO 2017 images. See train.log for accuracy."
