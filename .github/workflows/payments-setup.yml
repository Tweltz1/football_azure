# Payment setup helpers (scripts/payments/). Runs the scripts named in scripts/payments/run.txt, one per
# line, when that folder changes on this branch:
#   stripe-check        read-only: is the Talk Shops Stripe key live, and can the account take money?
#   store-look          read-only: what App Store Connect has for Curbsy and ToteTrack paid products
#   totetrack-products  creates ToteTrack Pro (monthly and yearly) in App Store Connect
#   stripe-portal       sets up Stripe's customer portal when nothing is saved (test mode unless ALLOW_LIVE=1)
#   shops-billing-look  read-only: counts Talk Shops shops whose Stripe ids don't exist for the key in use
#   stripe-old-webhook  deletes the Stripe webhook still pointing at the old shared Supabase project
#   review-contact      fills in the App Review contact from the APP_REVIEW_* secrets
#   review-shots        uploads the App Review screenshot for each paid product (Curbsy and ToteTrack)
#   submit-look         read-only: what Curbsy and ToteTrack 1.0 still need before App Review
#   submit-review       sends Curbsy and ToteTrack 1.0 (with their in-app purchases) to App Review
#   store-shots         uploads Curbsy's App Store screenshots (scripts/payments/store-shots/curbsy/)
# Logs are public, so the scripts print yes/no answers and setting names only.
name: Payments setup

on:
  push:
    branches: ['claude/project-thread-l89ktp', 'claude/project-thread-jxl3cv', 'claude/project-thread-9hbkuw']
    paths:
      - 'scripts/payments/**'
      - '.github/workflows/payments-setup.yml'

concurrency:
  group: payments-setup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get ToteTrack's saved screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/tote-shots"
          if git fetch -q --depth 1 origin totetrack-store-shots && git worktree add -q "$RUNNER_TEMP/tote-raw" FETCH_HEAD && [ -f "$RUNNER_TEMP/tote-raw/7-pro.png" ]; then
            # App Store pictures can't have a transparency channel; the simulator's do.
            python3 -m venv "$RUNNER_TEMP/pil" && "$RUNNER_TEMP/pil/bin/pip" -q install pillow
            "$RUNNER_TEMP/pil/bin/python" -c 'import sys; from PIL import Image; Image.open(sys.argv[1]).convert("RGB").save(sys.argv[2], quality=92)' "$RUNNER_TEMP/tote-raw/7-pro.png" "$RUNNER_TEMP/tote-shots/7-pro.jpg"
          else
            echo "No ToteTrack Pro picture yet."
          fi
      - name: Get Hood Protocol's store screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/hood-protocol-shots"
          if git fetch -q --depth 1 origin hood-protocol-store-shots; then
            git --work-tree="$RUNNER_TEMP/hood-protocol-shots" checkout FETCH_HEAD -- . && git reset -q
          else
            echo "No Hood Protocol screenshots yet."
          fi
      - name: Run
        env:
          STRIPE_SECRET_KEY: ${{ secrets.TALKSHOPS_STRIPE_SECRET_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.TALKSHOPS_SUPABASE_PROJECT_ID }}
          APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
          APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
          APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          TOTE_SHOTS: ${{ runner.temp }}/tote-shots
          HOOD_PROTOCOL_SHOTS: ${{ runner.temp }}/hood-protocol-shots
        run: |
          while read -r line; do
            script=$(echo "$line" | tr -cd 'a-z0-9-')
            [ -z "$script" ] && continue
            echo "::group::$script"
            node "scripts/payments/$script.js" || echo "::warning::$script reported a failure"
            echo "::endgroup::"
          done < scripts/payments/run.txt
