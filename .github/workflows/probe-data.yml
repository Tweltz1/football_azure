# Temporary: prints the shape of the free game-day feeds the chat will use. Removed after checking.
name: Probe game-day data
on:
  push:
    branches: [claude/project-thread-xy7gsg]
    paths: ['.github/workflows/probe-data.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Next week odds
        run: |
          curl -sS --compressed "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=8&seasontype=2&dates=2026" > sb.json
          jq '{week: .week.number, n: (.events|length)}' sb.json
          jq '.events[0].competitions[0].odds' sb.json | head -60
          jq '[.events[] | {name, date, w: .weather, o: .competitions[0].odds[0].details, ou: .competitions[0].odds[0].overUnder, indoor: .competitions[0].venue.indoor}]' sb.json | head -60
      - name: Fantasy player news
        run: |
          curl -sS --compressed "https://site.api.espn.com/apis/fantasy/v2/games/ffl/news/players?limit=5" > fn.json || true
          jq 'keys' fn.json || true
          jq '.feed[0:3]' fn.json | head -80 || true
      - name: Sleeper trending (find a league)
        run: |
          curl -sS "https://api.sleeper.app/v1/players/nfl/trending/add?limit=2"; echo
