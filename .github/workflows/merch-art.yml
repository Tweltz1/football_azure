name: Merch art (Gemini)

# Makes realistic hat artwork from merch/art/prompts.json with Gemini image generation and commits it to
# merch/art/raw/. Uses GEMINI_IMAGE_KEY (a key from a Google project with billing/credits), else GEMINI_API_KEY.
on:
  push:
    branches: [claude/project-thread-1lvds4]
    paths: ['merch/art/prompts.json', 'scripts/merch-art.mjs', '.github/workflows/merch-art.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: merch-art, cancel-in-progress: false }

jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_KEY: ${{ secrets.GEMINI_IMAGE_KEY || secrets.GEMINI_TRAINING_KEY || secrets.GENINI_TRAINING_KEY || secrets.GEMINI_API_KEY }}
      GEMINI_SRC: ${{ secrets.GEMINI_IMAGE_KEY != '' && 'GEMINI_IMAGE_KEY' || secrets.GEMINI_TRAINING_KEY != '' && 'GEMINI_TRAINING_KEY' || secrets.GENINI_TRAINING_KEY != '' && 'GENINI_TRAINING_KEY' || 'GEMINI_API_KEY' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: echo "Using secret $GEMINI_SRC" && node scripts/merch-art.mjs
      - name: Commit art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add merch/art/raw 2>/dev/null || true
          git commit -q -m "Merch art: Gemini images" || exit 0
          git pull -q --rebase && git push -q
