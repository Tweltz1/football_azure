# Makes a released item namer (item-namer-vN) the one phones use (release item-namer-current), if it does at
# least as well as the current one when it's sure. Training runs do this by themselves; this is for doing it
# by hand (for example force: true to roll back to an older version).
name: Item namer promote

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to promote, for example item-namer-v2
        required: true
      force:
        description: Promote even if it does worse when sure
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: item-namer-promote

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Promote
        run: |
          mkdir cand
          gh release download "${{ inputs.tag }}" -D cand -p namer.f32 -p labels.json -p metrics.json
          python3 ml/item-namer/promote.py --dir cand --tag "${{ inputs.tag }}" ${{ inputs.force && '--force' || '' }}
