name: Update Player Pool

on:
  workflow_dispatch:
    inputs:
      source:
        description: Player pool source.
        required: false
        default: sleeper
        type: choice
        options:
          - sleeper
          - fantasypros
      season:
        description: FantasyPros NFL season year. Leave blank to use the current UTC year.
        required: false
        type: string
      scoring:
        description: FantasyPros scoring format.
        required: false
        default: PPR
        type: choice
        options:
          - PPR
          - HALF
          - STD
      limit:
        description: Number of ranked players to write before appending missing K/DST team coverage.
        required: false
        default: "350"
        type: string
  schedule:
    - cron: "0 11 * * *"

# The live site (Cloudflare Pages) builds from this branch. Scheduled runs always use the
# default branch's copy of this file, so it must name the live branch explicitly.
env:
  PRODUCTION_BRANCH: claude/project-thread-6lgsrr

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update-player-pool:
    name: Update player pool
    runs-on: ubuntu-latest
    env:
      PLAYER_POOL_SOURCE: ${{ github.event.inputs.source || 'sleeper' }}
      PLAYER_POOL_LIMIT: ${{ github.event.inputs.limit || '350' }}
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      FANTASYPROS_SEASON: ${{ github.event.inputs.season }}
      FANTASYPROS_SCORING: ${{ github.event.inputs.scoring || 'PPR' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCTION_BRANCH }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show update source
        run: echo "Updating player pool from $PLAYER_POOL_SOURCE"

      - name: Generate player pool
        run: node scripts/update-player-pool.mjs

      - name: Ensure kicker and defense coverage
        run: node scripts/ensure-player-pool-coverage.mjs

      - name: Check the API still passes its tests
        run: node --test supabase/tests/handlers.test.ts

      - name: Open player pool update PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ env.PRODUCTION_BRANCH }}
          branch: automation/player-pool-live
          delete-branch: true
          commit-message: Update generated player pool
          title: Update generated player pool
          body: |
            Updates the generated player pool.

            Notes:
            - Uses Sleeper by default with no API key required.
            - Manual runs can choose FantasyPros when `FANTASYPROS_API_KEY` is configured.
            - Writes the top ranked player limit first, then appends any missing 32-team K/DST coverage.
            - Existing leagues keep their copied draft pool; new leagues use this generated pool after the PR is merged.
            - This PR merges itself and deploys the new data to hood-league.com.

      # Merges made with GITHUB_TOKEN don't start other workflows, so the Supabase deploy is
      # started by hand here. Cloudflare Pages deploys the site on its own.
      - name: Merge the update and deploy the API
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          gh workflow run deploy-supabase.yml --repo "$GITHUB_REPOSITORY" --ref "$PRODUCTION_BRANCH"
