name: Update FantasyPros Player Pool

on:
  workflow_dispatch:
    inputs:
      season:
        description: NFL season year. Leave blank to use the current UTC year.
        required: false
        type: string
      scoring:
        description: FantasyPros scoring format.
        required: false
        default: PPR
        type: choice
        options:
          - PPR
          - HALF
          - STD
      limit:
        description: Number of ranked players to write into the app pool.
        required: false
        default: "350"
        type: string
  schedule:
    - cron: "0 11 * * 2"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-player-pool:
    name: Update player pool
    runs-on: ubuntu-latest
    env:
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      FANTASYPROS_SEASON: ${{ github.event.inputs.season }}
      FANTASYPROS_SCORING: ${{ github.event.inputs.scoring || 'PPR' }}
      FANTASYPROS_LIMIT: ${{ github.event.inputs.limit || '350' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify FantasyPros API key
        run: |
          if [ -z "$FANTASYPROS_API_KEY" ]; then
            echo "::error::Add FANTASYPROS_API_KEY as a repository secret before running this workflow."
            exit 1
          fi

      - name: Generate player pool
        run: node scripts/update-player-pool.mjs

      - name: Open player pool update PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/fantasypros-player-pool
          delete-branch: true
          commit-message: Update FantasyPros player pool
          title: Update FantasyPros player pool
          body: |
            Updates the generated player pool from FantasyPros NFL consensus rankings.

            Notes:
            - Uses PPR scoring by default and writes the top 350 players.
            - Keeps player image URLs out of the repository.
            - Existing leagues keep their copied draft pool; new leagues use this generated pool after the PR is merged.
            - Rankings data from FantasyPros.
