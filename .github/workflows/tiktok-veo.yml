# AI video clips for the app TikToks, made with Veo through the Gemini API on the paid training key.
# Edit tiktok/veo/clips.json and push; finished clips go to the branch tiktok-veo-clips. clips.json carries
# a hard dollar cap, and clips already on that branch are never made again.
name: TikTok Veo clips

on:
  workflow_dispatch:
  push:
    branches:
      - claude/project-thread-yawy57
    paths:
      - 'tiktok/veo/clips.json'
      - '.github/workflows/tiktok-veo.yml'

permissions:
  contents: write

concurrency:
  group: tiktok-veo
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_TRAINING_KEY || secrets.GENINI_TRAINING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Get clips made so far
        run: |
          mkdir -p clips
          if git fetch --depth=1 origin tiktok-veo-clips; then
            git --work-tree=clips checkout FETCH_HEAD -- . && git reset -q
          fi
          ls -la clips
      - name: Make new clips
        env:
          CLIPS_OUT: ${{ github.workspace }}/clips
        run: python3 tiktok/veo/make_clips.py
      - name: Save clips
        run: |
          cd clips
          git init -q && git checkout -q -b tiktok-veo-clips
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Veo clips" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tiktok-veo-clips
